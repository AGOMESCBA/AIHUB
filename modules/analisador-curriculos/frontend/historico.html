<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Histórico de Análises — IAHub</title>
  <link rel="stylesheet" href="/css/iahub.css">
  <style>
    .analise-card   { background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:12px;transition:border-color .2s; }
    .analise-card:hover { border-color:var(--accent); }
    .analise-header { display:flex;align-items:flex-start;gap:16px; }
    .analise-data   { font-size:11px;color:var(--text-lo);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px; }
    .analise-funcao { font-size:15px;font-weight:700;color:var(--text-hi); }
    .analise-meta   { font-size:12.5px;color:var(--text-lo);margin-top:4px; }
    .analise-stats  { display:flex;gap:14px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);flex-wrap:wrap; }
    .stat-pill      { display:flex;flex-direction:column;align-items:center;background:var(--bg-hover);border-radius:8px;padding:8px 16px;min-width:80px; }
    .stat-pill-val  { font-size:20px;font-weight:700;color:var(--accent); }
    .stat-pill-lbl  { font-size:10.5px;color:var(--text-lo);text-transform:uppercase;letter-spacing:.04em;margin-top:2px; }
    .stat-pill-fin  .stat-pill-val { color:#15803d; }
    .analise-actions { display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);flex-wrap:wrap; }
    .empty-state    { text-align:center;padding:80px 20px;color:var(--text-lo); }
    .empty-state div { font-size:48px;margin-bottom:12px; }
    /* Modal detalhes */
    .modal-det-overlay { position:fixed;inset:0;background:rgba(15,23,42,.58);z-index:300;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto; }
    .modal-det  { background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);width:min(1080px,98vw);max-height:calc(100vh - 48px);position:relative;display:flex;flex-direction:column;box-shadow:var(--shadow-md);overflow:hidden; }
    .modal-det-header { display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding:18px 22px;border-bottom:1px solid var(--border);background:var(--bg-card);flex-shrink:0; }
    .modal-det-title  { font-size:16px;font-weight:700;color:var(--text-hi);line-height:1.35; }
    .modal-det-subtitle { font-size:12.5px;color:var(--text-lo);margin-top:3px; }
    .modal-det-close { background:none;border:none;color:var(--text-lo);font-size:22px;cursor:pointer;line-height:1;padding:2px 0; }
    .modal-det-close:hover { color:var(--text-hi); }
    .modal-det-header > button { background:none !important;border:none !important;color:var(--text-lo) !important;font-size:22px !important;cursor:pointer;line-height:1;padding:2px 0 !important; }
    .modal-det-header > button:hover { color:var(--text-hi) !important; }
    .modal-det-body { padding:18px 22px 22px;overflow-y:auto; }
    .modal-summary-grid { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px; }
    .modal-summary-item { background:var(--bg-base);border:1px solid var(--border);border-radius:8px;padding:12px 14px; }
    .modal-summary-label { color:var(--text-lo);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700; }
    .modal-summary-value { color:var(--text-hi);font-size:20px;font-weight:800;line-height:1;margin-top:5px; }
    /* Reutiliza estilos do analisador */
    .score-bar-wrap { background:var(--bg-hover);border-radius:8px;height:8px;flex:1;overflow:hidden; }
    .score-bar      { height:100%;border-radius:8px; }
    .score-alto     { background:var(--success); }
    .score-medio    { background:var(--warning); }
    .score-baixo    { background:var(--error); }
    .nivel-alto     { background:#dcfce7;color:#15803d; }
    .nivel-medio    { background:#fef9c3;color:#a16207; }
    .nivel-baixo    { background:#fee2e2;color:#b91c1c; }
    .nivel-badge    { padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600; }
    .result-card    { background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:0;margin-bottom:12px;overflow:hidden; }
    .result-card.finalista { border-color:var(--accent);box-shadow:0 0 0 2px rgba(37,99,235,.10); }
    .result-header  { display:flex;align-items:flex-start;gap:14px;padding:16px 18px;border-bottom:1px solid var(--border);background:var(--bg-card); }
    .result-rank    { font-size:20px;font-weight:800;color:var(--text-lo);min-width:34px;text-align:center;padding-top:2px; }
    .result-name    { font-size:14px;font-weight:700;color:var(--text-hi); }
    .result-contact { font-size:12px;color:var(--text-lo);margin-top:2px; }
    .result-score   { margin-left:auto;text-align:right; }
    .result-score-num { font-size:22px;font-weight:800;color:var(--accent);line-height:1; }
    .result-score-lbl { font-size:11px;color:var(--text-lo); }
    .result-body    { padding:14px 18px 16px; }
    .score-row      { display:flex;align-items:center;gap:10px;margin-bottom:10px; }
    .detail-scores  { display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border); }
    .detail-score   { background:var(--bg-base);border:1px solid var(--border);border-radius:8px;text-align:left;min-width:0;padding:10px 12px; }
    .detail-score-val { font-size:16px;font-weight:700;color:var(--accent); }
    .detail-score-lbl { font-size:10px;color:var(--text-lo);text-transform:uppercase;letter-spacing:.05em;margin-top:2px; }
    .badge-finalista{ background:#dbeafe;color:#1e40af;border:1px solid #bfdbfe;border-radius:12px;padding:2px 9px;font-size:11px;font-weight:600; }
    .ponto-list     { font-size:12px;line-height:1.8;margin:0; }
    .ponto-list li  { list-style:none;padding-left:16px;position:relative;color:var(--text-md); }
    .ponto-list li::before { position:absolute;left:0; }
    .ponto-pos li::before  { content:"✓";color:var(--success); }
    .ponto-neg li::before  { content:"●";color:var(--error);font-size:9px;top:3px; }
    .pontos         { display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px; }
    .pontos-box     { background:var(--bg-base);border:1px solid var(--border);border-radius:8px;padding:12px 14px; }
    .resumo         { font-size:12.5px;color:var(--text-md);line-height:1.7;margin-top:12px;padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg-base); }
    .result-actions { margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:flex-end; }
    /* Eliminados no modal */
    .eliminados-table { width:100%;border-collapse:collapse;font-size:12.5px; }
    .eliminados-table th { font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-lo);font-weight:600;padding:6px 10px 6px 0;text-align:left;border-bottom:1px solid var(--border); }
    .eliminados-table td { padding:8px 10px 8px 0;vertical-align:top;border-bottom:1px solid var(--border); }
    .eliminados-table tr:last-child td { border-bottom:none; }
    .eliminados-table .col-nome    { font-weight:600;color:var(--text-hi);width:25%;word-break:break-word; }
    .eliminados-table .col-contato { color:var(--text-lo);width:22%;font-size:11.5px; }
    .eliminados-table .col-motivo  { color:var(--text-lo);font-size:11.5px;line-height:1.5; }
    /* Eliminados toggle */
    .elim-toggle { background:none;border:1px solid var(--border);border-radius:8px;padding:8px 14px;width:100%;text-align:left;cursor:pointer;color:var(--text-md);font-size:12.5px;display:flex;justify-content:space-between;align-items:center; }
    .elim-toggle:hover { background:var(--bg-hover); }
    .se-badge     { display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 10px;font-size:11.5px;font-weight:600; }
    .se-badge-ok  { background:#dcfce7;color:#15803d;border:1px solid #bbf7d0; }
    .se-badge-err { background:#fef9c3;color:#92400e;border:1px solid #fde68a; }
    .se-res-item  { display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px; }
    .se-res-item:last-child { border-bottom:none; }
    @media(max-width: 760px) {
      .modal-det-overlay { padding:10px; }
      .modal-det { max-height:calc(100vh - 20px); }
      .modal-summary-grid,
      .detail-scores,
      .pontos { grid-template-columns:1fr; }
      .result-header { flex-wrap:wrap; }
      .result-score { width:100%;margin-left:48px;text-align:left; }
    }
  </style>
</head>
<body>
<div class="layout">

    <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo" onclick="toggleSidebar()">
      <div class="logo-icon">IA</div>
      <span class="logo-text">IAHub</span>
    </div>
    <div class="sidebar-nav">
    </div>
    <div class="sidebar-footer">
    </div>
    </nav>

  <div class="main">
    <div class="topbar">
      <span class="topbar-title"><span class="topbar-path">Recrutamento › Analisador de Currículos ›</span> Histórico de Análises</span>
    </div>

    <div class="page-content">

      <div id="history-list-view">
      <!-- Filtros -->
      <div class="d-flex gap-3 mb-4" style="align-items:center;flex-wrap:wrap">
        <select id="filtro-vaga" class="form-control" style="max-width:320px" onchange="filtrar()">
          <option value="">Todas as vagas</option>
        </select>
        <span id="total-label" style="font-size:13px;color:var(--text-lo)"></span>
      </div>

      <div id="lista-analises"></div>
      </div>

      <section id="history-detail-view" class="editor-shell d-none">
        <div class="editor-actionbar">
          <button class="btn btn-ghost" type="button" onclick="fecharModal()">Voltar</button>
          <div class="editor-actionbar-title">
            <strong id="modal-det-titulo"></strong>
            <span id="modal-det-subtitulo"></span>
          </div>
        </div>
        <div id="modal-det-body" class="modal-det-body" style="padding:0;overflow:visible"></div>
      </section>

    </div>
  </div>
</div>

<!-- Modal detalhes da análise -->
<div id="modal-det-legacy" class="modal-det-overlay d-none" onclick="if(event.target===this)fecharModal()">
  <div class="modal-det">
    <div class="modal-det-header">
      <div>
        <div class="modal-det-title"></div>
        <div class="modal-det-subtitle"></div>
      </div>
      <button onclick="fecharModal()" style="background:none;border:none;color:var(--text-lo);font-size:22px;cursor:pointer;line-height:1;padding:0">✕</button>
    </div>
    <div class="modal-det-body"></div>
  </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/audit-fields.js"></script>
<script src="/js/sidebar.js"></script>
<script>
  let todasAnalises = [], vagas = [];
  let detalheAtualId = null;

  async function carregar() {
    [todasAnalises, vagas] = await Promise.all([
      fetch('/api/analises').then(r => r.json()),
      fetch('/api/vagas').then(r => r.json()),
    ]);

    // Popula filtro de vagas
    const vagasComAnalise = [...new Set(todasAnalises.map(a => a.vaga_id))];
    const sel = document.getElementById('filtro-vaga');
    vagas
      .filter(v => vagasComAnalise.includes(v.id))
      .forEach(v => {
        const f = v.funcao || {};
        const opt = document.createElement('option');
        opt.value = v.id;
        opt.textContent = `${f.nome || '—'}${f.nivel_experiencia && f.nivel_experiencia !== 'Não especificado' ? ` (${f.nivel_experiencia})` : ''}`;
        sel.appendChild(opt);
      });

    // Auto-filtra se vaga_id na URL
    const params = new URLSearchParams(location.search);
    const vagaId = params.get('vaga_id');
    if (vagaId) sel.value = vagaId;

    filtrar();
    carregarStatusSE();

    const detalheId = params.get('detalhe');
    if (detalheId) {
      await verDetalhes(detalheId, { manterUrl: true });
    }
  }

  function atualizarUrlDetalhe(id, substituir = false) {
    const url = new URL(location.href);
    if (id) url.searchParams.set('detalhe', id);
    else url.searchParams.delete('detalhe');
    const destino = `${url.pathname}${url.search}${url.hash}`;
    const metodo = substituir ? 'replaceState' : 'pushState';
    history[metodo]({ detalhe: id || null }, '', destino);
  }

  async function carregarStatusSE() {
    if (!todasAnalises.length) return;
    const ids = todasAnalises.map(a => a.id);
    try {
      const resumo = await fetch('/api/integracoes/se/resumo-analises', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ analise_ids: ids }),
      }).then(r => r.json());
      for (const [id, s] of Object.entries(resumo)) {
        const elFin    = document.getElementById(`fin-count-${id}`);
        const elStatus = document.getElementById(`se-status-${id}`);
        if (elFin) elFin.textContent = s.sucesso;
        if (!elStatus) continue;
        if (!s.total) { elStatus.innerHTML = ''; continue; }
        if (s.erro > 0) {
          elStatus.innerHTML = `<span class="se-badge se-badge-err">⚠ ${s.sucesso} integrados · ${s.erro} erro${s.erro !== 1 ? 's' : ''}</span>`;
        } else {
          elStatus.innerHTML = `<span class="se-badge se-badge-ok">✓ ${s.sucesso} integrados ao Softexpert</span>`;
        }
      }
    } catch (_) {}
  }

  function filtrar() {
    const vagaId = Number(document.getElementById('filtro-vaga').value) || null;
    const lista  = vagaId ? todasAnalises.filter(a => a.vaga_id === vagaId) : todasAnalises;
    renderLista(lista);
    carregarStatusSE();
  }

  function renderLista(lista) {
    const el = document.getElementById('lista-analises');
    document.getElementById('total-label').textContent = `${lista.length} análise${lista.length !== 1 ? 's' : ''} encontrada${lista.length !== 1 ? 's' : ''}`;

    if (!lista.length) {
      el.innerHTML = `<div class="empty-state"><div>📊</div><strong>Nenhuma análise salva</strong><p style="font-size:13px;margin-top:6px">Após analisar currículos, clique em <strong>Encerrar e Salvar Análise</strong> para registrar aqui.</p></div>`;
      return;
    }

    el.innerHTML = lista.map(a => {
      const dataFmt = new Date(a.data).toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric' });
      const horaFmt = new Date(a.data).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
      const vaga = vagas.find(v => v.id === a.vaga_id);
      const vagaLabel = vaga ? ` · Vaga #${vaga.id} — ${vaga.quantidade} vaga${vaga.quantidade !== 1 ? 's' : ''}` : '';
      const _empH = {
        id: a.empresa_id ?? window._iahubEmpresa?.id ?? '—',
        nome: a.empresa_nome || window._iahubEmpresa?.nome || '—',
      };
      return `
        <div class="analise-card">
          <div style="display:flex;gap:12px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border)">
            <span style="font-size:11px;color:var(--text-lo);font-family:monospace">ID Análise: <strong>${a.id}</strong></span>
            <span style="font-size:11px;color:var(--text-lo);font-family:monospace">Empresa: <strong>${_empH.id}</strong> — ${_empH.nome}</span>
          </div>
          <div class="analise-header">
            <div style="flex:1">
              <div class="analise-data">${dataFmt} às ${horaFmt}</div>
              <div class="analise-funcao">${a.funcao_nome || '—'}</div>
              <div class="analise-meta">${vagaLabel}</div>
            </div>
            <span class="badge" style="background:#dcfce7;color:#15803d;border:1px solid #bbf7d0;align-self:flex-start">Encerrada</span>
          </div>
          <div class="analise-stats">
            <div class="stat-pill">
              <div class="stat-pill-val">${a.total_curriculos}</div>
              <div class="stat-pill-lbl">Recebidos</div>
            </div>
            <div class="stat-pill">
              <div class="stat-pill-val">${a.total_analisados}</div>
              <div class="stat-pill-lbl">Analisados</div>
            </div>
            <div class="stat-pill">
              <div class="stat-pill-val" style="color:#b91c1c">${a.total_eliminados}</div>
              <div class="stat-pill-lbl">Eliminados</div>
            </div>
            <div class="stat-pill stat-pill-fin">
              <div class="stat-pill-val" id="fin-count-${a.id}">0</div>
              <div class="stat-pill-lbl">Integrados SE</div>
            </div>
          </div>
          <div class="analise-actions">
            <button class="btn btn-primary" style="font-size:12px" onclick="verDetalhes('${a.id}')">🔎 Ver Detalhes</button>
            <button class="btn btn-info" style="font-size:12px" id="btn-se-${a.id}" onclick="enviarParaSE('${a.id}', ${a.total_analisados})">🔗 Integrar Softexpert (${a.total_analisados})</button>
            <button class="btn btn-danger" style="font-size:12px;margin-left:auto" onclick="excluir('${a.id}')">🗑 Excluir</button>
          </div>
          <div id="se-status-${a.id}" style="margin-top:8px"></div>
        </div>`;
    }).join('');
  }

  async function verDetalhes(id, opts = {}) {
    detalheAtualId = String(id);
    if (!opts.manterUrl) atualizarUrlDetalhe(detalheAtualId);

    const a = await fetch(`/api/analises/${id}`).then(r => r.json());
    const dataFmt = new Date(a.data).toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
    document.getElementById('modal-det-subtitulo').textContent = 'Resultado salvo da análise, candidatos classificados e registros eliminados na triagem.';
    document.getElementById('modal-det-titulo').textContent = `📊 ${a.funcao_nome} — ${dataFmt}`;

    const resultados  = a.resultados  || [];
    const eliminados  = a.eliminados  || [];
    const finalistasIds = new Set(a.finalistas_ids || []);

    const cards = resultados.map((r, i) => {
      const ehFinalista = finalistasIds.has(r.id);
      const nivelCls = r.nivel === 'Alto' ? 'nivel-alto' : r.nivel === 'Médio' ? 'nivel-medio' : 'nivel-baixo';
      const barCls   = r.nivel === 'Alto' ? 'score-alto' : r.nivel === 'Médio' ? 'score-medio' : 'score-baixo';
      const pos = (r.pontos_positivos || []).map(p => `<li>${p}</li>`).join('');
      const neg = (r.pontos_negativos || []).map(p => `<li>${p}</li>`).join('');
      const det = r.detalhes || {};
      const detHtml = (det.requisitos_obrigatorios !== undefined) ? `
        <div class="detail-scores">
          <div class="detail-score"><div class="detail-score-val">${det.requisitos_obrigatorios ?? '—'}<span style="font-size:10px;color:var(--text-lo)">/40</span></div><div class="detail-score-lbl">Req. Obrigatórios</div></div>
          <div class="detail-score"><div class="detail-score-val">${det.habilidades_tecnicas ?? '—'}<span style="font-size:10px;color:var(--text-lo)">/30</span></div><div class="detail-score-lbl">Habilidades</div></div>
          <div class="detail-score"><div class="detail-score-val">${det.nivel_experiencia ?? '—'}<span style="font-size:10px;color:var(--text-lo)">/15</span></div><div class="detail-score-lbl">Experiência</div></div>
          <div class="detail-score"><div class="detail-score-val">${det.formacao ?? '—'}<span style="font-size:10px;color:var(--text-lo)">/15</span></div><div class="detail-score-lbl">Formação</div></div>
        </div>` : '';
      const retorno = encodeURIComponent(`/historico.html?detalhe=${encodeURIComponent(a.id)}`);
      return `
        <div class="result-card ${ehFinalista ? 'finalista' : ''}">
          <div class="result-header">
            <div class="result-rank">${i + 1}º</div>
            <div>
              <div class="result-name">${r.nome || '—'}${ehFinalista ? ' <span class="badge-finalista">★ Finalista</span>' : ''}</div>
              <div class="result-contact">${r.telefone || ''}${r.telefone && r.email ? ' · ' : ''}${r.email || ''}</div>
              ${r.nivel_candidato ? `<div style="margin-top:4px;font-size:11px;color:var(--text-lo)">Candidato: ${r.nivel_candidato}${r.exp_total ? ` · Total: ${r.exp_total}` : ''}</div>` : ''}
            </div>
            <div class="result-score">
              <div class="result-score-num">${r.score}</div>
              <div class="result-score-lbl">/ 100</div>
              <span class="nivel-badge ${nivelCls}" style="margin-top:4px;display:inline-block">${r.nivel}</span>
            </div>
          </div>
          <div class="result-body">
          <div class="score-row">
            <span style="font-size:11px;color:var(--text-lo);min-width:80px">Compatibilidade</span>
            <div class="score-bar-wrap"><div class="score-bar ${barCls}" style="width:${r.score}%"></div></div>
            <span style="font-size:11.5px;color:var(--text-lo);min-width:30px">${r.score}%</span>
          </div>
          ${detHtml}
          ${pos || neg ? `<div class="pontos">
            ${pos ? `<div class="pontos-box"><div style="font-size:10px;color:var(--success);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">Pontos positivos</div><ul class="ponto-list ponto-pos">${pos}</ul></div>` : ''}
            ${neg ? `<div class="pontos-box"><div style="font-size:10px;color:var(--error);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">Pontos a avaliar</div><ul class="ponto-list ponto-neg">${neg}</ul></div>` : ''}
          </div>` : ''}
          ${r.resumo ? `<div class="resumo">${r.resumo}</div>` : ''}
          <div class="result-actions">
            <a href="/curriculo.html?id=${r.id}&return=${retorno}" class="btn btn-ghost" style="font-size:11.5px;padding:4px 12px">📄 Ver Currículo</a>
          </div>
          </div>
        </div>`;
    }).join('');

    const elimSection = eliminados.length ? `
      <div style="margin-top:20px">
        <button class="elim-toggle" onclick="toggleElim(this)">
          <span>🚫 ${eliminados.length} eliminado${eliminados.length !== 1 ? 's' : ''} na triagem</span>
          <span>▾</span>
        </button>
        <div class="elim-body" style="display:none;background:var(--bg-card);border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;padding:10px 14px">
          <table class="eliminados-table">
            <thead><tr><th>Candidato</th><th>Contato</th><th>Motivo</th></tr></thead>
            <tbody>${eliminados.map(e => `
              <tr>
                <td class="col-nome">${e.nome}</td>
                <td class="col-contato">${e.telefone || '—'}${e.email ? `<br>${e.email}` : ''}</td>
                <td class="col-motivo">${e.motivo || '—'}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>` : '';

    const finCount = finalistasIds.size;
    document.getElementById('modal-det-body').innerHTML = `
      <div class="modal-summary-grid">
        <div class="modal-summary-item"><div class="modal-summary-label">Analisados</div><div class="modal-summary-value">${resultados.length}</div></div>
        <div class="modal-summary-item"><div class="modal-summary-label">Finalistas</div><div class="modal-summary-value" style="color:#15803d">${finCount}</div></div>
        <div class="modal-summary-item"><div class="modal-summary-label">Eliminados</div><div class="modal-summary-value" style="color:#b91c1c">${eliminados.length}</div></div>
      </div>
      ${resultados.length ? cards : '<p style="color:var(--text-lo);font-size:13px">Nenhum candidato analisado.</p>'}
      ${elimSection}`;

    abrirDetalheInline();
  }

  function abrirDetalheInline() {
    document.getElementById('history-list-view').classList.add('d-none');
    document.getElementById('history-detail-view').classList.remove('d-none');
    document.querySelector('.page-content')?.scrollTo({ top: 0, behavior: 'auto' });
  }

  function fecharModal(opts = {}) {
    detalheAtualId = null;
    document.getElementById('history-detail-view').classList.add('d-none');
    document.getElementById('history-list-view').classList.remove('d-none');
    if (!opts.manterUrl) atualizarUrlDetalhe(null);
    document.querySelector('.page-content')?.scrollTo({ top: 0, behavior: 'auto' });
  }

  window.addEventListener('popstate', () => {
    const detalheId = new URLSearchParams(location.search).get('detalhe');
    if (detalheId) {
      verDetalhes(detalheId, { manterUrl: true });
      return;
    }
    fecharModal({ manterUrl: true });
  });

  function toggleElim(btn) {
    const body = btn.nextElementSibling;
    const aberto = body.style.display !== 'none';
    body.style.display = aberto ? 'none' : 'block';
    btn.querySelector('span:last-child').textContent = aberto ? '▾' : '▴';
  }

  async function excluir(id) {
    if (!confirm('Excluir esta análise? A vaga será reaberta automaticamente.')) return;
    const analise = todasAnalises.find(a => a.id === id);
    await fetch(`/api/analises/${id}`, { method: 'DELETE' });
    if (analise?.vaga_id) {
      await fetch(`/api/vagas/${analise.vaga_id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: 'aberta' }),
      });
    }
    todasAnalises = todasAnalises.filter(a => a.id !== id);
    filtrar();
    carregarStatusSE();
  }

  async function enviarParaSE(analise_id, total) {
    if (!confirm(`Enviar ${total} currículo${total !== 1 ? 's' : ''} analisados desta análise ao Softexpert?\n\nCandidatos já enviados anteriormente serão ignorados.`)) return;

    const btn = document.getElementById(`btn-se-${analise_id}`);
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Enviando…'; }

    try {
      const r = await fetch('/api/integracoes/se/enviar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ analise_id }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Erro no envio');

      const { sucesso, erros, ignorados, resultados } = data;
      const el = document.getElementById(`se-status-${analise_id}`);

      const linhas = resultados.map(r => {
        const ico = r.status === 'sucesso' ? '✓' : r.status === 'ignorado' ? '—' : '✗';
        const cor = r.status === 'sucesso' ? '#15803d' : r.status === 'ignorado' ? '#94a3b8' : '#b91c1c';
        const msg = r.status === 'erro' ? ` — ${r.mensagem || ''}` : r.status === 'ignorado' ? ' (já integrado)' : '';
        return `<div class="se-res-item"><span style="color:${cor};font-weight:700">${ico}</span><span>${r.nome || `ID ${r.id}`}${msg}</span></div>`;
      }).join('');

      const resumo = `${sucesso} integrados · ${erros} erros · ${ignorados} ignorados`;
      const badgeClass = erros > 0 ? 'se-badge-err' : 'se-badge-ok';
      if (el) el.innerHTML = `<span class="se-badge ${badgeClass}" style="margin-bottom:6px;display:inline-flex">${erros > 0 ? '⚠' : '✓'} ${resumo}</span>`;
      carregarStatusSE();

      if (btn) {
        btn.disabled = false;
        btn.textContent = `🔗 Integrar Softexpert (${total})`;
      }

      const detModal = `<div style="margin-bottom:14px;font-size:13.5px;color:var(--text-md)">${resumo}</div><div>${linhas}</div>`;
      document.getElementById('modal-det-titulo').textContent = `🔗 Resultado da Integração Softexpert`;
      document.getElementById('modal-det-subtitulo').textContent = 'Resumo do envio dos candidatos analisados para o SoftExpert.';
      document.getElementById('modal-det-body').innerHTML = detModal;
      abrirDetalheInline();
    } catch (err) {
      if (btn) { btn.disabled = false; btn.textContent = `🔗 Integrar Softexpert (${total})`; }
      alert(`✗ Erro ao enviar: ${err.message}`);
    }
  }

  (async () => {
    if (window._iahubAuthReady) await window._iahubAuthReady;
    carregar();
  })();
</script>
</body>
</html>
