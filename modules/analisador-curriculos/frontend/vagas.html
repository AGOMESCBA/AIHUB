<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vagas por Função — IAHub</title>
  <link rel="stylesheet" href="/css/iahub.css">
  <style>
    .modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:center;justify-content:center; }
    .modal         { background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);width:min(520px,95vw);max-height:90vh;overflow-y:auto;padding:28px; }
    .modal-header  { display:flex;justify-content:space-between;align-items:center;margin-bottom:24px; }
    .modal-title   { font-size:16px;font-weight:700;color:var(--text-hi); }
    .modal-close   { background:none;border:none;color:var(--text-lo);font-size:22px;cursor:pointer;line-height:1;padding:0; }
    .modal-close:hover { color:var(--text-hi); }
    .modal-footer  { display:flex;justify-content:flex-end;gap:10px;margin-top:24px;padding-top:20px;border-top:1px solid var(--border); }
    .vagas-grid    { display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px; }
    .vaga-card     { background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:border-color .2s; }
    .vaga-card:hover { border-color:var(--accent); }
    .vaga-funcao   { font-size:15px;font-weight:700;color:var(--text-hi);margin-bottom:6px; }
    .vaga-meta     { font-size:12.5px;color:var(--text-lo);margin-bottom:14px; }
    .vaga-count    { font-size:32px;font-weight:800;color:var(--accent-light);line-height:1; }
    .vaga-count-label { font-size:12px;color:var(--text-lo);margin-top:2px; }
    .vaga-status   { display:inline-flex;align-items:center;gap:5px;font-size:12px;margin-top:10px; }
    .dot           { width:8px;height:8px;border-radius:50%;display:inline-block; }
    .dot-aberta    { background:var(--success); }
    .dot-pausada   { background:var(--warning); }
    .dot-encerrada { background:var(--error); }
    .vaga-actions  { display:flex;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border); }
    .nivel-badge   { padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600; }
    .nivel-junior  { background:#0c2744;color:var(--accent-light); }
    .nivel-pleno   { background:#14532d;color:var(--success); }
    .nivel-senior  { background:#2d1e00;color:var(--warning); }
    .nivel-especialista { background:#1e0c3a;color:#a78bfa; }
    .nivel-nao-especificado { background:var(--bg-hover);color:var(--text-lo); }
    .empty-state   { text-align:center;padding:80px 20px;color:var(--text-lo); }
    .empty-state div { font-size:48px;margin-bottom:12px; }
    .stats-row     { display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px; }
    .stat-mini     { background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px; }
    .stat-mini-val { font-size:22px;font-weight:700;color:var(--accent-light); }
    .stat-mini-lbl { font-size:11.5px;color:var(--text-lo);margin-top:2px; }
    .vaga-card.selecionada { border-color:var(--accent);box-shadow:0 0 0 2px rgba(37,99,235,.15); }
    .se-badge-card { display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:10px;font-size:10.5px;font-weight:600; }
    .se-c-ok  { background:#dcfce7;color:#15803d; }
    .se-c-err { background:#fee2e2;color:#b91c1c; }
    .se-c-par { background:#ffedd5;color:#c2410c; }
    .se-c-rev { background:#fef9c3;color:#92400e; }
    .se-c-pen { background:#f1f5f9;color:#64748b; }
    .sel-bar  { display:none;align-items:center;gap:10px;padding:8px 14px;background:var(--bg-hover);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;font-size:13px; }
    .sel-bar.active { display:flex; }
  </style>
</head>
<body>
<div class="layout">

      <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo" onclick="toggleSidebar()">
      <div class="logo-icon">IA</div>
      <span class="logo-text">IAHub</span>
    </div>
    <div class="sidebar-nav">
    </div>
    <div class="sidebar-footer">
    </div>
    </nav>

  <div class="main">
    <div class="topbar">
      <span class="topbar-title"><span class="topbar-path">Recrutamento ›</span> Vagas por Função</span>
    </div>

    <div class="page-content">
      <div class="stats-row" id="stats-row"></div>

      <div class="d-flex gap-3 mb-3" style="align-items:center">
        <span style="font-size:13.5px;color:var(--text-md)">Vagas cadastradas</span>
        <div class="ms-auto">
          <button class="btn btn-primary" onclick="abrirModal()">＋ Nova Vaga</button>
        </div>
      </div>

      <div class="sel-bar" id="sel-bar">
        <span id="sel-count" style="font-weight:600"></span>
        <span style="color:var(--text-lo);font-size:12px">vaga(s) selecionada(s)</span>
        <button class="btn btn-primary" style="font-size:12px;padding:5px 14px;margin-left:auto" onclick="integrarSelecionados()">🔗 Integrar ao SE</button>
        <button class="btn btn-ghost" style="font-size:12px;padding:5px 10px" onclick="limparSelecao()">✕ Limpar</button>
      </div>

      <div id="vagas-grid" class="vagas-grid"></div>
      <div id="empty" class="empty-state d-none">
        <div>💼</div>
        <strong style="color:var(--text-md)">Nenhuma vaga cadastrada</strong>
        <p style="font-size:13px;margin-top:6px">Clique em <strong>+ Nova Vaga</strong> para começar.</p>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div id="modal" class="modal-overlay d-none">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Nova Vaga</span>
      <button class="modal-close" onclick="fecharModal()">✕</button>
    </div>
    <!-- Campos de Auditoria -->
    <div class="form-row-3 audit-row" style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)">
      <div class="form-group">
        <label class="form-label" style="color:var(--text-lo)">ID do Registro</label>
        <input type="text" id="v-audit-id" class="form-control" disabled style="color:var(--text-lo);background:var(--bg-hover);font-family:monospace;font-size:13px">
      </div>
      <div class="form-group">
        <label class="form-label" style="color:var(--text-lo)">ID da Empresa</label>
        <input type="text" id="v-audit-emp-id" class="form-control" disabled style="color:var(--text-lo);background:var(--bg-hover);font-family:monospace;font-size:13px">
      </div>
      <div class="form-group">
        <label class="form-label" style="color:var(--text-lo)">Empresa</label>
        <input type="text" id="v-audit-emp-nome" class="form-control" disabled style="color:var(--text-lo);background:var(--bg-hover);font-size:13px">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Função *</label>
      <select id="v-funcao" class="form-control"></select>
    </div>
    <div class="form-group">
      <label class="form-label">Quantidade de Vagas *</label>
      <input type="number" id="v-qtd" class="form-control" min="1" value="1">
    </div>
    <div class="form-group">
      <label class="form-label">Status</label>
      <select id="v-status" class="form-control">
        <option value="aberta">Aberta</option>
        <option value="pausada">Pausada</option>
        <option value="encerrada">Encerrada</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Observações</label>
      <textarea id="v-obs" class="form-control" rows="3" style="resize:vertical;min-height:70px;font-family:inherit;box-sizing:border-box" placeholder="Informações adicionais sobre esta vaga..."></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvar()">Salvar Vaga</button>
    </div>
  </div>
</div>

<script src="/js/audit-fields.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/sidebar.js"></script>
<script>
  const NIVEIS = {
    'Júnior': 'nivel-junior', 'Pleno': 'nivel-pleno',
    'Sênior': 'nivel-senior', 'Especialista': 'nivel-especialista',
    'Não especificado': 'nivel-nao-especificado',
  };
  const STATUS_DOT   = { aberta: 'dot-aberta', pausada: 'dot-pausada', encerrada: 'dot-encerrada' };
  const STATUS_LABEL = { aberta: 'Aberta', pausada: 'Pausada', encerrada: 'Encerrada' };

  let vagas = [], funcoes = [], analises = [], editandoId = null;
  let _seStatusMap = {}, _selecionados = new Set();

  function seBadgeCard(vagaId) {
    const st = _seStatusMap[vagaId];
    const cfg = {
      sucesso:  ['se-c-ok',  '✓ Integrado'],
      erro:     ['se-c-err', '✗ Erro SE'],
      parcial:  ['se-c-par', '⚠ Parcial'],
      revertido:['se-c-rev', '↩ Revertido'],
    };
    const [cls, label] = cfg[st] || ['se-c-pen', '● Não integrado'];
    return `<span class="se-badge-card ${cls}">${label}</span>`;
  }

  function toggleSel(id) {
    if (_selecionados.has(id)) _selecionados.delete(id);
    else _selecionados.add(id);
    atualizarSelBar();
    renderGrid();
  }

  function atualizarSelBar() {
    const bar = document.getElementById('sel-bar');
    document.getElementById('sel-count').textContent = _selecionados.size;
    bar.classList.toggle('active', _selecionados.size > 0);
  }

  function limparSelecao() { _selecionados.clear(); atualizarSelBar(); renderGrid(); }

  async function integrarSelecionados() {
    if (!_selecionados.size) return;
    const ids = [..._selecionados];
    if (!confirm(`Integrar ${ids.length} vaga(s) ao SE?`)) return;
    try {
      const r = await fetch('/api/integracoes/se-vaga/enviar', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ vaga_ids: ids }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Erro');
      alert(`✓ Integração concluída — ${data.sucesso} sucesso, ${data.erros} erro(s).`);
      limparSelecao();
      await carregarSEStatus();
      renderGrid();
    } catch (err) { alert(`✗ Erro: ${err.message}`); }
  }

  async function integrarVaga(id) {
    if (!confirm(`Integrar Vaga #${id} ao SE?`)) return;
    try {
      const r = await fetch('/api/integracoes/se-vaga/enviar', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ vaga_ids: [id] }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Erro');
      const st = data.resultados?.[0]?.status || '?';
      alert(`✓ Integração concluída — status: ${st}`);
      await carregarSEStatus();
      renderGrid();
    } catch (err) { alert(`✗ Erro: ${err.message}`); }
  }

  async function carregarSEStatus() {
    try { _seStatusMap = await fetch('/api/integracoes/se-vaga/status-mapa').then(r => r.json()); }
    catch { _seStatusMap = {}; }
  }

  async function carregar() {
    [vagas, funcoes, analises] = await Promise.all([
      fetch('/api/vagas').then(r => r.json()),
      fetch('/api/funcoes').then(r => r.json()),
      fetch('/api/analises').then(r => r.json()),
    ]);
    await carregarSEStatus();
    renderStats();
    renderGrid();
  }

  function renderStats() {
    const total    = vagas.reduce((s, v) => s + (v.quantidade || 0), 0);
    const abertas  = vagas.filter(v => v.status === 'aberta').reduce((s, v) => s + (v.quantidade || 0), 0);
    const funcTotal = new Set(vagas.map(v => v.funcao_id)).size;
    document.getElementById('stats-row').innerHTML = `
      <div class="stat-mini"><div class="stat-mini-val">${total}</div><div class="stat-mini-lbl">Total de vagas</div></div>
      <div class="stat-mini"><div class="stat-mini-val" style="color:var(--success)">${abertas}</div><div class="stat-mini-lbl">Vagas abertas</div></div>
      <div class="stat-mini"><div class="stat-mini-val">${funcTotal}</div><div class="stat-mini-lbl">Funções com vaga</div></div>
    `;
  }

  function renderGrid() {
    const grid  = document.getElementById('vagas-grid');
    const empty = document.getElementById('empty');
    if (!vagas.length) { grid.innerHTML = ''; empty.classList.remove('d-none'); return; }
    empty.classList.add('d-none');
    grid.innerHTML = vagas.map(v => {
      const f            = v.funcao || {};
      const vagaAnalises = analises.filter(a => a.vaga_id === v.id);
      const nivelCls  = NIVEIS[f.nivel_experiencia] || 'nivel-nao-especificado';
      const selecionada = _selecionados.has(v.id);
      return `
      <div class="vaga-card${selecionada ? ' selecionada' : ''}">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border)">
          <input type="checkbox" ${selecionada?'checked':''} onclick="toggleSel(${v.id})" style="width:14px;height:14px;cursor:pointer;accent-color:var(--accent);flex-shrink:0">
          ${['ID: ' + v.id, 'Emp: ' + (v.empresa_id || (window._iahubEmpresa?.id || '—')), window._iahubEmpresa?.nome || '—'].map(t =>
            `<span style="font-size:10.5px;color:var(--text-lo);background:var(--bg-hover);border-radius:4px;padding:2px 7px;font-family:monospace">${t}</span>`
          ).join('')}
          <span style="margin-left:auto">${seBadgeCard(v.id)}</span>
        </div>
        <div class="vaga-funcao">${f.nome || '—'}</div>
        <div class="vaga-meta">
          ${f.area ? `<span>${f.area}</span>` : ''}
          ${f.nivel_experiencia ? `&nbsp;·&nbsp;<span class="nivel-badge ${nivelCls}">${f.nivel_experiencia}</span>` : ''}
        </div>
        <div class="vaga-count">${v.quantidade}</div>
        <div class="vaga-count-label">vaga${v.quantidade !== 1 ? 's' : ''} disponível${v.quantidade !== 1 ? 'eis' : ''}</div>
        <div class="vaga-status">
          <span class="dot ${STATUS_DOT[v.status] || 'dot-aberta'}"></span>
          <span style="color:var(--text-md)">${STATUS_LABEL[v.status] || v.status}</span>
        </div>
        ${v.observacoes ? `<div style="margin-top:10px;font-size:12.5px;color:var(--text-lo);line-height:1.6">${v.observacoes}</div>` : ''}
        <div class="vaga-actions">
          ${v.status === 'encerrada'
            ? `<span class="btn btn-ghost" style="font-size:12px;flex:1;text-align:center;opacity:.45;cursor:not-allowed" title="Vaga encerrada — reabra a vaga para analisar">🔒 Encerrada</span>`
            : `<a href="/analisador.html?vaga_id=${v.id}" class="btn btn-info" style="font-size:12px;flex:1;text-align:center">🔍 Analisar</a>`
          }
          ${v.status === 'encerrada'
            ? `<button class="btn btn-ghost" style="font-size:12px;opacity:.45;cursor:not-allowed" disabled>✏️ Editar</button>`
            : `<button class="btn btn-ghost" style="font-size:12px" onclick="editar(${v.id})">✏️ Editar</button>`
          }
          <button class="btn btn-ghost" style="font-size:12px;color:#6d28d9" onclick="integrarVaga(${v.id})" title="Integrar ao SE">🔗</button>
          ${v.status === 'encerrada'
            ? `<button class="btn btn-ghost" style="font-size:12px;opacity:.45;cursor:not-allowed" disabled>🗑</button>`
            : `<button class="btn btn-danger" style="font-size:12px" onclick="excluir(${v.id})">🗑</button>`
          }
        </div>
        ${vagaAnalises.length ? `
        <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <div>
            <div style="font-size:12px;color:var(--text-lo)">Última análise: <strong style="color:var(--text-md)">${new Date(vagaAnalises[0].data).toLocaleDateString('pt-BR')}</strong></div>
            <div style="font-size:11.5px;color:var(--text-lo)">${vagaAnalises[0].total_analisados} analisados · ${vagaAnalises[0].finalistas_count} finalista${vagaAnalises[0].finalistas_count !== 1 ? 's' : ''}</div>
          </div>
          <a href="/historico.html?vaga_id=${v.id}" class="btn btn-ghost ms-auto" style="font-size:12px">📊 Ver Análises (${vagaAnalises.length})</a>
        </div>` : ''}
      </div>`;
    }).join('');
  }

  async function abrirModal(v = null) {
    editandoId = v ? v.id : null;
    document.getElementById('modal-title').textContent = v ? 'Editar Vaga' : 'Nova Vaga';
    const _emp = window._iahubEmpresa || { id: '—', nome: '—' };
    document.getElementById('v-audit-id').value       = v?.id ?? '—';
    document.getElementById('v-audit-emp-id').value   = _emp.id;
    document.getElementById('v-audit-emp-nome').value = _emp.nome;
    // Popula select de funções
    const sel = document.getElementById('v-funcao');
    sel.innerHTML = funcoes.length
      ? funcoes.map(f => `<option value="${f.id}">${f.nome}</option>`).join('')
      : '<option value="">Nenhuma função cadastrada</option>';
    if (v) {
      sel.value = v.funcao_id;
      document.getElementById('v-qtd').value    = v.quantidade || 1;
      document.getElementById('v-status').value = v.status || 'aberta';
      document.getElementById('v-obs').value    = v.observacoes || '';
    } else {
      document.getElementById('v-qtd').value    = 1;
      document.getElementById('v-status').value = 'aberta';
      document.getElementById('v-obs').value    = '';
    }
    document.getElementById('modal').classList.remove('d-none');
  }

  function fecharModal() { document.getElementById('modal').classList.add('d-none'); }

  async function salvar() {
    const funcao_id  = Number(document.getElementById('v-funcao').value);
    const quantidade = Number(document.getElementById('v-qtd').value);
    if (!funcao_id)  { alert('Selecione uma função.'); return; }
    if (quantidade < 1) { alert('A quantidade deve ser pelo menos 1.'); return; }
    const body = {
      funcao_id,
      quantidade,
      status:      document.getElementById('v-status').value,
      observacoes: document.getElementById('v-obs').value.trim(),
    };
    const url    = editandoId ? `/api/vagas/${editandoId}` : '/api/vagas';
    const method = editandoId ? 'PUT' : 'POST';
    await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    fecharModal();
    carregar();
  }

  async function editar(id) {
    const v = await fetch(`/api/vagas/${id}`).then(r => r.json());
    await abrirModal(v);
  }

  async function excluir(id) {
    if (!confirm('Excluir esta vaga? Esta ação não pode ser desfeita.')) return;
    await fetch(`/api/vagas/${id}`, { method: 'DELETE' });
    carregar();
  }

  (async () => {
    await window._iahubAuthReady;
    carregar();
  })();
</script>
</body>
</html>
