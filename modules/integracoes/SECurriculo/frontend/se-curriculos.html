<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SE Currículos — IAHub</title>
  <link rel="stylesheet" href="/css/iahub.css">
  <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator_simple.min.css">
  <style>
    .stats-row   { display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px; }
    .stat-card   { background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px; }
    .stat-val    { font-size:26px;font-weight:800;line-height:1; }
    .stat-lbl    { font-size:11.5px;color:var(--text-lo);margin-top:4px;text-transform:uppercase;letter-spacing:.04em; }

    .filter-bar { display:flex;align-items:center;gap:10px;margin-bottom:18px; }
    .filter-bar .form-control { margin:0;height:36px;font-size:13px; }
    .filter-bar select.form-control { min-width:150px; }

    .cfg-info    { background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 18px;margin-bottom:18px;display:flex;align-items:center;gap:10px;font-size:13px; }
    .cfg-info-lbl { color:var(--text-lo); }
    .cfg-info-val { font-weight:600;color:var(--text-hi); }
    .cfg-info a  { font-size:12px;color:var(--accent);margin-left:auto; }

    /* Group panel */
    .gp-wrap      { margin-bottom:10px; }
    .gp-chips-row { display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px;position:relative; }
    .gp-label     { font-size:11px;color:var(--text-lo);white-space:nowrap; }

    /* Tabulator skin */
    .tabulator { font-family:inherit;font-size:14px;border:none !important; }
    .tabulator .tabulator-header { background:var(--bg-hover);border-bottom:1px solid var(--border) !important; }
    .tabulator .tabulator-col { background:transparent;border-right:none !important; }
    .tabulator .tabulator-col-title { font-size:11px;color:var(--text-lo);font-weight:600;text-transform:uppercase;letter-spacing:.04em; }
    .tabulator-row { border-bottom:1px solid var(--border) !important;cursor:pointer; }
    .tabulator-row:hover { background:var(--bg-hover) !important; }
    .tabulator-cell { border-right:none !important;padding:9px 12px;vertical-align:middle; }
    .tabulator-header-filter input,
    .tabulator-header-filter select {
      width:100%;font-size:11px;border:1px solid var(--border);
      border-radius:4px;padding:3px 6px;background:#fff;color:var(--text);margin-top:4px;
    }
    .tabulator-group { background:var(--bg-hover) !important;border-bottom:1px solid var(--border) !important;font-weight:600;font-size:13px;padding:8px 14px !important; }

    /* Badges */
    .badge-status   { display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap; }
    .badge-sucesso  { background:#dcfce7;color:#15803d; }
    .badge-manual   { background:#dbeafe;color:#1d4ed8; }
    .badge-erro     { background:#fee2e2;color:#b91c1c; }
    .badge-ignorado { background:#f1f5f9;color:#64748b; }
    .badge-revertido{ background:#fef9c3;color:#92400e; }
    .badge-parcial  { background:#ffedd5;color:#c2410c; }

    /* Modal */
    .modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto; }
    .modal-box     { background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);width:min(780px,98vw);padding:28px;position:relative; }
    .modal-box.wide { width:min(1000px,98vw); }
    .modal-title   { font-size:16px;font-weight:700;color:var(--text-hi);margin-bottom:20px;display:flex;justify-content:space-between;align-items:center; }
    .detail-grid   { display:grid;grid-template-columns:1fr 1fr;gap:12px; }
    .detail-item   { background:var(--bg-hover);border-radius:8px;padding:10px 14px; }
    .detail-item-lbl { font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-lo);margin-bottom:4px; }
    .detail-item-val { font-size:13px;color:var(--text-hi);font-weight:500;word-break:break-word; }
    .detail-item.full { grid-column:1/-1; }
    .detail-item.erro-box { background:#fef2f2;border:1px solid #fecaca; }
    .detail-item.erro-box .detail-item-val { color:#b91c1c; }
    .detail-item.ok-box  { background:#f0fdf4;border:1px solid #bbf7d0; }
    .expand-toggle { font-size:11.5px;color:var(--accent);cursor:pointer;user-select:none;margin-top:6px;display:inline-block; }
    .expand-toggle:hover { text-decoration:underline; }
    .expand-content { display:none;margin-top:8px;background:var(--bg-main);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-size:11.5px;font-family:monospace;line-height:1.5;overflow-x:auto;max-height:260px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;color:var(--text-md); }
    .expand-content.open { display:block; }
    .badge-http { display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:700;font-family:monospace; }
    .badge-http.ok  { background:#dcfce7;color:#15803d; }
    .badge-http.err { background:#fee2e2;color:#b91c1c; }
    .badge-http.nul { background:#f1f5f9;color:#64748b; }

    /* Steps table */
    .steps-section { margin-top:20px; }
    .steps-section-title { font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-lo);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px; }
    .steps-tbl { width:100%;border-collapse:collapse;font-size:13px; }
    .steps-tbl th { background:var(--bg-hover);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-lo);font-weight:600;padding:7px 10px;text-align:left;border-bottom:1px solid var(--border); }
    .steps-tbl td { padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle; }
    .steps-tbl tr:last-child td { border-bottom:none; }
    .steps-tbl tr:hover td { background:var(--bg-hover); }
    .step-status-ok   { color:#15803d;font-weight:600; }
    .step-status-err  { color:#b91c1c;font-weight:600; }
    .step-status-warn { color:#c2410c;font-weight:600; }
    .steps-loading { text-align:center;padding:24px;color:var(--text-lo);font-size:13px; }

    /* Step result inline */
    .step-result { font-size:11.5px;margin-top:4px;padding:4px 8px;border-radius:4px; }
    .step-result.ok  { background:#dcfce7;color:#15803d; }
    .step-result.err { background:#fee2e2;color:#b91c1c; }

    @media(max-width:640px) {
      .stats-row { grid-template-columns:1fr 1fr; }
      .detail-grid { grid-template-columns:1fr; }
      .config-row { grid-template-columns:1fr; }
      .source-options { flex-direction:column; }
    }
  </style>
</head>
<body>
<div class="layout">

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo" onclick="toggleSidebar()">
      <div class="logo-icon">IA</div>
      <span class="logo-text">IAHub</span>
    </div>
    <div class="sidebar-nav"></div>
    <div class="sidebar-footer"></div>
  </nav>

  <div class="main">
    <div class="topbar">
      <span class="topbar-title"><span class="topbar-path">Integrações ›</span> SE Currículos</span>
    </div>

    <div class="page-content">

      <!-- Indicador de configuração ativa -->
      <div class="cfg-info">
        <span class="cfg-info-lbl">Modo:</span>
        <span class="cfg-info-val" id="cfg-modo-label">Carregando...</span>
        <a href="/se-integracoes-config.html?returnTab=curriculos&configTab=curriculos">⚙ Alterar configuração</a>
      </div>

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-card"><div class="stat-val" id="s-total"     style="color:var(--accent)">—</div><div class="stat-lbl">Total de Envios</div></div>
        <div class="stat-card"><div class="stat-val" id="s-sucesso"  style="color:var(--success)">—</div><div class="stat-lbl">Sucesso</div></div>
        <div class="stat-card"><div class="stat-val" id="s-revertido" style="color:#92400e">—</div><div class="stat-lbl">Revertidos</div></div>
        <div class="stat-card"><div class="stat-val" id="s-erro"     style="color:var(--error)">—</div><div class="stat-lbl">Erros</div></div>
        <div class="stat-card"><div class="stat-val" id="s-taxa"     style="color:var(--accent-2)">—</div><div class="stat-lbl">Taxa de Sucesso</div></div>
      </div>

      <!-- Filtros -->
      <div class="filter-bar">
        <select id="f-status" class="form-control" onchange="aplicarFiltros()">
          <option value="">Todos os status</option>
          <option value="sucesso">Sucesso (API)</option>
          <option value="parcial">Parcial</option>
          <option value="erro">Erro</option>
          <option value="ignorado">Ignorado</option>
          <option value="revertido">Revertido</option>
        </select>
        <select id="f-vaga" class="form-control" onchange="aplicarFiltros()">
          <option value="">Todas as vagas</option>
        </select>
        <button class="btn btn-primary" style="font-size:12px;height:36px;margin-left:auto" onclick="carregar()">↻ Atualizar</button>
      </div>

      <!-- Painel de agrupamento -->
      <div class="gp-wrap">
        <div class="gp-chips-row" id="gp-chips-row">
          <span class="gp-label">Agrupar por:</span>
        </div>
        <div id="dz"></div>
      </div>

      <!-- Grid -->
      <div class="card">
        <div class="card-body" style="padding:0">
          <div style="display:flex;align-items:center;padding:10px 16px">
            <span id="count" class="text-muted text-sm"></span>
          </div>
          <div style="overflow-x:auto"><div id="tabela"></div></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Modal XML -->
<div id="modal-xml" class="modal-overlay d-none" style="z-index:400" onclick="if(event.target===this)fecharModalXML()">
  <div class="modal-box" style="width:min(860px,98vw)">
    <div class="modal-title">
      <span id="xml-titulo">XML Enviado ao Softexpert</span>
      <button onclick="fecharModalXML()" style="background:none;border:none;color:var(--text-lo);font-size:22px;cursor:pointer;line-height:1;padding:0">✕</button>
    </div>
    <div style="margin-bottom:10px;display:flex;gap:8px;align-items:center">
      <span id="xml-meta" style="font-size:12px;color:var(--text-lo);flex:1"></span>
      <button class="btn btn-ghost" style="font-size:12px" onclick="copiarXML(this)">📋 Copiar XML</button>
    </div>
    <pre id="xml-content" style="background:var(--bg-main);border:1px solid var(--border);border-radius:8px;padding:14px 16px;font-size:11.5px;font-family:monospace;line-height:1.6;overflow:auto;max-height:520px;white-space:pre-wrap;word-break:break-all;color:var(--text-md);margin:0"></pre>
    <div style="margin-top:14px;display:flex;justify-content:flex-end">
      <button class="btn btn-primary" onclick="fecharModalXML()">Fechar</button>
    </div>
  </div>
</div>

<!-- Modal detalhe -->
<div id="modal" class="modal-overlay d-none" onclick="if(event.target===this)fecharModal()">
  <div class="modal-box wide">
    <div class="modal-title">
      <span id="modal-titulo">Detalhes da Integração</span>
      <button onclick="fecharModal()" style="background:none;border:none;color:var(--text-lo);font-size:22px;cursor:pointer;line-height:1;padding:0">✕</button>
    </div>
    <div id="modal-body"></div>
    <div style="margin-top:20px;display:flex;justify-content:flex-end;gap:10px" id="modal-actions"></div>
  </div>
</div>

<script src="/js/audit-fields.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/grid-group-panel.js"></script>
<script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
<script>
let todos  = [];
let vagas  = [];
let table  = null;
let _modalLog = null;
const _seLogsMap = {};

const gp = createGroupPanel({
  chipsRowId: 'gp-chips-row',
  dropZoneId: 'dz',
  storageKey: 'se_curriculos_group_fields',
  getTable  : () => table,
});

// ── Funções de ação chamadas pelos botões inline ────────────────
window._acaoReenviar    = seq => reenviar(_seLogsMap[seq]);
window._acaoMarcarOK    = seq => marcarOK(_seLogsMap[seq]);
window._acaoDesvincular = seq => desvincular(_seLogsMap[seq]);
window._acaoVerConteudo = (seq, tipo) => verConteudo(_seLogsMap[seq], tipo);

// ── Config (leitura para o indicador) ──────────────────────────
async function carregarConfig() {
  try {
    const [cfg, flows] = await Promise.all([
      fetch('/api/integracoes/se/config').then(r => r.json()),
      fetch('/api/integracoes/se/flows').then(r => r.json()),
    ]);
    const el = document.getElementById('cfg-modo-label');
    if (cfg.integration_source === 'grid' && cfg.se_api_grid_flow_id) {
      const gf = flows.find(f => f.id === cfg.se_api_grid_flow_id);
      el.textContent = gf ? `🗂 GRID: ${gf.nome}` : '🗂 GRID configurado';
      el.style.color = '#7c3aed';
    } else if (cfg.integration_source === 'flow' && cfg.se_api_flow_id) {
      const flow = flows.find(f => f.id === cfg.se_api_flow_id);
      el.textContent = flow ? `⚡ Flow: ${flow.nome}` : '⚡ Flow configurado';
      el.style.color = '#6d28d9';
    } else {
      el.textContent = 'Padrão (legada)';
      el.style.color = 'var(--text-hi)';
    }
  } catch { document.getElementById('cfg-modo-label').textContent = 'Erro ao carregar'; }
}

// ── Tabulator ──────────────────────────────────────────────────
function initTabulator(data) {
  table = new Tabulator('#tabela', {
    data,
    index: '_seq',
    layout: 'fitDataFill',
    movableColumns: true,
    columnDefaults: { resizable: true, headerSort: true },
    groupBy: gp.getActiveFields(),
    groupStartOpen: true,
    columns: [
      {
        title: 'Candidato', field: 'curriculo_nome',
        minWidth: 200,
        headerFilter: true,
        formatter: c => {
          const l = c.getRow().getData();
          return `<div style="font-weight:600;color:var(--text-hi)">${esc(l.curriculo_nome || '—')}</div>
                  <div style="font-size:11.5px;color:var(--text-lo)">${esc(l.curriculo_email || '')}${l.curriculo_telefone ? `<br>${esc(l.curriculo_telefone)}` : ''}</div>`;
        }
      },
      {
        title: 'Vaga / Análise', field: 'vaga_nome',
        minWidth: 180,
        headerFilter: true,
        formatter: c => {
          const l = c.getRow().getData();
          return `<div style="font-weight:600;color:var(--text-hi)">${esc(l.vaga_nome || '—')}</div>
                  <div style="font-size:11.5px;color:var(--text-lo);font-family:monospace">${esc(l.analise_id || '')}</div>`;
        }
      },
      {
        title: 'Integração', field: 'integration_source', width: 160, minWidth: 150,
        headerFilter: false,
        formatter: c => {
          const l = c.getRow().getData();
          if (l.integration_source === 'flow' && l.flow_nome)
            return `<span style="font-size:12px;color:#6d28d9;font-weight:600" title="Flow: ${esc(l.flow_nome)}">⚡ ${esc(l.flow_nome)}</span>`;
          return `<span style="font-size:12px;color:var(--text-lo)">Padrão</span>`;
        }
      },
      {
        title: 'Data', field: 'data_envio', width: 130, minWidth: 120,
        sorter: 'datetime', sorterParams: { format: 'iso' },
        formatter: c => {
          const dt = new Date(c.getValue());
          return `<div style="font-size:12px;white-space:nowrap">${dt.toLocaleDateString('pt-BR')}</div>
                  <div style="font-size:11px;color:var(--text-lo)">${dt.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit', second:'2-digit' })}</div>`;
        }
      },
      {
        title: 'Status', field: 'status', width: 175, minWidth: 150,
        formatter: c => statusBadgeFor(c.getRow().getData())
      },
      {
        title: 'Detalhes', field: 'erro_mensagem',
        minWidth: 180,
        headerFilter: true, groupable: false,
        formatter: c => {
          const l = c.getRow().getData();
          if (l.status === 'erro')
            return `<span style="font-size:12px;color:#b91c1c;word-break:break-word">${esc((l.erro_mensagem || '').slice(0, 90))}${(l.erro_mensagem || '').length > 90 ? '…' : ''}</span>`;
          if (l.status === 'parcial')
            return `<span style="font-size:12px;color:#c2410c">Flow parcial — clique para ver steps</span>`;
          if (l.status === 'ignorado')
            return `<span style="font-size:12px;color:var(--text-lo)">Já integrado anteriormente</span>`;
          if (l.status === 'revertido')
            return `<span style="font-size:12px;color:#92400e">Revertido — aguardando reintegração</span>`;
          if (l.origem === 'manual')
            return `<span style="font-size:12px;color:#15803d">Marcado manualmente como integrado</span>`;
          if (l.integration_source === 'flow')
            return `<span style="font-size:12px;color:#15803d">Flow executado com sucesso</span>`;
          return `<span style="font-size:12px;color:#15803d">Enviado via API com sucesso</span>`;
        }
      },
      {
        title: 'Data (dia)', field: 'data_dia', visible: false,
      },
      {
        title: 'Ações', field: '_seq',
        headerFilter: false, headerSort: false, width: 230, minWidth: 230, groupable: false,
        formatter: c => {
          const l   = c.getRow().getData();
          const seq = l._seq;
          let btns  = '';

          if (l.status === 'erro' || l.status === 'revertido' || l.status === 'parcial') {
            if (l.ja_integrado) {
              btns += `<span style="font-size:11px;color:var(--text-lo);font-style:italic;padding:2px 4px">✓ Já integrado</span>`;
            } else {
              btns += `<button class="btn btn-ghost" style="font-size:11px;padding:3px 7px" onclick="event.stopPropagation();_acaoReenviar(${seq})" title="Reenviar">↺ Reenviar</button>`;
              if (l.status !== 'parcial')
                btns += `<button class="btn btn-ghost" style="font-size:11px;padding:3px 7px;color:#1d4ed8" onclick="event.stopPropagation();_acaoMarcarOK(${seq})" title="Marcar como integrado">✓ OK</button>`;
            }
          } else if (l.status === 'sucesso') {
            btns += `<button class="btn btn-ghost" style="font-size:11px;padding:3px 7px;color:#92400e" onclick="event.stopPropagation();_acaoDesvincular(${seq})" title="Mudar para Revertido">⇄</button>`;
          }

          if (l.xml_enviado)
            btns += `<button class="btn btn-ghost" style="font-size:11px;padding:3px 7px;color:#6366f1" onclick="event.stopPropagation();_acaoVerConteudo(${seq},'xml')" title="Ver XML enviado">📋 XML</button>`;
          if (l.resposta_api)
            btns += `<button class="btn btn-ghost" style="font-size:11px;padding:3px 7px;color:#0891b2" onclick="event.stopPropagation();_acaoVerConteudo(${seq},'ret')" title="Ver XML de retorno">📋 Ret</button>`;

          return `<div style="display:flex;gap:3px;flex-wrap:wrap">${btns}</div>`;
        }
      }
    ],
    dataFiltered: filteredData => {
      const t = filteredData.length;
      document.getElementById('count').textContent =
        t === todos.length
          ? `${t} registro${t !== 1 ? 's' : ''}`
          : `${t} de ${todos.length} registro${todos.length !== 1 ? 's' : ''}`;
    },
  });
}

// ── Helpers ────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function statusBadgeFor(l, big) {
  const sz = big ? 'font-size:13px' : '';
  if (l.status === 'sucesso' && l.origem === 'manual')
    return `<span class="badge-status badge-manual" style="${sz}">✓ Integrado (manual)</span>`;
  if (l.status === 'sucesso')
    return `<span class="badge-status badge-sucesso" style="${sz}">✓ Sucesso</span>`;
  if (l.status === 'parcial')
    return `<span class="badge-status badge-parcial" style="${sz}">⚠ Parcial</span>`;
  if (l.status === 'erro')
    return `<span class="badge-status badge-erro" style="${sz}">✗ Erro</span>`;
  if (l.status === 'revertido')
    return `<span class="badge-status badge-revertido" style="${sz}">↩ Revertido</span>`;
  return `<span class="badge-status badge-ignorado" style="${sz}">— Ignorado</span>`;
}

// ── Carregamento ───────────────────────────────────────────────
async function carregar() {
  const data = await fetch('/api/integracoes/se/logs?limit=99999').then(r => r.json());
  const empNome = window._iahubEmpresa?.nome || '—';

  todos = (data.logs || []).map(l => {
    const row = {
      ...l,
      empresa_nome: empNome,
      data_dia: l.data_envio ? new Date(l.data_envio).toLocaleDateString('pt-BR') : '—',
    };
    _seLogsMap[l._seq] = row;
    return row;
  });

  atualizarStats(todos);

  if (!table) {
    initTabulator(todos);
    table.on('rowClick', (_e, row) => verDetalhes(row.getData()));
    setTimeout(() => gp.refresh(), 0);
  } else {
    await table.replaceData(todos);
  }

  document.getElementById('count').textContent =
    `${todos.length} registro${todos.length !== 1 ? 's' : ''}`;

  applyTableFilters();
}

async function carregarVagas() {
  vagas = await fetch('/api/vagas').then(r => r.json()).catch(() => []);
  const sel = document.getElementById('f-vaga');
  const uniq = [...new Map(vagas.map(v => [v.id, v])).values()];
  uniq.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v.id;
    opt.textContent = v.funcao?.nome || `Vaga #${v.id}`;
    sel.appendChild(opt);
  });
}

function atualizarStats(logs) {
  const total     = logs.length;
  const sucesso   = logs.filter(l => l.status === 'sucesso').length;
  const revertido = logs.filter(l => l.status === 'revertido').length;
  const erro      = logs.filter(l => l.status === 'erro' || l.status === 'parcial').length;
  const taxa      = (sucesso + erro) > 0 ? Math.round((sucesso / (sucesso + erro)) * 100) : 0;
  document.getElementById('s-total').textContent     = total;
  document.getElementById('s-sucesso').textContent   = sucesso;
  document.getElementById('s-revertido').textContent = revertido;
  document.getElementById('s-erro').textContent      = erro;
  document.getElementById('s-taxa').textContent      = `${taxa}%`;
}

let _panelFilterFn = null;

function applyTableFilters() {
  if (!table) return;
  const status = document.getElementById('f-status').value;
  const vagaId = document.getElementById('f-vaga').value;

  if (_panelFilterFn) { table.removeFilter(_panelFilterFn); _panelFilterFn = null; }

  if (status || vagaId) {
    _panelFilterFn = rowData => {
      if (status && rowData.status !== status) return false;
      if (vagaId && String(rowData.vaga_id ?? '') !== String(vagaId)) return false;
      return true;
    };
    table.addFilter(_panelFilterFn);
  }
}

  // placeholder — sem badges visuais ativos por enquanto

  salvarFiltros();

const FILTROS_KEY = 'se_curriculos_filtros';

function salvarFiltros() {
  localStorage.setItem(FILTROS_KEY, JSON.stringify({
    status: document.getElementById('f-status').value,
    vaga:   document.getElementById('f-vaga').value,

function restaurarFiltros() {
  try {

      document.getElementById('f-vaga').value   = saved.vaga   || '';

}

async function carregarSteps(l) {
  const container = document.getElementById('steps-container');
  if (!container) return;
  if (!l._seq) { container.innerHTML = '<div class="steps-loading">Referência não disponível.</div>'; return; }

  try {
    const steps = await fetch(`/api/integracoes/se/logs/${l._seq}/steps`).then(r => r.json());
    if (!steps.length) {
      container.innerHTML = '<div class="steps-loading">Nenhum step registrado para esta integração.</div>';
      return;
    }
    container.innerHTML = renderStepsTable(steps, l);
  } catch {
    container.innerHTML = '<div class="steps-loading" style="color:var(--error)">Erro ao carregar steps.</div>';
  }
}

const _stepCache = {};

function renderStepsTable(steps, logParent) {
  steps.forEach(s => { _stepCache[s.id] = s; });

  const rows = steps.map(s => {
    const statusEl = s.status === 'sucesso'
      ? `<span class="step-status-ok">✓ Sucesso</span>`
      : s.status === 'erro_http'
      ? `<span class="step-status-warn">⚠ HTTP Error</span>`
      : `<span class="step-status-err">✗ Erro</span>`;

    const httpBadge = s.status_code
      ? `<span class="badge-http ${s.status_code >= 200 && s.status_code < 300 ? 'ok' : 'err'}">${s.status_code}</span>`
      : '<span class="badge-http nul">—</span>';

    const duracao = s.duracao_ms != null ? `${s.duracao_ms}ms` : '—';

    let acoes = '';
    if (s.xml_enviado)
      acoes += `<button class="btn btn-ghost" style="font-size:11px;padding:2px 6px;color:#6366f1" title="Ver XML enviado para a API" onclick="abrirStepConteudo(${s.id},'xml')">📋 XML</button>`;
    if (s.resposta)
      acoes += `<button class="btn btn-ghost" style="font-size:11px;padding:2px 6px;color:#0891b2" title="Ver resposta da API" onclick="abrirStepConteudo(${s.id},'resp')">📋 Resp</button>`;
    if (logParent && logParent.curriculo_id)
      acoes += `<button class="btn btn-ghost" style="font-size:11px;padding:2px 6px;color:#059669" title="Re-executar este step individualmente" id="step-rerun-${s.id}" onclick="reenviarStep(${s.config_id}, ${logParent.curriculo_id}, this)">↺</button>`;
    if (s.erro)
      acoes += `<span style="font-size:11px;color:#b91c1c;display:block;margin-top:3px">${esc(s.erro.slice(0,80))}</span>`;

    return `<tr>
      <td style="color:var(--text-lo);font-family:monospace">${s.step_ordem || '—'}</td>
      <td style="font-weight:500">${esc(s.config_nome || `Config ${s.config_id}`)}</td>
      <td>${statusEl}</td>
      <td>${httpBadge}</td>
      <td style="font-family:monospace;font-size:12px">${duracao}</td>
      <td><div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center">${acoes}</div></td>
    </tr>`;
  }).join('');

  return `<table class="steps-tbl">
    <thead>
      <tr>
        <th>#</th><th>Config</th><th>Status</th><th>HTTP</th><th>Duração</th><th>Ações</th>
      </tr>
    </thead>
    <tbody>${rows}</tbody>
  </table>`;
}

  abrirConteudo(conteudo, titulo);

async function reenviarStep(configId, curriculoId, btn) {
  const orig = btn.textContent;
  btn.textContent = '...';
  btn.disabled    = true;
  try {
    const r    = await fetch('/api/integracoes/se/reenviar-step', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ config_id: configId, curriculo_id: curriculoId }),
    });
    const data = await r.json();
    if (!r.ok && !data.status_code) throw new Error(data.error || 'Erro');
    const ok  = data.ok !== false;
    const div = document.createElement('div');
    div.className = `step-result ${ok ? 'ok' : 'err'}`;
    div.textContent = ok ? `✓ HTTP ${data.status_code} (${data.duracao_ms}ms)` : `✗ ${data.error || `HTTP ${data.status_code}`}`;
    btn.parentElement.appendChild(div);
  } catch (err) {
    const div = document.createElement('div');
    div.className = 'step-result err';
    div.textContent = `✗ ${err.message}`;
    btn.parentElement.appendChild(div);
  } finally {
    btn.textContent = orig;
    btn.disabled    = false;
  }
}

    titulo   = `XML Retorno — ${l.curriculo_nome || '—'}`;

      : l.curriculo_json;

    `Análise: ${l.analise_id || '—'} · Vaga: ${l.vaga_nome || '—'} · ${new Date(l.data_envio).toLocaleString('pt-BR')} · ${subtipo}`;

}

function copiarTexto(texto, btn, labelOrig) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(texto).then(() => {
      if (btn) { const o = btn.textContent; btn.textContent = '✓ Copiado!'; setTimeout(() => btn.textContent = o, 2000); }
    }).catch(() => alert('Não foi possível copiar. Selecione o texto e use Ctrl+C.'));
    return;
  }
  const ta = document.createElement('textarea');
  ta.value = texto; ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); } catch (_) {}
  document.body.removeChild(ta);
  if (btn) { const o = labelOrig || btn.textContent; btn.textContent = '✓ Copiado!'; setTimeout(() => btn.textContent = o, 2000); }
}

function copiarXML(btn) {
  copiarTexto(document.getElementById('xml-content').textContent, btn, '📋 Copiar XML');
}

function copiarExpandable(uid, btn, label) {
  const el = document.getElementById(uid);
  if (el) copiarTexto(el.textContent, btn, `📋 ${label}`);
}

// ── Ações sobre registros ───────────────────────────────────────
async function reenviar(log) {
  if (!log) return;
  const isFlow = log.integration_source === 'flow';
  const msg    = isFlow
    ? `Re-executar o flow para o currículo de "${log.curriculo_nome}"?\n\nAnálise: ${log.analise_id}`
    : `Reenviar o currículo de "${log.curriculo_nome}" para o Softexpert?\n\nAnálise: ${log.analise_id}`;
  if (!confirm(msg)) return;
  try {
    const r = await fetch('/api/integracoes/se/reenviar', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ curriculo_id: log.curriculo_id, analise_id: log.analise_id }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Erro no reenvio');
    alert(`✓ Currículo de "${log.curriculo_nome}" reenviado com sucesso!`);
    carregar();
  } catch (err) {
    alert(`✗ Erro ao reenviar: ${err.message}`);
    carregar();
  }
}

async function marcarOK(log) {
  if (!log) return;
  if (!confirm(`Marcar "${log.curriculo_nome}" como integrado manualmente?\n\nIsso bloqueará o reenvio automático sem efetivamente enviar ao Softexpert.`)) return;
  try {
    const r = await fetch('/api/integracoes/se/marcar-integrado', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ curriculo_id: log.curriculo_id, analise_id: log.analise_id }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Erro');
    alert(`✓ "${log.curriculo_nome}" marcado como integrado manualmente.`);
    carregar();
  } catch (err) {
    alert(`✗ Erro: ${err.message}`);
  }
}

async function desvincular(log) {
  if (!log) return;
  if (!confirm(`Mudar status de "${log.curriculo_nome}" para "Revertido"?\n\nO currículo ficará disponível para ser integrado novamente pela rotina Integrar Softexpert.`)) return;
  try {
    const r = await fetch('/api/integracoes/se/resetar', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ curriculo_id: log.curriculo_id, analise_id: log.analise_id }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Erro');
    alert(`⇄ Status de "${log.curriculo_nome}" alterado para Revertido.`);
    carregar();
  } catch (err) {
    alert(`✗ Erro: ${err.message}`);
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { fecharModal(); fecharModalXML(); }
});

// ── Inicialização ───────────────────────────────────────────────
(async () => {
  await window._iahubAuthReady;
  restaurarFiltros();
  await Promise.all([carregarConfig(), carregarVagas()]);
  await carregar();
})();
</script>
