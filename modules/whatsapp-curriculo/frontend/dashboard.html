<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — IAHub</title>
  <link rel="stylesheet" href="/css/iahub.css">
</head>
<body>
<div class="layout">

  <!-- ── Sidebar ── -->
      <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo" onclick="toggleSidebar()">
      <div class="logo-icon">IA</div>
      <span class="logo-text">IAHub</span>
    </div>
    <div class="sidebar-nav">
    </div>
    <div class="sidebar-footer">
    </div>
    </nav>

  <!-- ── Main ── -->
  <div class="main">
    <div class="topbar">
      <span class="topbar-title"><span class="topbar-path">Monitoramento ›</span> Dashboard</span>
      <span class="ms-auto text-muted text-sm" id="topbar-date"></span>
    </div>

    <div class="page-content">

      <!-- Stats Row 1: WhatsApp -->
      <div class="grid-3 mb-3">
        <div class="stat-card">
          <div class="stat-label">💬 WhatsApp — Hoje</div>
          <div class="stat-value stat-accent" id="stat-wa-hoje">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">💬 WhatsApp — Total</div>
          <div class="stat-value" id="stat-wa-total">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">💬 Serviço WhatsApp</div>
          <div style="margin-top:8px" id="stat-status"><span class="status-pill pill-stopped">Parado</span></div>
          <a href="/monitor.html#whatsapp" style="font-size:11px;color:var(--accent);text-decoration:none;margin-top:6px;display:inline-block">Ver Monitor →</a>
        </div>
      </div>

      <!-- Stats Row 2: E-mail -->
      <div class="grid-3 mb-4">
        <div class="stat-card">
          <div class="stat-label">📧 E-mail — Hoje</div>
          <div class="stat-value stat-accent" id="stat-email-hoje">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">📧 E-mail — Total</div>
          <div class="stat-value" id="stat-email-total">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">📧 Serviço E-mail</div>
          <div style="margin-top:8px" id="stat-email-status"><span class="status-pill pill-stopped">Parado</span></div>
          <a href="/monitor.html#email" style="font-size:11px;color:var(--accent);text-decoration:none;margin-top:6px;display:inline-block">Ver Monitor →</a>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/sidebar.js"></script>
<script>
  document.getElementById('topbar-date').textContent =
    new Date().toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

  const waStatusMap = {
    stopped:   ['pill-stopped',   'Parado'],
    starting:  ['pill-starting',  'Iniciando…'],
    connected: ['pill-connected', 'Conectado'],
  };

  const emailStatusMap = {
    stopped: ['pill-stopped',   'Parado'],
    running: ['pill-connected', 'Rodando'],
  };

  async function carregar() {
    const [stats, emailSvc] = await Promise.all([
      fetch('/api/stats').then(r => r.json()),
      fetch('/api/email-service/status').then(r => r.json()).catch(() => ({ status: 'stopped' })),
    ]);

    document.getElementById('stat-wa-hoje').textContent  = stats.wa?.hoje  ?? '—';
    document.getElementById('stat-wa-total').textContent = stats.wa?.total ?? '—';
    document.getElementById('stat-email-hoje').textContent  = stats.email?.hoje  ?? '—';
    document.getElementById('stat-email-total').textContent = stats.email?.total ?? '—';

    const [cls, label] = waStatusMap[stats.status] || waStatusMap.stopped;
    document.getElementById('stat-status').innerHTML =
      `<span class="status-pill ${cls}">${label}</span>`;

    const [eCls, eLabel] = emailStatusMap[emailSvc.status] || emailStatusMap.stopped;
    document.getElementById('stat-email-status').innerHTML =
      `<span class="status-pill ${eCls}">${eLabel}</span>`;
  }

  fetch('/api/me').then(r => r.json()).then(d => {
    document.getElementById('sidebar-user').textContent = d.user || 'Admin';
  });

  carregar();
</script>
</body>
</html>
