<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Empresas — IAHub</title>
  <link rel="stylesheet" href="/css/iahub.css">
  <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css">
  <style>
    .modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:center;justify-content:center; }
    .modal         { background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);width:min(660px,95vw);max-height:90vh;overflow-y:auto;padding:28px;position:relative; }
    .modal-header  { display:flex;justify-content:space-between;align-items:center;margin-bottom:24px; }
    .modal-title   { font-size:16px;font-weight:700;color:var(--text-hi); }
    .modal-close   { background:none;border:none;color:var(--text-lo);font-size:22px;cursor:pointer;line-height:1;padding:0; }
    .modal-close:hover { color:var(--text-hi); }
    .form-row      { display:grid;grid-template-columns:1fr 1fr;gap:16px; }
    .modal-footer  { display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:24px;padding-top:20px;border-top:1px solid var(--border); }
    .btn-icon      { background:none;border:none;cursor:pointer;padding:5px 8px;border-radius:6px;font-size:16px;transition:background .15s; }
    .btn-icon:hover { background:var(--bg-hover); }
    .empty-state   { text-align:center;padding:60px 20px;color:var(--text-lo); }
    .empty-state div { font-size:40px;margin-bottom:12px; }

    /* ── Group panel ── */
    .gp-chips-row { display:flex;align-items:center;gap:6px;flex-wrap:wrap;position:relative; }
    .gp-label     { font-size:11px;color:var(--text-lo);white-space:nowrap; }

    /* ── Tabulator overrides ── */
    .tabulator { border:none !important; background:transparent !important; }
    .tabulator .tabulator-header { background:var(--bg-card) !important; border-bottom:1px solid var(--border) !important; }
    .tabulator .tabulator-header .tabulator-col { background:var(--bg-card) !important; border-right:none !important; color:var(--text-lo) !important; font-size:11px !important; font-weight:700 !important; text-transform:uppercase; letter-spacing:.05em; }
    .tabulator .tabulator-header .tabulator-col .tabulator-header-filter input,
    .tabulator .tabulator-header .tabulator-col .tabulator-header-filter select { background:var(--bg-body) !important; color:var(--text-hi) !important; border:1px solid var(--border) !important; border-radius:4px !important; font-size:11px !important; padding:3px 6px !important; width:100% !important; }
    .tabulator .tabulator-row { background:var(--bg-card) !important; border-bottom:1px solid var(--border) !important; cursor:pointer; }
    .tabulator .tabulator-row:hover { background:var(--bg-hover) !important; }
    .tabulator .tabulator-row .tabulator-cell { border-right:none !important; color:var(--text-md); font-size:13px; padding:10px 12px !important; }
    .tabulator .tabulator-row.tabulator-group { background:var(--bg-body) !important; border-bottom:1px solid var(--border) !important; font-size:12px !important; font-weight:700 !important; color:var(--text-lo) !important; }
    .tabulator .tabulator-placeholder { background:var(--bg-card) !important; }
  </style>
</head>
<body>
<div class="layout">

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo" onclick="toggleSidebar()">
      <div class="logo-icon">IA</div>
      <span class="logo-text">IAHub</span>
    </div>
    <div class="sidebar-nav">
    </div>
    <div class="sidebar-footer">
    </div>
  </nav>

  <div class="main">
    <div class="topbar">
      <span class="topbar-title"><span class="topbar-path">Configurador › Administração ›</span> Empresas</span>
    </div>

    <div class="page-content">
      <div style="margin-bottom:12px">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
          <div class="gp-chips-row" id="gp-chips" style="flex:1;min-height:28px">
            <span class="gp-label">Agrupar:</span>
          </div>
          <button class="btn btn-primary" onclick="abrirModal()">＋ Nova Empresa</button>
        </div>
        <div id="gp-dz"></div>
      </div>

      <div class="card" style="padding:0;overflow:hidden">
        <div id="grid"></div>
      </div>
    </div>
  </div>
</div>

<!-- ── Modal Criar / Editar ───────────────────────────────────────────────── -->
<div id="modal" class="modal-overlay d-none">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Nova Empresa</span>
      <button class="modal-close" onclick="fecharModal()">✕</button>
    </div>

    <div class="form-row" style="margin-bottom:16px">
      <div class="form-group">
        <label class="form-label">Razão Social <span style="color:#dc2626">*</span></label>
        <input id="f-razao" type="text" class="form-control" placeholder="Nome da empresa ou produtor rural">
      </div>
      <div class="form-group">
        <label class="form-label">CPF / CNPJ <span style="color:#dc2626">*</span></label>
        <input id="f-doc" type="text" class="form-control" placeholder="000.000.000-00 ou 00.000.000/0001-00"
               oninput="maskDoc(this)" inputmode="numeric" maxlength="18">
      </div>
    </div>

    <div class="form-row" style="margin-bottom:16px">
      <div class="form-group">
        <label class="form-label">Telefone</label>
        <input id="f-tel" type="text" class="form-control" placeholder="(00) 00000-0000">
      </div>
      <div class="form-group">
        <label class="form-label">E-mail</label>
        <input id="f-email" type="email" class="form-control" placeholder="contato@empresa.com.br">
      </div>
    </div>

    <div class="form-row" style="margin-bottom:16px">
      <div class="form-group">
        <label class="form-label">Site</label>
        <input id="f-site" type="text" class="form-control" placeholder="https://empresa.com.br">
      </div>
      <div class="form-group">
        <label class="form-label">Endereço</label>
        <input id="f-end" type="text" class="form-control" placeholder="Rua, número, cidade — UF">
      </div>
    </div>

    <div id="form-error" class="login-error" style="display:none;margin-bottom:12px"></div>

    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primary" id="btn-salvar" onclick="salvar()">Salvar</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/grid-group-panel.js"></script>
<script>
  let empresas = [];
  let editId   = null;
  let table    = null;

  const gp = createGroupPanel({
    chipsRowId: 'gp-chips',
    dropZoneId: 'gp-dz',
    storageKey: 'empresas_group_fields',
    getTable:   () => table,
  });

  // ── Máscara CPF / CNPJ ──────────────────────────────────────────────────────
  function maskDoc(input) {
    let v = input.value.replace(/\D/g, '').substring(0, 14);
    if (v.length <= 11) {
      v = v.replace(/(\d{3})(\d)/,       '$1.$2');
      v = v.replace(/(\d{3})(\d)/,       '$1.$2');
      v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
    } else {
      v = v.replace(/(\d{2})(\d)/,       '$1.$2');
      v = v.replace(/(\d{3})(\d)/,       '$1.$2');
      v = v.replace(/(\d{3})(\d)/,       '$1/$2');
      v = v.replace(/(\d{4})(\d{1,2})$/, '$1-$2');
    }
    input.value = v;
  }

  function formatarDoc(doc) {
    if (!doc) return '';
    const v = String(doc).replace(/\D/g, '');
    if (v.length <= 11) {
      return v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
    }
    return v.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{1,2})/, '$1.$2.$3/$4-$5');
  }

  function soNumeros(str) { return String(str || '').replace(/\D/g, ''); }

  // ── Tabulator ───────────────────────────────────────────────────────────────
  function initTabulator(dados) {
    table = new Tabulator('#grid', {
      data: dados,
      layout: 'fitColumns',
      height: 'calc(100vh - 220px)',
      groupStartOpen: true,
      groupBy: gp.getActiveFields(),
      placeholder: '<div class="empty-state"><div>🏢</div><strong style="color:var(--text-md)">Nenhuma empresa cadastrada</strong></div>',
      columns: [
        {
          title: '#', field: 'id', width: 60, headerFilter: false, groupable: false,
          formatter: cell => `<span style="color:var(--text-lo);font-size:12px">${cell.getValue()}</span>`,
        },
        {
          title: 'Razão Social', field: 'razao_social', minWidth: 200, headerFilter: true,
          formatter: cell => {
            const row  = cell.getRow().getData();
            const site = row.site
              ? `<br><a href="${esc(row.site)}" target="_blank" style="font-size:11px;color:var(--accent);text-decoration:none">${esc(row.site)}</a>`
              : '';
            return `<strong style="color:var(--text-hi)">${esc(row.razao_social)}</strong>${site}`;
          },
        },
        {
          title: 'Tipo', field: 'tipo_doc', width: 80,
          headerFilter: 'select',
          headerFilterParams: { values: { '': 'Todos', CPF: 'CPF', CNPJ: 'CNPJ' } },
        },
        {
          title: 'CPF / CNPJ', field: 'documento_fmt', width: 170, headerFilter: true,
          formatter: cell => {
            const v = cell.getValue();
            return v
              ? `<span style="font-family:monospace;font-size:12px;color:var(--text-md)">${v}</span>`
              : `<span style="color:var(--text-lo)">—</span>`;
          },
        },
        {
          title: 'Telefone', field: 'telefone', headerFilter: true,
          formatter: cell => cell.getValue() || `<span style="color:var(--text-lo)">—</span>`,
        },
        {
          title: 'E-mail', field: 'email', headerFilter: true,
          formatter: cell => cell.getValue() || `<span style="color:var(--text-lo)">—</span>`,
        },
        {
          title: 'Ações', headerFilter: false, width: 90, hozAlign: 'right',
          formatter: cell => {
            const row  = cell.getRow().getData();
            const id   = row.id;
            const nome = esc(row.razao_social);
            return `<button class="btn-icon" onclick="event.stopPropagation();editar(${id})" title="Editar">✏️</button>
                    <button class="btn-icon" onclick="event.stopPropagation();confirmarExcluir(${id},'${nome}')" title="Excluir" style="color:#dc2626">🗑</button>`;
          },
        },
      ],
      rowClick: (_e, row) => editar(row.getData().id),
    });
  }

  // ── Carregamento ────────────────────────────────────────────────────────────
  async function carregar() {
    try {
      const res  = await fetch('/api/empresas');
      empresas   = await res.json();
      const dados = empresas.map(e => ({
        ...e,
        tipo_doc:     soNumeros(e.documento || '').length <= 11 ? 'CPF' : 'CNPJ',
        documento_fmt: formatarDoc(e.documento),
      }));
      if (table) {
        table.replaceData(dados);
      } else {
        initTabulator(dados);
        setTimeout(() => gp.refresh(), 0);
      }
    } catch (_) {
      console.error('Erro ao carregar empresas.');
    }
  }

  // ── Modal ───────────────────────────────────────────────────────────────────
  function abrirModal(empresa = null) {
    editId = empresa?.id ?? null;
    document.getElementById('modal-title').textContent = empresa ? 'Editar Empresa' : 'Nova Empresa';
    document.getElementById('f-razao').value = empresa?.razao_social ?? '';
    document.getElementById('f-doc').value   = formatarDoc(empresa?.documento ?? '');
    document.getElementById('f-tel').value   = empresa?.telefone     ?? '';
    document.getElementById('f-email').value = empresa?.email        ?? '';
    document.getElementById('f-site').value  = empresa?.site         ?? '';
    document.getElementById('f-end').value   = empresa?.endereco     ?? '';
    document.getElementById('form-error').style.display = 'none';
    document.getElementById('modal').classList.remove('d-none');
    setTimeout(() => document.getElementById('f-razao').focus(), 50);
  }

  function fecharModal() {
    document.getElementById('modal').classList.add('d-none');
    editId = null;
  }

  function editar(id) {
    const e = empresas.find(x => x.id === id);
    if (e) abrirModal(e);
  }

  async function confirmarExcluir(id, nome) {
    if (!confirm(`Excluir a empresa "${nome}"?\nEsta ação não pode ser desfeita.`)) return;
    const res = await fetch(`/api/empresas/${id}`, { method: 'DELETE' });
    if (res.ok) { carregar(); }
    else {
      const err = await res.json().catch(() => ({}));
      alert(err.error || 'Erro ao excluir empresa.');
    }
  }

  async function salvar() {
    const errEl = document.getElementById('form-error');
    errEl.style.display = 'none';

    const razao = document.getElementById('f-razao').value.trim();
    const doc   = soNumeros(document.getElementById('f-doc').value);

    if (!razao) {
      errEl.textContent = 'Razão Social é obrigatória.';
      errEl.style.display = 'block';
      document.getElementById('f-razao').focus();
      return;
    }
    if (!doc) {
      errEl.textContent = 'CPF / CNPJ é obrigatório.';
      errEl.style.display = 'block';
      document.getElementById('f-doc').focus();
      return;
    }

    const dados = {
      razao_social: razao,
      documento:    doc,
      telefone:     document.getElementById('f-tel').value.trim(),
      email:        document.getElementById('f-email').value.trim(),
      site:         document.getElementById('f-site').value.trim(),
      endereco:     document.getElementById('f-end').value.trim(),
    };

    const btn = document.getElementById('btn-salvar');
    btn.textContent = 'Salvando...';
    btn.disabled    = true;

    try {
      const url    = editId ? `/api/empresas/${editId}` : '/api/empresas';
      const method = editId ? 'PUT' : 'POST';
      const res    = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados),
      });

      if (res.ok) { fecharModal(); carregar(); }
      else {
        const err = await res.json().catch(() => ({}));
        errEl.textContent = err.error || 'Erro ao salvar empresa.';
        errEl.style.display = 'block';
      }
    } finally {
      btn.textContent = 'Salvar';
      btn.disabled    = false;
    }
  }

  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target === this) fecharModal();
  });

  document.addEventListener('DOMContentLoaded', carregar);
</script>
</body>
</html>
