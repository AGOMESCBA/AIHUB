# Nginx com HTTPS para o IAHub — guia completo em deploy/HTTPS.md.
#
# ANTES DE USAR, troque nos DOIS lugares marcados:
#   SEU_ENDERECO  -> o nome do servidor (ex.: iahub.suaempresa.com.br
#                    ou 200-201-202-203.sslip.io)
# e confira os nomes dos arquivos do certificado em C:/certificados
# (gerados pelo win-acme no passo 4 do guia).

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Limite para upload de curriculos e anexos
    client_max_body_size 20M;

    upstream iahub_app {
        server 127.0.0.1:3000;
    }

    # Porta 80: só serve a validação do certificado (renovação automática) e
    # manda todo o resto para o HTTPS.
    server {
        listen 80;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root C:/nginx-acme;
            default_type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name SEU_ENDERECO;

        ssl_certificate     C:/certificados/SEU_ENDERECO-chain.pem;
        ssl_certificate_key C:/certificados/SEU_ENDERECO-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # Ligar SÓ depois de confirmar que o HTTPS funciona bem por alguns dias:
        # o navegador passa a recusar HTTP para este endereço por 6 meses.
        # add_header Strict-Transport-Security "max-age=15552000" always;

        location / {
            proxy_pass         http://iahub_app;
            proxy_http_version 1.1;

            # WebSocket (Socket.IO: Chat interno do J2A e monitores)
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout  86400;
            proxy_send_timeout  86400;
        }
    }
}
