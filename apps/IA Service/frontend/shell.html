<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>IA Service</title>
  <link rel="stylesheet" href="/css/iahub.css">
  <link rel="stylesheet" href="/app/ia-service/css/iaservice-mobile.css">
  <style>
    :root { --accent:#1d4ed8; --accent-light:#3b82f6; --accent-glow:rgba(29,78,216,.1); }
    .sidebar-logo .logo-icon { background:var(--accent) !important; }

    /* ── Barra de abas MDI (adaptado de apps/IA Command/frontend/shell.html,
       trocando o roxo do IA Command por --accent do IA Service) ─────────── */
    .mdi-tabbar {
      display: flex;
      align-items: flex-end;
      background: var(--bg-hover);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border-hi) transparent;
      scroll-behavior: smooth;
      flex-shrink: 0;
      padding: 6px 8px 0;
      gap: 3px;
    }
    .mdi-tabbar::-webkit-scrollbar { height: 6px; }
    .mdi-tabbar::-webkit-scrollbar-track { background: transparent; }
    .mdi-tabbar::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 999px; }

    .mdi-tab {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px 8px 13px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-md);
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 7px 7px 0 0;
      cursor: pointer;
      white-space: nowrap;
      flex: 0 0 clamp(220px, 15vw, 280px);
      max-width: 280px;
      min-width: 0;
      user-select: none;
      transition: color var(--transition), background var(--transition), box-shadow var(--transition);
      margin-bottom: -1px;
      position: relative;
    }
    .mdi-tab:hover  { background: var(--bg-card); color: var(--text-hi); }
    .mdi-tab.active {
      background: var(--bg-card);
      color: var(--accent);
      font-weight: 600;
      border-color: var(--border);
      border-top: 2px solid var(--accent);
      box-shadow: 0 -2px 10px var(--accent-glow), var(--shadow-sm);
      z-index: 1;
    }
    .mdi-tab.dragging { opacity: .55; cursor: grabbing; box-shadow: var(--shadow-md); }

    .mdi-tab-icon  { font-size: 14px; flex-shrink: 0; }
    .mdi-tab-label { flex: 1; overflow: hidden; text-overflow: ellipsis; text-align: left; min-width: 0; }
    .mdi-tab-close {
      flex-shrink: 0; width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px; font-size: 16px; line-height: 1;
      color: var(--text-lo); transition: background var(--transition), color var(--transition);
      margin-left: 1px;
    }
    .mdi-tab-close:hover                 { background: rgba(0,0,0,.08); color: var(--text-hi); }
    .mdi-tab.active .mdi-tab-close:hover { background: var(--accent-glow); color: var(--accent); }

    /* ── Scroll buttons ─────────────────────────────────────────────── */
    .mdi-tabbar-wrap {
      display: flex;
      align-items: stretch;
      background: var(--bg-hover);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .mdi-tabbar { flex: 1; min-width: 0; border-bottom: none !important; }
    .mdi-scroll-btn {
      display: none;
      align-items: center; justify-content: center;
      width: 30px; flex-shrink: 0;
      background: var(--bg-card); border: none;
      border-bottom: 1px solid var(--border);
      cursor: pointer; font-size: 12px; color: var(--text-md);
      transition: color var(--transition), background var(--transition); z-index: 1;
    }
    .mdi-scroll-btn:hover { color: var(--accent); background: var(--bg-hover); }

    /* ── Área de conteúdo ────────────────────────────────────────────── */
    .mdi-content { flex: 1; position: relative; overflow: hidden; background: var(--bg-card); }
    .mdi-iframe  { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: var(--bg-card); }
    .mdi-iframe.active { display: block; }

    /* ── Estado vazio ────────────────────────────────────────────────── */
    .mdi-empty {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; pointer-events: none; user-select: none;
    }
    .mdi-empty-icon  { font-size: 56px; opacity: .15; }
    .mdi-empty-title { font-size: 15px; font-weight: 600; color: var(--text-md); }
    .mdi-empty-sub   { font-size: 13px; color: var(--text-lo); }

    /* ── Topbar ──────────────────────────────────────────────────────── */
    .isvc-topbar { padding: 0 16px; gap: 8px; }
    .isvc-topbar .topbar-title { font-weight: 800; flex: 1; min-width: 0; }
    /* Mensagens: o chat fica dentro do Monitor de Acessos; o aviso, em qualquer rotina. */
    .isvc-msg-btn { position: relative; flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-card); color: var(--text-md); font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
    .isvc-msg-btn:hover { color: var(--accent); border-color: var(--accent); }
    .isvc-msg-btn[hidden], .isvc-msg-badge[hidden] { display: none; }
    .isvc-msg-badge { position: absolute; top: -6px; right: -6px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px; background: #00a884; color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--bg-card); }
    @media (max-width: 760px) {
      .isvc-msg-txt { display: none; }
      .isvc-msg-btn { width: 40px; height: 40px; padding: 0; justify-content: center; }
      .isvc-msg-badge { top: -3px; right: -4px; }
    }
  </style>
</head>
<body>
<div class="layout" id="layout">

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo" onclick="toggleSidebar()">
      <div class="logo-icon">⚡</div>
      <span class="logo-text">IA Service</span>
    </div>
    <div class="sidebar-nav"></div>
    <div class="sidebar-footer"></div>
  </nav>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebarDrawer()" aria-hidden="true"></div>

  <div class="main">

    <div class="topbar isvc-topbar">
      <button class="topbar-menu-btn" onclick="toggleSidebar()" title="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <span class="topbar-title" id="shell-title">IA Service</span>
      <button class="isvc-msg-btn" id="shell-mensagens" type="button" title="Mensagens da equipe" aria-label="Mensagens da equipe" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.9-.9L3 20.5l1.6-4.6A8.4 8.4 0 1 1 21 11.5Z"/></svg>
        <span class="isvc-msg-txt">Mensagens</span>
        <span class="isvc-msg-badge" id="shell-mensagens-qtd" hidden></span>
      </button>
    </div>

    <div class="mdi-tabbar-wrap">
      <button class="mdi-scroll-btn" id="mdi-scroll-left"  title="Rolar para esquerda" onclick="scrollMdiTabs(-1)">◀</button>
      <div class="mdi-tabbar" id="mdi-tabbar"></div>
      <button class="mdi-scroll-btn" id="mdi-scroll-right" title="Rolar para direita"  onclick="scrollMdiTabs(1)">▶</button>
    </div>

    <div class="mdi-content" id="mdi-content">
      <div class="mdi-empty" id="mdi-empty">
        <div class="mdi-empty-icon">⚡</div>
        <div class="mdi-empty-title">Nenhuma rotina aberta</div>
        <div class="mdi-empty-sub">Selecione uma opção no menu lateral para começar</div>
      </div>
    </div>

  </div>
</div>

<script src="/js/auth.js"></script>
<script src="./js/mobile-viewport.js"></script>
<script src="./js/sidebar.js"></script>
<script src="./js/tab-manager.js"></script>
<script>
  // Interceptação de clique no menu — mesmo padrão do shell.html do IA
  // Command: abre a rotina numa aba interna em vez de navegar a página
  // inteira. Exceção: itens com target="_blank" (ex. Radar de Chamados,
  // que abre em nova guia do navegador por decisão arquitetural anterior —
  // nunca depende de cookie de sessão cruzando abas) continuam navegando
  // normalmente, sem passar pelo MDI.
  document.addEventListener('click', (e) => {
    const link = e.target.closest('#sidebar a.nav-item');
    if (!link) return;
    if (link.target === '_blank') return; // deixa o navegador abrir a nova guia normalmente
    e.preventDefault();
    const url   = new URL(link.href, location.origin).pathname;
    const label = link.querySelector('.nav-label')?.textContent?.trim() || url;
    const icon  = link.querySelector('.nav-icon')?.textContent?.trim()  || '📄';
    window.openTab(url, label, icon);
    window.closeSidebarDrawer?.();
  });

  // Aviso de mensagem não lida em qualquer rotina (2026-10-30). Só aparece para
  // quem pode usar as Mensagens: rotina do Monitor e número vinculado ao usuário
  // (a própria API recusa os demais). Lê o total, não abre nenhuma conversa.
  (function avisoMensagens() {
    const botao = document.getElementById('shell-mensagens');
    const qtd = document.getElementById('shell-mensagens-qtd');
    const tituloBase = document.title.replace(/^\(\d+\)\s*/, '');
    async function atualizar() {
      const empresaId = window._iahubEmpresa?.id;
      if (!empresaId) return;
      try {
        const r = await fetch(`/api/ia-service/monitor-acessos/chat-interno/contatos?empresa_id=${encodeURIComponent(empresaId)}`, { cache: 'no-store' });
        if (!r.ok) throw new Error(String(r.status));
        const n = (await r.json()).naoLidasTotal || 0;
        botao.hidden = false;
        qtd.hidden = n === 0;
        qtd.textContent = n > 99 ? '99+' : String(n);
        botao.setAttribute('aria-label', n ? `Mensagens da equipe: ${n} não lida(s)` : 'Mensagens da equipe');
        document.title = n ? `(${n}) ${tituloBase}` : tituloBase;
      } catch (_) {
        botao.hidden = true;
        document.title = tituloBase;
      }
    }
    botao.addEventListener('click', () => {
      try { sessionStorage.setItem('iasvc_abrir_mensagens', '1'); } catch (_) { /* abre só o Monitor */ }
      window.openTab('/app/ia-service/monitor-acessos.html', 'Monitor de Acessos', '📡');
    });
    window._iahubAuthReady?.then(atualizar);
    setInterval(atualizar, 30 * 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) atualizar(); });
    window.addEventListener('iasvc:empresa-trocada', atualizar);
  })();

  // Monitor de Acessos (2026-10): sinal de presença a cada 30s, só com a
  // janela visível. Tela = aba ativa do MDI (lida do título do topo, que o
  // tab-manager já mantém). Nunca envia conteúdo das telas.
  (function presencaInterna() {
    function telaAtiva() {
      const titulo = document.getElementById('shell-title')?.textContent || '';
      return titulo.replace(/^[^\p{L}\d]+/u, '').trim() || 'Início';
    }
    function enviar() {
      const empresaId = window._iahubEmpresa?.id;
      if (document.hidden || !empresaId) return;
      fetch('/api/ia-service/presenca', {
        method: 'POST',
        cache: 'no-store',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ empresa_id: empresaId, tela: telaAtiva(), acao: 'Rotina interna do IA Service', visivel: true }),
      }).then(async (r) => {
        // Desconectado pelo Monitor de Acessos (2026-10-28): sai do IA Service.
        if (r.ok || (r.status !== 401 && r.status !== 403)) return;
        // 401 = sessão do IAHub não existe mais (desconectado do IAHub inteiro
        // apaga o arquivo da sessão antes do próximo sinal chegar aqui).
        const d = await r.json().catch(() => ({}));
        if (r.status === 403 && !d.desconectado) return;
        alert(r.status === 401 ? 'Sua sessão foi encerrada. Entre de novo.' : (d.error || 'Você foi desconectado pelo administrador.'));
        window.top.location.href = r.status === 401 ? '/login.html' : '/iahub.html';
      }).catch(() => null);
    }
    (window._iahubAuthReady || Promise.resolve()).then(() => {
      enviar();
      setInterval(enviar, 30 * 1000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) enviar(); });
      window.addEventListener('pagehide', () => {
        const empresaId = window._iahubEmpresa?.id;
        if (!empresaId) return;
        fetch('/api/ia-service/presenca/saindo', {
          method: 'POST',
          keepalive: true,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ empresa_id: empresaId }),
        }).catch(() => null);
      });
      const titulo = document.getElementById('shell-title');
      let espera = null;
      if (titulo) new MutationObserver(() => { clearTimeout(espera); espera = setTimeout(enviar, 800); })
        .observe(titulo, { childList: true, characterData: true, subtree: true });
    });
  })();

  // No shell MDI, trocar empresa atualiza todas as abas abertas sem
  // recarregar a janela — auth.js define _trocarEmpresa com
  // location.reload() por padrão; sobrescrevemos aqui (mesmo padrão do
  // shell.html do IA Command).
  window._iahubAuthReady?.then(() => {
    let empresaSwitchQueue = Promise.resolve();

    window._trocarEmpresa = async function (empresa_id) {
      empresaSwitchQueue = empresaSwitchQueue
        .catch(() => null)
        .then(async () => {
          const res = await fetch('/api/empresas/selecionar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ empresa_id, system_code: 'ia-service' }),
          });
          if (!res.ok) return;

          const lista = await fetch('/api/empresas/minhas').then(r => r.json()).catch(() => []);
          const emp = lista.find(e => Number(e.id) === Number(empresa_id));
          if (emp) {
            const empresaNome = emp.razao_social || emp.nome || '';
            window._iahubEmpresa = { id: emp.id, nome: empresaNome };
            window._iahubAtualizarEmpresaBadge?.({ id: emp.id, nome: empresaNome });
            await window.trocarEmpresaTodasAbas?.(emp.id, empresaNome);
            window.dispatchEvent(new Event('iasvc:empresa-trocada'));
          }

          const drop = document.getElementById('_empresa-dropdown');
          if (drop) drop.style.display = 'none';
        });
      return empresaSwitchQueue;
    };
  });
</script>
</body>
</html>
