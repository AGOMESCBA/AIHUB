<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atendimento - IA Service</title>
  <link rel="stylesheet" href="/css/iahub.css">
  <style>
    :root { --accent:#1d4ed8; --accent-light:#3b82f6; --accent-glow:rgba(29,78,216,.1); }
    body { margin:0; background:var(--bg-app); font-family:inherit; }
    .layout { display:flex; flex-direction:column; height:100vh; max-width:960px; margin:0 auto; }
    .topbar { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--border); background:var(--bg-card); }
    .topbar-codigo { font-weight:800; color:var(--accent); font-size:14px; }
    .topbar-status { font-size:11px; font-weight:700; text-transform:uppercase; color:var(--text-lo); padding:3px 8px; border:1px solid var(--border); border-radius:6px; }
    .topbar-voltar { color:var(--text-md); text-decoration:none; font-size:13px; }

    .chat-body { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
    .row { display:flex; }
    .row.out { justify-content:flex-end; }
    .row.in { justify-content:flex-start; }
    .bubble { max-width:78%; border-radius:12px; padding:10px 14px; font-size:13.5px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
    .row.out .bubble { background:var(--accent); color:#1a1200; border-bottom-right-radius:3px; }
    .row.in .bubble { background:var(--bg-card); border:1px solid var(--border); color:var(--text-hi); border-bottom-left-radius:3px; }
    .bubble code, .bubble pre { font-family:ui-monospace,Consolas,monospace; font-size:12.5px; }
    .bubble pre { background:rgba(0,0,0,.06); border-radius:8px; padding:10px; overflow-x:auto; white-space:pre; }
    .bubble-header { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; font-size:10.5px; line-height:1.2; color:var(--text-lo); }
    .bubble-author { font-weight:900; text-transform:uppercase; letter-spacing:.045em; color:var(--text-md); }
    .row.out .bubble-author { color:rgba(26,18,0,.82); }
    .bubble-time { flex:none; font-variant-numeric:tabular-nums; white-space:nowrap; opacity:.9; }

    .anexos-do-turno { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
    .anexo-chip { display:flex; align-items:center; gap:5px; background:rgba(0,0,0,.05); border:1px solid var(--border); border-radius:8px; padding:4px 8px; font-size:11.5px; }
    .row.in .anexo-chip { background:var(--bg-hover); }

    .diagnostico-card { margin-top:8px; border-top:1px solid rgba(0,0,0,.08); padding-top:8px; }
    .diagnostico-secao { margin-bottom:8px; }
    .diagnostico-secao-titulo { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--accent); margin-bottom:3px; }
    .nivel-confianca-badge { display:inline-block; font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:20px; background:var(--bg-hover); color:var(--text-md); margin-bottom:6px; }

    .fonte-corrigido-actions { display:flex; gap:8px; margin-top:6px; }
    .fonte-corrigido-actions button { font-size:12px; padding:5px 10px; }

    .typing-row .bubble { display:flex; align-items:center; gap:6px; color:var(--text-lo); font-size:13px; }
    .typing-dot { width:6px; height:6px; border-radius:50%; background:var(--text-lo); animation:pulse 1.2s infinite ease-in-out; }

    @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }

    .composer { border-top:1px solid var(--border); background:var(--bg-card); padding:12px 16px; }
    .anexos-pendentes { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
    .anexo-pendente { display:flex; align-items:center; gap:6px; background:var(--bg-hover); border:1px solid var(--border); border-radius:8px; padding:5px 8px; font-size:12px; }
    .anexo-pendente button { border:none; background:none; cursor:pointer; color:var(--text-lo); font-size:14px; line-height:1; padding:0; }
    .composer-row { display:flex; align-items:flex-end; gap:8px; }
    .composer-row textarea { flex:1; box-sizing:border-box; min-height:44px; max-height:160px; resize:none; border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:13.5px; font-family:inherit; background:var(--bg-app); color:var(--text-hi); }
    .composer-btn { width:40px; height:40px; border-radius:10px; border:1px solid var(--border); background:var(--bg-app); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .composer-btn.enviar { background:var(--accent); border-color:var(--accent); color:#1a1200; }
    .composer-hint { font-size:11px; color:var(--text-lo); margin-top:5px; }

    .error-banner { display:none; background:#fee2e2; color:#991b1b; border:1px solid #fecaca; border-radius:8px; padding:10px 12px; font-size:13px; margin:10px 16px 0; }
  </style>
</head>
<body>
  <div class="layout">
    <div class="topbar">
      <a class="topbar-voltar" href="/app/ia-service/atendimentos.html">&larr; Atendimentos</a>
      <span class="topbar-codigo" id="topbar-codigo">—</span>
      <span class="topbar-status" id="topbar-status">—</span>
    </div>

    <div id="error-banner" class="error-banner"></div>

    <div class="chat-body" id="chat-body">
      <div style="text-align:center;color:var(--text-lo);font-size:13px;padding:20px;">Carregando…</div>
    </div>

    <div class="composer">
      <div class="anexos-pendentes" id="anexos-pendentes"></div>
      <div class="composer-row">
        <input type="file" id="anexo-input" multiple style="display:none" accept=".txt,.log,.xml,.json,.sql,.csv,.prw,.tlpp,.png,.jpg,.jpeg,.webp,.pdf">
        <button class="composer-btn" type="button" title="Anexar arquivo" onclick="document.getElementById('anexo-input').click()">📎</button>
        <textarea id="composer-texto" placeholder="Descreva o problema, cole a mensagem de erro, ou responda à investigação..."></textarea>
        <button class="composer-btn enviar" type="button" title="Enviar" onclick="enviarMensagem()">➤</button>
      </div>
      <div class="composer-hint">Ctrl+Enter para enviar · anexe prints, logs e fonte relacionados ao problema</div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const atendimentoId = params.get('id');
    let anexosPendentes = []; // [{id, nomeOriginal, mimeType, eCodigo}]
    let enviando = false;

    function showError(msg) {
      const el = document.getElementById('error-banner');
      el.textContent = msg;
      el.style.display = 'block';
    }
    function hideError() {
      document.getElementById('error-banner').style.display = 'none';
    }
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    }

    async function api(path, opts = {}) {
      const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(body.error || `Erro ${r.status}`);
      return body;
    }

    function empresaIdAtual() {
      return window._iahubEmpresa?.id || null;
    }

    // Renderiza texto simples com suporte minimo a blocos de codigo markdown
    // (```...```), sem depender de lib de markdown externa — suficiente para
    // o formato que o prompt builder pede à IA (seção "Fonte corrigido").
    function renderizarTextoComCodigo(texto) {
      const partes = String(texto ?? '').split(/```[a-zA-Z]*\n?/);
      return partes.map((parte, i) => {
        const escapado = escapeHtml(parte);
        return i % 2 === 1 ? `<pre><code>${escapado}</code></pre>` : escapado;
      }).join('');
    }
    function formatarDataHoraMensagem(iso) {
      if (!iso) return '';
      try {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return String(iso);
        return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      } catch (_) { return String(iso); }
    }
    function rotuloPapelMensagem(papel, direcao) {
      if (papel === 'assistant') return 'IA';
      if (papel === 'customer') return 'Cliente';
      if (papel === 'system') return 'Sistema';
      return direcao === 'out' ? 'Analista' : 'Mensagem';
    }

    function renderizarDiagnostico(diagnostico, nivelConfianca) {
      if (!diagnostico) return '';
      const ORDEM = ['Diagnóstico', 'Causa provável', 'Evidências', 'Correção proposta', 'Fonte corrigido', 'Alterações realizadas', 'Validação'];
      let html = '<div class="diagnostico-card">';
      if (nivelConfianca) html += `<span class="nivel-confianca-badge">${escapeHtml(nivelConfianca)}</span>`;
      for (const secao of ORDEM) {
        if (!diagnostico[secao]) continue;
        html += `<div class="diagnostico-secao"><div class="diagnostico-secao-titulo">${secao}</div>${renderizarTextoComCodigo(diagnostico[secao])}</div>`;
      }
      html += '</div>';
      return html;
    }

    function addBubble({ direcao, texto, anexos, diagnostico, nivelConfianca, criadoEm, papel }) {
      const chatBody = document.getElementById('chat-body');
      const row = document.createElement('div');
      row.className = `row ${direcao}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      const autor = rotuloPapelMensagem(papel, direcao);
      const horario = formatarDataHoraMensagem(criadoEm || new Date().toISOString());
      const cabecalhoMensagem = `<div class="bubble-header"><span class="bubble-author">${escapeHtml(autor)}</span><span class="bubble-time">${escapeHtml(horario)}</span></div>`;

      const corpo = direcao === 'in' && diagnostico
        ? renderizarDiagnostico(diagnostico, nivelConfianca)
        : renderizarTextoComCodigo(texto);
      bubble.innerHTML = cabecalhoMensagem + corpo;

      if (anexos && anexos.length) {
        const anexosDiv = document.createElement('div');
        anexosDiv.className = 'anexos-do-turno';
        anexosDiv.innerHTML = anexos.map(a => `<span class="anexo-chip">📄 ${escapeHtml(a.nomeOriginal)}</span>`).join('');
        bubble.appendChild(anexosDiv);
      }

      row.appendChild(bubble);
      chatBody.appendChild(row);
      chatBody.scrollTop = chatBody.scrollHeight;
      return row;
    }

    function showTyping() {
      hideTyping();
      const chatBody = document.getElementById('chat-body');
      const row = document.createElement('div');
      row.className = 'row in typing-row';
      row.id = 'typing-row';
      row.innerHTML = `<div class="bubble"><span class="typing-dot"></span> Analisando…</div>`;
      chatBody.appendChild(row);
      chatBody.scrollTop = chatBody.scrollHeight;
    }
    function hideTyping() {
      document.getElementById('typing-row')?.remove();
    }

    async function carregarAtendimento() {
      const empresaId = empresaIdAtual();
      if (!empresaId || !atendimentoId) return showError('Atendimento não identificado.');
      try {
        const atendimento = await api(`/api/ia-service/atendimentos/${atendimentoId}?empresa_id=${empresaId}`);
        document.getElementById('topbar-codigo').textContent = atendimento.codigo;
        document.getElementById('topbar-status').textContent = atendimento.status;

        const [mensagens, anexosDoAtendimento] = await Promise.all([
          api(`/api/ia-service/atendimentos/${atendimentoId}/mensagens?empresa_id=${empresaId}`),
          api(`/api/ia-service/atendimentos/${atendimentoId}/anexos?empresa_id=${empresaId}`),
        ]);

        const chatBody = document.getElementById('chat-body');
        chatBody.innerHTML = '';

        const anexosPorMensagem = {};
        for (const a of anexosDoAtendimento) {
          if (!a.mensagemId) continue;
          (anexosPorMensagem[a.mensagemId] ||= []).push(a);
        }

        for (const m of mensagens) {
          if (m.papel === 'system') continue;
          addBubble({
            direcao: m.papel === 'user' ? 'out' : 'in',
            texto: m.conteudo,
            anexos: anexosPorMensagem[m.id],
            diagnostico: m.diagnostico,
            nivelConfianca: m.nivelConfianca,
            criadoEm: m.criadoEm,
            papel: m.papel,
          });
        }
      } catch (err) {
        showError('Não foi possível carregar o atendimento: ' + err.message);
      }
    }

    document.getElementById('anexo-input').addEventListener('change', async (e) => {
      const empresaId = empresaIdAtual();
      const arquivos = [...e.target.files];
      e.target.value = '';
      for (const arquivo of arquivos) {
        const formData = new FormData();
        formData.append('arquivo', arquivo);
        try {
          const r = await fetch(`/api/ia-service/atendimentos/${atendimentoId}/anexos?empresa_id=${empresaId}`, { method: 'POST', body: formData });
          const anexo = await r.json();
          if (!r.ok) throw new Error(anexo.error || `Erro ${r.status}`);
          anexosPendentes.push(anexo);
          renderizarAnexosPendentes();
        } catch (err) {
          showError(`Não foi possível anexar "${arquivo.name}": ` + err.message);
        }
      }
    });

    function renderizarAnexosPendentes() {
      const container = document.getElementById('anexos-pendentes');
      container.innerHTML = anexosPendentes.map((a, i) => `
        <span class="anexo-pendente">📄 ${escapeHtml(a.nomeOriginal)} <button onclick="removerAnexoPendente(${i})" title="Remover">✕</button></span>
      `).join('');
    }
    function removerAnexoPendente(i) {
      anexosPendentes.splice(i, 1);
      renderizarAnexosPendentes();
    }

    async function enviarMensagem() {
      if (enviando) return;
      hideError();
      const empresaId = empresaIdAtual();
      const textarea = document.getElementById('composer-texto');
      const texto = textarea.value.trim();
      if (!texto) return showError('Digite uma mensagem antes de enviar.');

      const anexosDoTurno = anexosPendentes.slice();
      addBubble({ direcao: 'out', texto, anexos: anexosDoTurno, criadoEm: new Date().toISOString(), papel: 'user' });
      textarea.value = '';
      anexosPendentes = [];
      renderizarAnexosPendentes();
      showTyping();
      enviando = true;

      try {
        const resposta = await api(`/api/ia-service/atendimentos/${atendimentoId}/investigar?empresa_id=${empresaId}`, {
          method: 'POST',
          body: JSON.stringify({ texto, anexoIds: anexosDoTurno.map(a => a.id) }),
        });
        hideTyping();
        addBubble({ direcao: 'in', texto: resposta.conteudo, diagnostico: resposta.diagnostico, nivelConfianca: resposta.nivelConfianca, criadoEm: resposta.criadoEm, papel: 'assistant' });
      } catch (err) {
        hideTyping();
        addBubble({ direcao: 'in', texto: 'Não foi possível concluir a análise: ' + err.message, criadoEm: new Date().toISOString(), papel: 'assistant' });
      } finally {
        enviando = false;
      }
    }

    document.getElementById('composer-texto').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.ctrlKey) {
        e.preventDefault();
        enviarMensagem();
      }
    });

    window._iahubAuthReady?.then(carregarAtendimento) ?? carregarAtendimento();
  </script>
</body>
</html>
