<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atendimento - IA Service</title>
  <link rel="stylesheet" href="/css/iahub.css">
  <style>
    :root { --accent:#1d4ed8; --accent-light:#3b82f6; --accent-glow:rgba(29,78,216,.1); }
    body { margin:0; background:var(--bg-app); font-family:inherit; }
    .layout { display:flex; flex-direction:column; height:100vh; max-width:960px; margin:0 auto; }
    .topbar { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--border); background:var(--bg-card); }
    .topbar-codigo { font-weight:800; color:var(--accent); font-size:14px; }
    .topbar-status { font-size:11px; font-weight:700; text-transform:uppercase; color:var(--text-lo); padding:3px 8px; border:1px solid var(--border); border-radius:6px; }
    .topbar-voltar { color:var(--text-md); text-decoration:none; font-size:13px; }

    .chat-body { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
    .row { display:flex; }
    .row.out { justify-content:flex-end; }
    .row.in { justify-content:flex-start; }
    .bubble { max-width:78%; border-radius:12px; padding:10px 14px; font-size:13.5px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
    .row.out .bubble { background:var(--accent); color:#1a1200; border-bottom-right-radius:3px; }
    .row.in .bubble { background:var(--bg-card); border:1px solid var(--border); color:var(--text-hi); border-bottom-left-radius:3px; }
    .bubble code, .bubble pre { font-family:ui-monospace,Consolas,monospace; font-size:12.5px; }
    .bubble pre { background:rgba(0,0,0,.06); border-radius:8px; padding:10px; overflow-x:auto; white-space:pre; }
    .bubble-header { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; font-size:10.5px; line-height:1.2; color:var(--text-lo); }
    .bubble-author { font-weight:900; text-transform:uppercase; letter-spacing:.045em; color:var(--text-md); }
    .row.out .bubble-author { color:rgba(26,18,0,.82); }
    .bubble-time { flex:none; font-variant-numeric:tabular-nums; white-space:nowrap; opacity:.9; }

    .anexos-do-turno { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
    .anexo-chip { display:flex; align-items:center; gap:5px; background:rgba(0,0,0,.05); border:1px solid var(--border); border-radius:8px; padding:4px 8px; font-size:11.5px; }
    .row.in .anexo-chip { background:var(--bg-hover); }

    .diagnostico-card { margin-top:8px; border-top:1px solid rgba(0,0,0,.08); padding-top:8px; }
    .diagnostico-secao { margin-bottom:8px; }
    .diagnostico-secao-titulo { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--accent); margin-bottom:3px; }
    .nivel-confianca-badge { display:inline-block; font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:20px; background:var(--bg-hover); color:var(--text-md); margin-bottom:6px; }
    .ficha-operacional { margin-top:8px; border-top:1px solid rgba(0,0,0,.08); padding-top:8px; white-space:normal; }
    .ficha-operacional-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
    .ficha-operacional-badge { display:inline-flex; align-items:center; min-height:22px; padding:2px 8px; border-radius:999px; background:var(--accent-glow); color:var(--accent); border:1px solid rgba(29,78,216,.2); font-size:10.5px; font-weight:900; text-transform:uppercase; letter-spacing:.035em; }
    .ficha-operacional-grid { display:grid; gap:8px; }
    .ficha-operacional-item { border-left:3px solid rgba(29,78,216,.28); padding-left:9px; }
    .ficha-operacional-label { font-size:10.5px; font-weight:900; text-transform:uppercase; letter-spacing:.035em; color:var(--accent); margin-bottom:2px; }
    .ficha-operacional-value { color:var(--text-hi); line-height:1.45; }
    .ficha-operacional-details { margin-top:10px; border-top:1px solid rgba(0,0,0,.08); padding-top:8px; }
    .ficha-operacional-details summary { cursor:pointer; color:var(--text-md); font-size:12px; font-weight:800; }
    .ficha-operacional-detalhe { margin-top:8px; }
    .ficha-operacional-validacao { margin-top:10px; border-top:1px solid rgba(0,0,0,.08); padding-top:8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .validacao-pergunta { font-size:12px; color:var(--text-md); font-weight:700; }
    .validacao-opcoes { display:flex; flex-wrap:wrap; gap:6px; }
    .validacao-opcoes button { font-size:11.5px; padding:4px 9px; border:1px solid var(--border); background:var(--bg-card); color:var(--text-hi); border-radius:7px; font-weight:700; cursor:pointer; }
    .validacao-badge { display:inline-flex; align-items:center; padding:2px 8px; border-radius:999px; font-size:10.5px; font-weight:900; text-transform:uppercase; letter-spacing:.03em; }
    .validacao-badge-ok { background:rgba(34,197,94,.14); color:#15803d; border:1px solid rgba(34,197,94,.28); }
    .validacao-badge-falha { background:rgba(239,68,68,.14); color:#b91c1c; border:1px solid rgba(239,68,68,.28); }
    .validacao-badge-parcial { background:rgba(234,179,8,.16); color:#854d0e; border:1px solid rgba(234,179,8,.28); }
    .validacao-badge-pendente { background:var(--bg-hover); color:var(--text-md); border:1px solid var(--border); }
    .validacao-link { font-size:11px; background:none; border:none; color:var(--accent); cursor:pointer; text-decoration:underline; padding:0; }
    .validacao-evidencia-hint { font-size:11.5px; color:var(--text-lo); width:100%; }

    .fonte-corrigido-actions { display:flex; gap:8px; margin-top:6px; }
    .fonte-corrigido-actions button { font-size:12px; padding:5px 10px; }
    .fonte-corrigido-card { margin-top:10px; padding:10px; border:1px solid rgba(29,78,216,.24); border-radius:8px; background:rgba(29,78,216,.06); white-space:normal; }
    .fonte-corrigido-title { font-size:12px; font-weight:900; color:var(--accent); margin-bottom:6px; text-transform:uppercase; letter-spacing:.03em; }
    .fonte-corrigido-meta { font-size:12px; color:var(--text-md); line-height:1.45; }
    .fonte-corrigido-status { display:inline-flex; margin-top:6px; padding:3px 7px; border-radius:999px; background:rgba(234,179,8,.16); color:#854d0e; border:1px solid rgba(234,179,8,.28); font-size:11px; font-weight:800; }
    .fonte-corrigido-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
    .fonte-corrigido-actions button { border:1px solid var(--border); background:var(--bg-card); color:var(--accent); border-radius:7px; font-weight:800; cursor:pointer; }
    .fonte-corrigido-historico { margin-top:8px; font-size:11.5px; color:var(--text-lo); }
    .fonte-corrigido-aviso { margin-top:8px; padding:8px; border:1px solid #fed7aa; border-radius:8px; background:#fff7ed; color:#9a3412; font-size:12px; white-space:normal; }
    .diff-modal-backdrop { display:none; position:fixed; inset:0; z-index:400; background:rgba(0,0,0,.45); align-items:center; justify-content:center; padding:20px; }
    .diff-modal-backdrop.ativo { display:flex; }
    .diff-modal { width:min(900px, 96vw); max-height:86vh; display:flex; flex-direction:column; background:var(--bg-card); border:1px solid var(--border); border-radius:10px; box-shadow:0 18px 50px rgba(0,0,0,.25); overflow:hidden; }
    .diff-modal-head { display:flex; justify-content:space-between; gap:12px; padding:12px 14px; border-bottom:1px solid var(--border); }
    .diff-modal-title { font-weight:900; color:var(--text-hi); font-size:14px; }
    .diff-modal-subtitle { color:var(--text-lo); font-size:12px; margin-top:2px; }
    .diff-modal-close { border:1px solid var(--border); background:var(--bg-app); border-radius:7px; cursor:pointer; width:30px; height:30px; }
    .diff-modal-body { overflow:auto; padding:12px; }
    .diff-line { display:grid; grid-template-columns:28px 1fr; gap:8px; font-family:ui-monospace,Consolas,monospace; font-size:12px; line-height:1.45; padding:2px 6px; border-radius:4px; white-space:pre-wrap; word-break:break-word; }
    .diff-line.adicionada { background:#dcfce7; color:#166534; }
    .diff-line.removida { background:#fee2e2; color:#991b1b; }
    .diff-line.modificada { background:#fef9c3; color:#854d0e; }
    .diff-line.igual { color:var(--text-lo); }

    .typing-row .bubble { display:flex; align-items:center; gap:6px; color:var(--text-lo); font-size:13px; }
    .typing-dot { width:6px; height:6px; border-radius:50%; background:var(--text-lo); animation:pulse 1.2s infinite ease-in-out; }

    @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }

    .composer { border-top:1px solid var(--border); background:var(--bg-card); padding:12px 16px; }
    .anexos-pendentes { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
    .anexo-pendente { display:flex; align-items:center; gap:6px; background:var(--bg-hover); border:1px solid var(--border); border-radius:8px; padding:5px 8px; font-size:12px; }
    .anexo-pendente button { border:none; background:none; cursor:pointer; color:var(--text-lo); font-size:14px; line-height:1; padding:0; }
    .composer-row { display:flex; align-items:flex-end; gap:8px; }
    .composer-row textarea { flex:1; box-sizing:border-box; min-height:44px; max-height:160px; resize:none; border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:13.5px; font-family:inherit; background:var(--bg-app); color:var(--text-hi); }
    .composer-btn { width:40px; height:40px; border-radius:10px; border:1px solid var(--border); background:var(--bg-app); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .composer-btn.enviar { background:var(--accent); border-color:var(--accent); color:#1a1200; }
    .composer-hint { font-size:11px; color:var(--text-lo); margin-top:5px; }

    .error-banner { display:none; background:#fee2e2; color:#991b1b; border:1px solid #fecaca; border-radius:8px; padding:10px 12px; font-size:13px; margin:10px 16px 0; }
  </style>
</head>
<body>
  <div class="layout">
    <div class="topbar">
      <a class="topbar-voltar" href="/app/ia-service/atendimentos.html">&larr; Atendimentos</a>
      <span class="topbar-codigo" id="topbar-codigo">—</span>
      <span class="topbar-status" id="topbar-status">—</span>
    </div>

    <div id="error-banner" class="error-banner"></div>

    <div class="chat-body" id="chat-body">
      <div style="text-align:center;color:var(--text-lo);font-size:13px;padding:20px;">Carregando…</div>
    </div>

    <div class="composer">
      <div class="anexos-pendentes" id="anexos-pendentes"></div>
      <div class="composer-row">
        <input type="file" id="anexo-input" multiple style="display:none" accept=".txt,.log,.xml,.json,.sql,.csv,.prw,.tlpp,.png,.jpg,.jpeg,.webp,.pdf">
        <button class="composer-btn" type="button" title="Anexar arquivo" onclick="document.getElementById('anexo-input').click()">📎</button>
        <textarea id="composer-texto" placeholder="Descreva o problema, cole a mensagem de erro, ou responda à investigação..."></textarea>
        <button class="composer-btn enviar" type="button" title="Enviar" onclick="enviarMensagem()">➤</button>
      </div>
      <div class="composer-hint">Ctrl+Enter para enviar · anexe prints, logs e fonte relacionados ao problema</div>
    </div>
  </div>

  <div class="diff-modal-backdrop" id="diff-modal-backdrop" onclick="fecharDiffModal(event)">
    <div class="diff-modal" role="dialog" aria-modal="true" onclick="event.stopPropagation()">
      <div class="diff-modal-head">
        <div>
          <div class="diff-modal-title" id="diff-modal-title">Comparar alteracoes</div>
          <div class="diff-modal-subtitle" id="diff-modal-subtitle"></div>
        </div>
        <button class="diff-modal-close" type="button" title="Fechar" onclick="fecharDiffModal()">x</button>
      </div>
      <div class="diff-modal-body" id="diff-modal-body"></div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const atendimentoId = params.get('id');
    let anexosPendentes = []; // [{id, nomeOriginal, mimeType, eCodigo}]
    let enviando = false;

    function showError(msg) {
      const el = document.getElementById('error-banner');
      el.textContent = msg;
      el.style.display = 'block';
    }
    function hideError() {
      document.getElementById('error-banner').style.display = 'none';
    }
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    }

    async function api(path, opts = {}) {
      const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(body.error || `Erro ${r.status}`);
      return body;
    }

    function empresaIdAtual() {
      return window._iahubEmpresa?.id || null;
    }

    // Renderiza texto simples com suporte minimo a blocos de codigo markdown
    // (```...```), sem depender de lib de markdown externa — suficiente para
    // o formato que o prompt builder pede à IA (seção "Fonte corrigido").
    function renderizarTextoComCodigo(texto) {
      const partes = String(texto ?? '').split(/```[a-zA-Z]*\n?/);
      return partes.map((parte, i) => {
        const escapado = escapeHtml(parte);
        return i % 2 === 1 ? `<pre><code>${escapado}</code></pre>` : escapado;
      }).join('');
    }
    function formatarDataHoraMensagem(iso) {
      if (!iso) return '';
      try {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return String(iso);
        return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      } catch (_) { return String(iso); }
    }
    function rotuloPapelMensagem(papel, direcao) {
      if (papel === 'assistant') return 'IA';
      if (papel === 'customer') return 'Cliente';
      if (papel === 'system') return 'Sistema';
      return direcao === 'out' ? 'Analista' : 'Mensagem';
    }

    function renderizarDiagnostico(diagnostico, nivelConfianca) {
      if (!diagnostico) return '';
      const ORDEM = ['Diagnóstico', 'Causa provável', 'Evidências', 'Correção proposta', 'Fonte corrigido', 'Alterações realizadas', 'Validação'];
      let html = '<div class="diagnostico-card">';
      if (nivelConfianca) html += `<span class="nivel-confianca-badge">${escapeHtml(nivelConfianca)}</span>`;
      for (const secao of ORDEM) {
        if (!diagnostico[secao]) continue;
        html += `<div class="diagnostico-secao"><div class="diagnostico-secao-titulo">${secao}</div>${renderizarTextoComCodigo(diagnostico[secao])}</div>`;
      }
      html += '</div>';
      return html;
    }

    const ROTULO_VALIDACAO = {
      RESOLVEU: 'Resolveu',
      NAO_RESOLVEU: 'Não resolveu',
      PARCIALMENTE: 'Resolveu parcialmente',
      NAO_TESTADO: 'Ainda não testei',
      EVIDENCIA_EXTERNA: 'Evidência externa (sem confirmação do analista)',
      AGUARDANDO_VALIDACAO: 'Aguardando validação',
    };

    // Correção preventiva pré-publicação (seção 3): comentário de validação é
    // texto do analista, NUNCA HTML confiável — persistido sem sanitização
    // (preserva o texto original no banco) e sem exibição hoje, mas qualquer
    // UI futura que vier a mostrá-lo DEVE passar por esta função, nunca
    // interpolar `comentario` direto em innerHTML/template string. Reaproveita
    // o mesmo escapeHtml já usado em toda a ficha operacional — não há
    // segurança adicional "pela ausência de uso"; esta é a única barreira e
    // deve ser tratada como obrigatória, não opcional.
    function renderizarComentarioValidacao(comentario) {
      const texto = String(comentario ?? '').trim();
      if (!texto) return '';
      return escapeHtml(texto).replace(/\n/g, '<br>');
    }

    // Fase 3 — confirmação discreta de solução, integrada à ficha operacional.
    // Nunca bloqueia o atendimento; comentário é opcional e só relevante para
    // falha/parcial (seção 4 da especificação).
    function renderizarValidacaoSolucao(mensagemId, validacaoSolucao) {
      if (!mensagemId) return '';
      const status = validacaoSolucao?.status || 'AGUARDANDO_VALIDACAO';
      const confirmadoPeloAnalista = !!validacaoSolucao?.ultimaConfirmacao;
      const badgeClasse = {
        RESOLVEU: 'validacao-badge-ok', NAO_RESOLVEU: 'validacao-badge-falha',
        PARCIALMENTE: 'validacao-badge-parcial', NAO_TESTADO: 'validacao-badge-pendente',
        EVIDENCIA_EXTERNA: 'validacao-badge-pendente', AGUARDANDO_VALIDACAO: 'validacao-badge-pendente',
      }[status] || 'validacao-badge-pendente';
      const statusHtml = `<span class="validacao-badge ${badgeClasse}">${escapeHtml(ROTULO_VALIDACAO[status] || status)}</span>`;
      const pergunta = confirmadoPeloAnalista
        ? `${statusHtml} <button type="button" class="validacao-link" onclick="abrirValidacaoSolucao('${escapeHtml(mensagemId)}')">reavaliar</button>`
        : `<span class="validacao-pergunta">A orientação resolveu o problema?</span>
           <div class="validacao-opcoes" id="validacao-opcoes-${escapeHtml(mensagemId)}">
             <button type="button" onclick="confirmarValidacaoSolucao('${escapeHtml(mensagemId)}','RESOLVEU')">Sim, resolveu</button>
             <button type="button" onclick="confirmarValidacaoSolucao('${escapeHtml(mensagemId)}','NAO_RESOLVEU')">Não resolveu</button>
             <button type="button" onclick="confirmarValidacaoSolucao('${escapeHtml(mensagemId)}','PARCIALMENTE')">Resolveu parcialmente</button>
             <button type="button" onclick="confirmarValidacaoSolucao('${escapeHtml(mensagemId)}','NAO_TESTADO')">Ainda não testei</button>
           </div>
           ${status === 'EVIDENCIA_EXTERNA' ? `<div class="validacao-evidencia-hint">${statusHtml} — o chamado teve movimento no SoftExpert, mas isso não confirma se a orientação da IA resolveu.</div>` : ''}`;
      return `<div class="ficha-operacional-validacao" id="validacao-card-${escapeHtml(mensagemId)}">${pergunta}</div>`;
    }

    function renderizarRespostaOperacional(ficha, diagnostico, nivelConfianca, texto, mensagemId) {
      if (!ficha?.temEstrutura) return diagnostico ? renderizarDiagnostico(diagnostico, nivelConfianca) : renderizarTextoComCodigo(texto);
      const itens = [
        ['Diagnostico', ficha.diagnostico],
        ['Acao recomendada', ficha.acaoRecomendada],
        ['Evidencia', ficha.evidencia],
        ['Validacao', ficha.validacao],
        ['Proximo passo', ficha.proximoPasso],
      ].filter(([, valor]) => String(valor || '').trim());
      const detalhes = (ficha.detalhes || [])
        .filter(d => d?.titulo && d?.conteudo)
        .map(d => `<div class="ficha-operacional-detalhe"><div class="diagnostico-secao-titulo">${escapeHtml(d.titulo)}</div>${renderizarTextoComCodigo(d.conteudo)}</div>`)
        .join('');
      const arquivo = ficha.possuiArquivoCorrigido
        ? '<div class="ficha-operacional-item"><div class="ficha-operacional-label">Arquivo corrigido</div><div class="ficha-operacional-value">Fonte corrigido disponivel abaixo.</div></div>'
        : '';
      return `
        <div class="ficha-operacional">
          <div class="ficha-operacional-head">
            <span class="ficha-operacional-badge">${escapeHtml(ficha.rotuloDiagnostico || 'Resposta objetiva')}</span>
            ${nivelConfianca ? `<span class="nivel-confianca-badge">${escapeHtml(nivelConfianca)}</span>` : ''}
          </div>
          <div class="ficha-operacional-grid">
            ${itens.map(([label, valor]) => `<div class="ficha-operacional-item"><div class="ficha-operacional-label">${escapeHtml(label)}</div><div class="ficha-operacional-value">${renderizarTextoComCodigo(valor)}</div></div>`).join('')}
            ${arquivo}
          </div>
          ${detalhes ? `<details class="ficha-operacional-details"><summary>Analise completa, evidencias e historico</summary>${detalhes}</details>` : ''}
          ${renderizarValidacaoSolucao(mensagemId, ficha.validacaoSolucao)}
        </div>
      `;
    }

    async function confirmarValidacaoSolucao(mensagemId, resultado) {
      const card = document.getElementById(`validacao-card-${mensagemId}`);
      if (!card) return;
      let comentario = null;
      if (resultado === 'NAO_RESOLVEU' || resultado === 'PARCIALMENTE') {
        // Mesmo limite validado no backend (COMENTARIO_MAX_CHARS em
        // validacao-solucao-service.js) — truncar aqui é só UX preventiva;
        // a rejeição real (400) continua sendo feita no servidor.
        comentario = window.prompt('Comentário (opcional) — o que aconteceu?')?.slice(0, 2000) || null;
      }
      try {
        const empresaId = empresaIdAtual();
        const resp = await api(`/api/ia-service/atendimentos/${atendimentoId}/mensagens/${mensagemId}/validacao?empresa_id=${empresaId}`, {
          method: 'POST',
          body: JSON.stringify({ resultado, comentario }),
        });
        card.outerHTML = renderizarValidacaoSolucao(mensagemId, resp.estadoAtual);
      } catch (err) {
        showError('Não foi possível registrar a validação: ' + err.message);
      }
    }

    async function abrirValidacaoSolucao(mensagemId) {
      const card = document.getElementById(`validacao-card-${mensagemId}`);
      if (!card) return;
      card.outerHTML = renderizarValidacaoSolucao(mensagemId, { status: 'AGUARDANDO_VALIDACAO', ultimaConfirmacao: null });
    }

    function numeroVersao(item, historico) {
      const idx = (historico || []).findIndex(v => String(v.id) === String(item?.id));
      return idx >= 0 ? idx + 1 : (item?.numeroVersao || '?');
    }

    function renderizarFonteCorrigidoCard(item) {
      const versao = item.versao || item;
      const original = item.original || {};
      const historico = item.historico || [];
      const nVersao = numeroVersao(versao, historico);
      const historicoHtml = historico.length
        ? `<div class="fonte-corrigido-historico">Historico: ${historico.map(v => `v${numeroVersao(v, historico)} ${escapeHtml(v.nomeOriginal || 'arquivo')}`).join(' -> ')}</div>`
        : '';
      return `
        <div class="fonte-corrigido-card">
          <div class="fonte-corrigido-title">Fonte corrigido gerado</div>
          <div class="fonte-corrigido-meta">
            <div><strong>Arquivo:</strong> ${escapeHtml(versao.nomeOriginal || 'Fonte corrigido')}</div>
            <div><strong>Versao:</strong> v${escapeHtml(nVersao)}</div>
            <div><strong>Original:</strong> ${escapeHtml(original.nomeOriginal || 'Nao identificado')}</div>
          </div>
          <span class="fonte-corrigido-status">Correcao proposta - aguardando validacao</span>
          <div class="fonte-corrigido-actions">
            <button type="button" onclick="baixarFonteCorrigido('${escapeHtml(versao.id)}')">Baixar fonte corrigido</button>
            <button type="button" onclick="compararFonteCorrigido('${escapeHtml(original.id)}','${escapeHtml(versao.id)}')">Comparar alteracoes</button>
          </div>
          ${historicoHtml}
        </div>
      `;
    }

    function renderizarAvisosFonteCorrigido(avisos) {
      if (!avisos?.length) return '';
      return avisos.map(a => `<div class="fonte-corrigido-aviso">${escapeHtml(a)}</div>`).join('');
    }

    function montarFontesCorrigidosPorMensagem(anexos) {
      const porId = new Map((anexos || []).map(a => [String(a.id), a]));
      const correcoes = (anexos || []).filter(a => a.anexoOriginalId && a.mensagemOrigemId);
      const porOriginal = new Map();
      for (const a of anexos || []) {
        const raiz = String(a.anexoOriginalId || a.id);
        if (!porOriginal.has(raiz)) porOriginal.set(raiz, []);
        porOriginal.get(raiz).push(a);
      }
      for (const lista of porOriginal.values()) {
        lista.sort((a, b) => String(a.criadoEm || '').localeCompare(String(b.criadoEm || '')));
      }
      const porMensagem = {};
      for (const versao of correcoes) {
        const original = porId.get(String(versao.anexoOriginalId));
        if (!original) continue;
        (porMensagem[versao.mensagemOrigemId] ||= []).push({
          versao,
          original,
          historico: porOriginal.get(String(versao.anexoOriginalId)) || [original, versao],
        });
      }
      return porMensagem;
    }

    function addBubble({ id, direcao, texto, anexos, diagnostico, nivelConfianca, criadoEm, papel, fontesCorrigidos, avisosFonteCorrigido, respostaOperacional }) {
      const chatBody = document.getElementById('chat-body');
      const row = document.createElement('div');
      row.className = `row ${direcao}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      const autor = rotuloPapelMensagem(papel, direcao);
      const horario = formatarDataHoraMensagem(criadoEm || new Date().toISOString());
      const cabecalhoMensagem = `<div class="bubble-header"><span class="bubble-author">${escapeHtml(autor)}</span><span class="bubble-time">${escapeHtml(horario)}</span></div>`;

      const corpo = direcao === 'in' && (respostaOperacional || diagnostico)
        ? renderizarRespostaOperacional(respostaOperacional, diagnostico, nivelConfianca, texto, id)
        : renderizarTextoComCodigo(texto);
      const fontesHtml = (fontesCorrigidos || []).map(renderizarFonteCorrigidoCard).join('');
      bubble.innerHTML = cabecalhoMensagem + corpo + fontesHtml + renderizarAvisosFonteCorrigido(avisosFonteCorrigido);

      if (anexos && anexos.length) {
        const anexosDiv = document.createElement('div');
        anexosDiv.className = 'anexos-do-turno';
        anexosDiv.innerHTML = anexos.map(a => `<span class="anexo-chip">📄 ${escapeHtml(a.nomeOriginal)}</span>`).join('');
        bubble.appendChild(anexosDiv);
      }

      row.appendChild(bubble);
      chatBody.appendChild(row);
      chatBody.scrollTop = chatBody.scrollHeight;
      return row;
    }

    async function baixarFonteCorrigido(anexoId) {
      try {
        const empresaId = empresaIdAtual();
        const r = await fetch(`/api/ia-service/anexos/${anexoId}/download?empresa_id=${empresaId}`);
        if (!r.ok) {
          const body = await r.json().catch(() => ({}));
          throw new Error(body.error || `Erro ${r.status}`);
        }
        const cd = r.headers.get('Content-Disposition') || '';
        const nome = decodeURIComponent((cd.match(/filename="([^"]+)"/) || [])[1] || 'fonte-corrigido.txt');
        const url = URL.createObjectURL(await r.blob());
        const a = document.createElement('a');
        a.href = url;
        a.download = nome;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      } catch (err) {
        showError('Nao foi possivel baixar o fonte corrigido: ' + err.message);
      }
    }

    function renderizarDiff(linhas) {
      const saida = [];
      for (let i = 0; i < (linhas || []).length; i++) {
        const atual = linhas[i];
        const proxima = linhas[i + 1];
        if (atual.tipo === 'removida' && proxima?.tipo === 'adicionada') {
          saida.push(`<div class="diff-line modificada"><span>~</span><span>${escapeHtml(atual.texto)}\n${escapeHtml(proxima.texto)}</span></div>`);
          i++;
          continue;
        }
        const sinal = atual.tipo === 'adicionada' ? '+' : atual.tipo === 'removida' ? '-' : ' ';
        saida.push(`<div class="diff-line ${escapeHtml(atual.tipo)}"><span>${sinal}</span><span>${escapeHtml(atual.texto)}</span></div>`);
      }
      return saida.join('') || '<div class="fonte-corrigido-aviso">Nenhuma diferenca identificada.</div>';
    }

    async function compararFonteCorrigido(originalId, versaoId) {
      try {
        const empresaId = empresaIdAtual();
        const resultado = await api(`/api/ia-service/anexos/${originalId}/diff/${versaoId}?empresa_id=${empresaId}`);
        document.getElementById('diff-modal-title').textContent = 'Comparar alteracoes';
        document.getElementById('diff-modal-subtitle').textContent = `${resultado.original?.nomeOriginal || 'Original'} x ${resultado.versao?.nomeOriginal || 'Versao corrigida'}`;
        document.getElementById('diff-modal-body').innerHTML = renderizarDiff(resultado.diff);
        document.getElementById('diff-modal-backdrop').classList.add('ativo');
      } catch (err) {
        showError('Nao foi possivel comparar as alteracoes: ' + err.message);
      }
    }

    function fecharDiffModal(event) {
      if (event && event.target !== document.getElementById('diff-modal-backdrop')) return;
      document.getElementById('diff-modal-backdrop').classList.remove('ativo');
    }

    function showTyping() {
      hideTyping();
      const chatBody = document.getElementById('chat-body');
      const row = document.createElement('div');
      row.className = 'row in typing-row';
      row.id = 'typing-row';
      row.innerHTML = `<div class="bubble"><span class="typing-dot"></span> Analisando…</div>`;
      chatBody.appendChild(row);
      chatBody.scrollTop = chatBody.scrollHeight;
    }
    function hideTyping() {
      document.getElementById('typing-row')?.remove();
    }

    async function carregarAtendimento() {
      const empresaId = empresaIdAtual();
      if (!empresaId || !atendimentoId) return showError('Atendimento não identificado.');
      try {
        const atendimento = await api(`/api/ia-service/atendimentos/${atendimentoId}?empresa_id=${empresaId}`);
        document.getElementById('topbar-codigo').textContent = atendimento.codigo;
        document.getElementById('topbar-status').textContent = atendimento.status;

        const [mensagens, anexosDoAtendimento] = await Promise.all([
          api(`/api/ia-service/atendimentos/${atendimentoId}/mensagens?empresa_id=${empresaId}`),
          api(`/api/ia-service/atendimentos/${atendimentoId}/anexos?empresa_id=${empresaId}`),
        ]);

        const chatBody = document.getElementById('chat-body');
        chatBody.innerHTML = '';

        const anexosPorMensagem = {};
        const fontesCorrigidosPorMensagem = montarFontesCorrigidosPorMensagem(anexosDoAtendimento);
        for (const a of anexosDoAtendimento) {
          if (!a.mensagemId) continue;
          (anexosPorMensagem[a.mensagemId] ||= []).push(a);
        }

        for (const m of mensagens) {
          if (m.papel === 'system') continue;
          addBubble({
            id: m.id,
            direcao: m.papel === 'user' ? 'out' : 'in',
            texto: m.conteudo,
            anexos: anexosPorMensagem[m.id],
            diagnostico: m.diagnostico,
            nivelConfianca: m.nivelConfianca,
            criadoEm: m.criadoEm,
            papel: m.papel,
            fontesCorrigidos: fontesCorrigidosPorMensagem[m.id],
            respostaOperacional: m.respostaOperacional,
          });
        }
      } catch (err) {
        showError('Não foi possível carregar o atendimento: ' + err.message);
      }
    }

    document.getElementById('anexo-input').addEventListener('change', async (e) => {
      const empresaId = empresaIdAtual();
      const arquivos = [...e.target.files];
      e.target.value = '';
      for (const arquivo of arquivos) {
        const formData = new FormData();
        formData.append('arquivo', arquivo);
        try {
          const r = await fetch(`/api/ia-service/atendimentos/${atendimentoId}/anexos?empresa_id=${empresaId}`, { method: 'POST', body: formData });
          const anexo = await r.json();
          if (!r.ok) throw new Error(anexo.error || `Erro ${r.status}`);
          anexosPendentes.push(anexo);
          renderizarAnexosPendentes();
        } catch (err) {
          showError(`Não foi possível anexar "${arquivo.name}": ` + err.message);
        }
      }
    });

    function renderizarAnexosPendentes() {
      const container = document.getElementById('anexos-pendentes');
      container.innerHTML = anexosPendentes.map((a, i) => `
        <span class="anexo-pendente">📄 ${escapeHtml(a.nomeOriginal)} <button onclick="removerAnexoPendente(${i})" title="Remover">✕</button></span>
      `).join('');
    }
    function removerAnexoPendente(i) {
      anexosPendentes.splice(i, 1);
      renderizarAnexosPendentes();
    }

    async function enviarMensagem() {
      if (enviando) return;
      hideError();
      const empresaId = empresaIdAtual();
      const textarea = document.getElementById('composer-texto');
      const texto = textarea.value.trim();
      if (!texto) return showError('Digite uma mensagem antes de enviar.');

      const anexosDoTurno = anexosPendentes.slice();
      addBubble({ direcao: 'out', texto, anexos: anexosDoTurno, criadoEm: new Date().toISOString(), papel: 'user' });
      textarea.value = '';
      anexosPendentes = [];
      renderizarAnexosPendentes();
      showTyping();
      enviando = true;

      try {
        const resposta = await api(`/api/ia-service/atendimentos/${atendimentoId}/investigar?empresa_id=${empresaId}`, {
          method: 'POST',
          body: JSON.stringify({ texto, anexoIds: anexosDoTurno.map(a => a.id) }),
        });
        hideTyping();
        addBubble({ id: resposta.id, direcao: 'in', texto: resposta.conteudo, diagnostico: resposta.diagnostico, nivelConfianca: resposta.nivelConfianca, criadoEm: resposta.criadoEm, papel: 'assistant', fontesCorrigidos: resposta.fontesCorrigidos, avisosFonteCorrigido: resposta.avisosFonteCorrigido, respostaOperacional: resposta.respostaOperacional });
      } catch (err) {
        hideTyping();
        addBubble({ direcao: 'in', texto: 'Não foi possível concluir a análise: ' + err.message, criadoEm: new Date().toISOString(), papel: 'assistant' });
      } finally {
        enviando = false;
      }
    }

    document.getElementById('composer-texto').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.ctrlKey) {
        e.preventDefault();
        enviarMensagem();
      }
    });

    window._iahubAuthReady?.then(carregarAtendimento) ?? carregarAtendimento();
  </script>
</body>
</html>
