<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IAHub</title>
  <link rel="stylesheet" href="/css/iahub.css">
  <style>
    .hub-shell {
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 8%, rgba(37,99,235,.13), transparent 28%),
        radial-gradient(circle at 84% 18%, rgba(20,184,166,.10), transparent 26%),
        var(--bg-base);
    }
    .hub-main { min-height: 100vh; display: flex; flex-direction: column; }
    .hub-topbar { gap: 12px; }
    .hub-topbar .topbar-title { font-size: 16px; font-weight: 800; letter-spacing: .02em; }
    .topbar-actions { margin-left: 10px; display: flex; align-items: center; gap: 10px; order: 3; }
    .topbar-company-slot { display: contents; }
    #_guia-btn { display: none !important; }
    #_empresa-badge { order: 2; margin-left: auto !important; }
    .hub-logout {
      height: 34px; padding: 0 13px; border-radius: 8px;
      display: inline-flex; align-items: center; gap: 7px;
      border: 1px solid rgba(220,38,38,.24);
      color: #b91c1c; background: #fff5f5;
      font-size: 13px; font-weight: 800; cursor: pointer;
      transition: background .15s, border-color .15s, transform .15s, box-shadow .15s;
    }
    .hub-logout:hover {
      background: #fee2e2; border-color: rgba(220,38,38,.55);
      box-shadow: 0 8px 20px rgba(220,38,38,.12); transform: translateY(-1px);
    }
    .hub-content {
      flex: 1; width: min(1520px, calc(100vw - 48px)); margin: 0 auto;
      padding: 28px 0 34px; display: flex; flex-direction: column; min-height: 0;
    }
    .systems-panel {
      border: 1px solid rgba(148,163,184,.32);
      background: rgba(255,255,255,.74);
      box-shadow: 0 24px 70px rgba(15,23,42,.10);
      border-radius: 18px; padding: 24px; min-height: 0;
      backdrop-filter: blur(10px);
    }
    .systems-head {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 18px; margin-bottom: 18px;
    }
    .systems-kicker {
      font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
      color: var(--accent); font-weight: 900; margin-bottom: 5px;
    }
    .systems-title {
      font-size: 28px; font-weight: 900; color: var(--text-hi);
      line-height: 1.12;
    }
    .systems-subtitle { font-size: 13px; color: var(--text-md); margin-top: 7px; }
    .systems-count {
      border: 1px solid var(--border); border-radius: 999px;
      background: var(--bg-card); color: var(--text-md);
      padding: 7px 12px; font-size: 12px; font-weight: 800; white-space: nowrap;
    }
    .systems-frame {
      max-height: min(536px, calc(100vh - 190px));
      overflow-y: auto; padding: 2px 6px 2px 2px;
      scrollbar-width: thin; scrollbar-color: rgba(37,99,235,.45) transparent;
    }
    .systems-grid {
      display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 16px;
    }
    .systems-grid.single-system {
      grid-template-columns: minmax(360px, 430px);
    }
    .system-card {
      position: relative; min-height: 292px; overflow: hidden;
      border: 1px solid rgba(148,163,184,.34); border-radius: 14px;
      background: var(--bg-card); box-shadow: 0 10px 28px rgba(15,23,42,.08);
      cursor: pointer; isolation: isolate; display: flex; flex-direction: column;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .system-card:hover {
      transform: translateY(-4px);
      border-color: color-mix(in srgb, var(--system-accent) 48%, var(--border));
      box-shadow: 0 18px 42px rgba(15,23,42,.15);
    }
    .system-image {
      min-height: 132px; border-bottom: 1px solid rgba(148,163,184,.22);
      background-size: cover; background-position: center;
      transform: scale(1.01); transition: transform .22s ease, filter .22s ease;
      filter: saturate(.88) contrast(.92) brightness(1.06);
      position: relative;
    }
    .system-image::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.82));
    }
    .system-card:hover .system-image { transform: scale(1.04); filter: saturate(.95) contrast(.96) brightness(1.08); }
    .system-fallback {
      min-height: 132px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, color-mix(in srgb, var(--system-accent) 18%, #fff), #f8fafc);
      color: color-mix(in srgb, var(--system-accent) 72%, #0f172a); font-size: 64px; font-weight: 900;
      border-bottom: 1px solid rgba(148,163,184,.22);
    }
    .system-body {
      padding: 18px 18px 17px; color: var(--text-hi);
      display: flex; flex-direction: column; gap: 11px; flex: 1;
      background: linear-gradient(180deg, #fff, #f8fafc);
    }
    .system-chip {
      align-self: flex-start; display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid color-mix(in srgb, var(--system-accent) 26%, var(--border)); border-radius: 999px;
      background: color-mix(in srgb, var(--system-accent) 9%, #fff); padding: 5px 10px;
      font-size: 12px; color: color-mix(in srgb, var(--system-accent) 74%, #0f172a);
      font-weight: 900;
    }
    .system-name { font-size: 25px; line-height: 1.08; font-weight: 900; color: #0f172a; }
    .system-desc { font-size: 15px; line-height: 1.45; color: #475569; min-height: 43px; font-weight: 600; }
    .system-action {
      margin-top: auto; height: 42px; border: 0; border-radius: 9px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--system-accent); color: #fff; font-weight: 900; cursor: pointer;
      box-shadow: 0 10px 24px color-mix(in srgb, var(--system-accent) 24%, transparent);
      font-size: 15px;
    }
    .empty-state {
      grid-column: 1 / -1; border: 1px dashed var(--border-hi); border-radius: 12px;
      padding: 38px; text-align: center; color: var(--text-md); background: var(--bg-card);
    }
    .empty-title { color: var(--text-hi); font-weight: 900; margin-bottom: 8px; }
    @media (max-width: 1280px) { .systems-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    @media (max-width: 980px) { .systems-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 720px) {
      .hub-content { width: calc(100vw - 28px); padding-top: 18px; }
      .systems-panel { padding: 16px; border-radius: 14px; }
      .systems-head { align-items: flex-start; flex-direction: column; }
      .systems-title { font-size: 22px; }
      .systems-grid { grid-template-columns: 1fr; }
      .systems-grid.single-system { grid-template-columns: 1fr; }
      .systems-frame { max-height: none; overflow: visible; }
      .system-card { min-height: 220px; }
      .hub-logout span { display: none; }
    }
  </style>
</head>
<body>
  <div class="hub-shell">
    <main class="hub-main">
      <div class="topbar hub-topbar">
        <span class="topbar-title">IAHub</span>
        <div class="topbar-actions">
          <div class="topbar-company-slot"></div>
          <button class="hub-logout" onclick="logout()" title="Sair">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span>Sair</span>
          </button>
        </div>
      </div>

      <section class="hub-content">
        <div class="systems-panel">
          <div class="systems-head">
            <div>
              <div class="systems-kicker">Plataforma</div>
              <div class="systems-title">Selecione um sistema</div>
              <div class="systems-subtitle" id="systems-subtitle">Carregando sistemas disponiveis...</div>
            </div>
            <div class="systems-count" id="systems-count">0 sistemas</div>
          </div>

          <div class="systems-frame">
            <div class="systems-grid" id="systems-grid"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[ch]));
    }

    function attr(value) {
      return esc(value).replace(/`/g, '&#96;');
    }

    function sigla(system) {
      return String(system.name || system.code || 'S').trim().slice(0, 2).toUpperCase();
    }

    async function selecionarSistema(systemCode) {
      const res = await fetch('/api/sistemas/selecionar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ system_code: systemCode }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        sessionStorage.setItem('_iahub_aviso', data.error || 'Sem acesso ao sistema selecionado.');
        location.reload();
        return;
      }
      location.href = data.redirectUrl || '/iahub.html';
    }

    async function carregarSistemas() {
      await window._iahubAuthReady;
      const grid = document.getElementById('systems-grid');
      const subtitle = document.getElementById('systems-subtitle');
      const count = document.getElementById('systems-count');
      const sistemas = await fetch('/api/sistemas/disponiveis').then(r => r.json()).catch(() => []);
      const total = Array.isArray(sistemas) ? sistemas.length : 0;

      subtitle.textContent = window._iahubEmpresa?.nome
        ? `Empresa ativa: ${window._iahubEmpresa.nome}`
        : 'Escolha uma empresa para continuar.';
      count.textContent = total === 1 ? '1 sistema' : `${total} sistemas`;

      if (!total) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-title">Nenhum sistema disponivel</div>
            <div>Solicite ao administrador acesso a um sistema para esta empresa.</div>
          </div>`;
        return;
      }

      grid.classList.toggle('single-system', total === 1);
      grid.innerHTML = sistemas.map(system => {
        const accent = system.accent || '#2563eb';
        const image = system.image_url || '';
        const fallback = sigla(system);
        const visual = image
          ? `<div class="system-image" style="background-image:url('${attr(image)}')"></div>`
          : `<div class="system-fallback">${esc(fallback)}</div>`;
        return `
          <article class="system-card" style="--system-accent:${attr(accent)}" onclick="selecionarSistema('${attr(system.code)}')">
            ${visual}
            <div class="system-body">
              <div class="system-chip">
                <span>${esc(system.badge || system.code)}</span>
              </div>
              <div class="system-name">${esc(system.name)}</div>
              <div class="system-desc">${esc(system.description || '')}</div>
              <button class="system-action" type="button">Acessar</button>
            </div>
          </article>`;
      }).join('');
    }

    carregarSistemas();
  </script>
</body>
</html>
