<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IAHub</title>
  <link rel="stylesheet" href="/css/iahub.css">
  <style>
    .hub-shell {
      min-height: 100vh;
      background: #f3f7fb;
    }
    .hub-main { min-height: 100vh; display: flex; flex-direction: column; }
    .hub-topbar { gap: 12px; }
    .hub-topbar .topbar-title { font-size: 16px; font-weight: 800; letter-spacing: .02em; }
    .topbar-actions { margin-left: 10px; display: flex; align-items: center; gap: 10px; order: 3; }
    .topbar-company-slot { display: contents; }
    #_guia-btn { display: none !important; }
    #_empresa-badge { order: 2; margin-left: auto !important; }
    .hub-logout {
      height: 34px; padding: 0 13px; border-radius: 8px;
      display: inline-flex; align-items: center; gap: 7px;
      border: 1px solid rgba(220,38,38,.24);
      color: #b91c1c; background: #fff5f5;
      font-size: 13px; font-weight: 800; cursor: pointer;
      transition: background .15s, border-color .15s, transform .15s, box-shadow .15s;
    }
    .hub-logout:hover {
      background: #fee2e2; border-color: rgba(220,38,38,.55);
      box-shadow: 0 8px 20px rgba(220,38,38,.12); transform: translateY(-1px);
    }
    .hub-content {
      flex: 1; width: min(1420px, calc(100vw - 56px)); margin: 0 auto;
      padding: 60px 0 38px; display: flex; flex-direction: column; min-height: 0;
    }
    .systems-panel {
      border: 1px solid #dbe5ef;
      background: #eef4fb;
      box-shadow: 0 22px 56px rgba(15,23,42,.08);
      border-radius: 14px; padding: 34px 36px; min-height: 0;
    }
    .systems-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 18px; margin-bottom: 22px;
    }
    .systems-kicker {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 13px; color: #475569; font-weight: 800; margin-bottom: 4px;
    }
    .systems-kicker::before {
      content: ''; width: 16px; height: 16px; border-radius: 4px;
      border: 2px solid #64748b; box-shadow: 6px 0 0 -2px #64748b, 0 6px 0 -2px #64748b, 6px 6px 0 -2px #64748b;
    }
    .systems-title {
      font-size: 30px; font-weight: 900; color: var(--text-hi);
      line-height: 1.12;
    }
    .systems-subtitle { font-size: 13px; color: var(--text-md); margin-top: 7px; }
    .systems-count {
      border: 1px solid var(--border); border-radius: 999px;
      background: var(--bg-card); color: var(--text-md);
      padding: 7px 12px; font-size: 12px; font-weight: 800; white-space: nowrap;
    }
    .systems-frame {
      max-height: min(690px, calc(100vh - 240px));
      overflow-y: auto; padding: 2px 8px 2px 2px;
      scrollbar-width: thin; scrollbar-color: rgba(37,99,235,.45) transparent;
    }
    .systems-grid {
      display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 18px;
    }
    .systems-grid.few-systems {
      grid-template-columns: repeat(auto-fit, minmax(330px, 360px));
      justify-content: center;
    }
    .systems-grid.single-system {
      grid-template-columns: minmax(320px, 380px);
    }
    .system-card {
      position: relative; min-height: 255px; overflow: hidden;
      border: 1px solid #dde7f1; border-radius: 7px;
      background: #fff; box-shadow: 0 4px 12px rgba(15,23,42,.05);
      cursor: pointer; isolation: isolate; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 18px 22px; text-align: center;
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease, background .16s ease;
    }
    .system-card::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 4px;
      background: var(--system-accent); opacity: .72; transform: scaleX(.72);
      transform-origin: center; transition: transform .16s ease, opacity .16s ease;
    }
    .system-card:hover {
      transform: translateY(-3px);
      border-color: color-mix(in srgb, var(--system-accent) 42%, #dde7f1);
      box-shadow: 0 14px 30px rgba(15,23,42,.12);
    }
    .system-card:hover::after { opacity: 1; transform: scaleX(1); }
    .system-media {
      width: calc(100% + 36px); height: 76px; margin: 0 -18px 18px;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--system-accent) 16%, #fff), #f8fafc);
      border-bottom: 1px solid #edf2f7;
      background-size: cover; background-position: center;
      position: relative;
    }
    .system-media.has-image::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.74));
    }
    .system-icon {
      width: 68px; height: 68px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      color: var(--system-accent);
      background: color-mix(in srgb, var(--system-accent) 9%, #fff);
      margin: -52px 0 18px;
      position: relative; z-index: 1;
      box-shadow: 0 10px 22px rgba(15,23,42,.08);
    }
    .system-icon svg { width: 42px; height: 42px; stroke: currentColor; }
    .system-name {
      font-size: 18px; line-height: 1.25; font-weight: 850; color: #0f172a;
      min-height: 45px; display: flex; align-items: center; justify-content: center;
    }
    .system-desc {
      font-size: 14px; line-height: 1.4; color: #64748b; min-height: 60px;
      margin-top: 6px; max-width: 230px;
    }
    .system-action {
      margin-top: 18px; height: 36px; border: 1px solid color-mix(in srgb, var(--system-accent) 28%, #dbe5ef);
      border-radius: 999px; padding: 0 18px;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      background: #fff; color: color-mix(in srgb, var(--system-accent) 76%, #0f172a);
      font-weight: 850; cursor: pointer; font-size: 14px;
    }
    .empty-state {
      grid-column: 1 / -1; border: 1px dashed var(--border-hi); border-radius: 12px;
      padding: 38px; text-align: center; color: var(--text-md); background: var(--bg-card);
    }
    .empty-title { color: var(--text-hi); font-weight: 900; margin-bottom: 8px; }
    @media (max-width: 1280px) { .systems-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    @media (max-width: 980px) { .systems-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 720px) {
      .hub-content { width: calc(100vw - 28px); padding-top: 24px; }
      .systems-panel { padding: 16px; border-radius: 14px; }
      .systems-head { align-items: flex-start; flex-direction: column; }
      .systems-title { font-size: 22px; }
      .systems-grid { grid-template-columns: 1fr; }
      .systems-grid.few-systems { grid-template-columns: 1fr; }
      .systems-grid.single-system { grid-template-columns: 1fr; }
      .systems-frame { max-height: none; overflow: visible; }
      .system-card { min-height: 230px; }
      .hub-logout span { display: none; }
    }
  </style>
</head>
<body>
  <div class="hub-shell">
    <main class="hub-main">
      <div class="topbar hub-topbar">
        <span class="topbar-title">IAHub</span>
        <div class="topbar-actions">
          <div class="topbar-company-slot"></div>
          <button class="hub-logout" onclick="logout()" title="Sair">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span>Sair</span>
          </button>
        </div>
      </div>

      <section class="hub-content">
        <div class="systems-panel">
          <div class="systems-head">
            <div>
              <div class="systems-kicker">Plataforma</div>
              <div class="systems-title">Selecione um sistema</div>
              <div class="systems-subtitle" id="systems-subtitle">Carregando sistemas disponiveis...</div>
            </div>
            <div class="systems-count" id="systems-count">0 sistemas</div>
          </div>

          <div class="systems-frame">
            <div class="systems-grid" id="systems-grid"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[ch]));
    }

    function attr(value) {
      return esc(value).replace(/`/g, '&#96;');
    }

    const SYSTEM_ICONS = {
      'ia-admin': '<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/>',
      'ia-command': '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9l3 3-3 3"/><path d="M12 15h5"/>',
      recrutamento: '<path d="M16 21v-2a4 4 0 0 0-8 0v2"/><circle cx="12" cy="8" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.8"/><path d="M16 4.2a4 4 0 0 1 0 7.6"/>',
      default: '<rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/>',
    };
    const DEFAULT_SYSTEM_CARD_IMAGE = '/img/system-card-default.jpg';

    function systemIcon(system) {
      const paths = SYSTEM_ICONS[system.code] || SYSTEM_ICONS.default;
      return `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
    }

    async function selecionarSistema(systemCode) {
      const res = await fetch('/api/sistemas/selecionar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ system_code: systemCode }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        sessionStorage.setItem('_iahub_aviso', data.error || 'Sem acesso ao sistema selecionado.');
        location.reload();
        return;
      }
      location.href = data.redirectUrl || '/iahub.html';
    }

    async function carregarSistemas() {
      await window._iahubAuthReady;
      const grid = document.getElementById('systems-grid');
      const subtitle = document.getElementById('systems-subtitle');
      const count = document.getElementById('systems-count');
      const sistemas = await fetch('/api/sistemas/disponiveis').then(r => r.json()).catch(() => []);
      const total = Array.isArray(sistemas) ? sistemas.length : 0;

      subtitle.textContent = window._iahubEmpresa?.nome
        ? `Empresa ativa: ${window._iahubEmpresa.nome}`
        : 'Escolha uma empresa para continuar.';
      count.textContent = total === 1 ? '1 sistema' : `${total} sistemas`;
      grid.classList.toggle('single-system', total === 1);
      grid.classList.toggle('few-systems', total > 1 && total < 5);

      if (!total) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-title">Nenhum sistema disponivel</div>
            <div>Solicite ao administrador acesso a um sistema para esta empresa.</div>
          </div>`;
        return;
      }

      const ordem = { 'ia-admin': 0 };
      const sistemasOrdenados = [...sistemas].sort((a, b) => {
        const oa = ordem[a.code] ?? 10;
        const ob = ordem[b.code] ?? 10;
        if (oa !== ob) return oa - ob;
        return String(a.name || '').localeCompare(String(b.name || ''), 'pt-BR');
      });

      grid.innerHTML = sistemasOrdenados.map(system => {
        const accent = system.accent || '#2563eb';
        const image = system.image_url || DEFAULT_SYSTEM_CARD_IMAGE;
        const mediaStyle = image ? ` style="background-image:url('${attr(image)}')"` : '';
        return `
          <article class="system-card" style="--system-accent:${attr(accent)}" onclick="selecionarSistema('${attr(system.code)}')">
            <div class="system-media${image ? ' has-image' : ''}"${mediaStyle}></div>
            <div class="system-icon">${systemIcon(system)}</div>
            <div class="system-name">${esc(system.name)}</div>
            <div class="system-desc">${esc(system.description || '')}</div>
            <button class="system-action" type="button">Acessar</button>
          </article>`;
      }).join('');
    }

    carregarSistemas();
  </script>
</body>
</html>
