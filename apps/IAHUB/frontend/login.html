<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IAHub — Login</title>
  <link rel="stylesheet" href="/css/iahub.css">
  <style>
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    .spinner-sm {
      display: inline-block; width: 12px; height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .6s linear infinite;
      margin-left: 6px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empresa-label-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    .empresa-label-row .form-label { margin-bottom: 0; }

    /* Estado desabilitado do select com visual diferenciado */
    select.form-control:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .password-wrap {
      position: relative;
    }
    .password-wrap .form-control {
      padding-right: 44px;
    }
    .password-toggle {
      position: absolute;
      top: 50%;
      right: 8px;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transform: translateY(-50%);
      transition: background var(--transition), color var(--transition);
    }
    .password-toggle:hover {
      background: var(--bg-hover);
      color: var(--accent);
    }
    .password-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .password-toggle svg {
      width: 18px;
      height: 18px;
    }

    .login-page {
      align-items: stretch;
      justify-content: stretch;
      background: #fff;
      padding-bottom: 38px;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .login-shell {
      width: 100%;
      min-height: calc(100vh - 38px);
      min-height: calc(100dvh - 38px);
      display: grid;
      grid-template-columns: minmax(360px, 32vw) 1fr;
      background: #fff;
    }

    .login-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: calc(100vh - 38px);
      min-height: calc(100dvh - 38px);
      padding: 48px 52px;
      background: #fff;
      position: relative;
      z-index: 2;
    }

    .login-card {
      width: 100%;
      max-width: 500px;
      padding: 0;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      background: transparent;
    }

    .login-logo {
      margin-bottom: 34px;
      text-align: center;
      overflow: hidden;
    }

    .login-logo-img {
      display: none;
      max-width: 84%;
      max-height: 190px;
      width: auto;
      height: auto;
      object-fit: contain;
      margin: 0 auto 18px;
    }

    .login-logo.has-image .login-logo-img {
      display: block;
    }

    .login-logo.has-image .login-logo-icon,
    .login-logo.has-image h1,
    .login-logo.has-image p {
      display: none;
    }

    .login-visual {
      position: relative;
      min-height: calc(100vh - 38px);
      min-height: calc(100dvh - 38px);
      overflow: hidden;
      background: linear-gradient(135deg, #0f172a, #2563eb);
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px;
    }

    .login-visual::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(8, 77, 132, .62);
      z-index: 1;
    }

    .login-visual.has-image::before {
      background: transparent;
    }

    .login-visual-text {
      position: relative;
      z-index: 2;
      max-width: 760px;
      color: #fff;
      font-size: clamp(32px, 3.2vw, 52px);
      line-height: 1.18;
      font-style: italic;
      font-weight: 600;
      text-align: center;
      text-shadow: 0 2px 12px rgba(0,0,0,.22);
    }

    .login-version {
      display: none;
    }

    .login-footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      min-height: 38px;
      padding: 7px 26px;
      background: #f4f4f5;
      border-top: 1px solid #e5e7eb;
      color: #9ca3af;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      font-size: 13px;
      z-index: 20;
    }

    .login-footer-name {
      color: #2563eb;
      font-weight: 600;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .login-footer-links {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .login-footer-sep {
      color: #c7cbd1;
    }

    @media (max-width: 960px) {
      .login-shell {
        grid-template-columns: 1fr;
      }
      .login-panel {
        min-height: auto;
        padding: 28px 24px;
        align-items: center;
      }
      .login-card {
        max-width: 520px;
      }
      .login-visual {
        min-height: clamp(180px, 30vh, 280px);
        padding: 36px 24px;
        order: -1;
      }
      .login-visual-text {
        font-size: 28px;
      }
    }

    @media (max-width: 560px) {
      .login-page {
        padding-bottom: 0 !important;
        overflow-y: auto !important;
      }
      .login-shell {
        min-height: auto;
      }
      .login-panel {
        padding: 14px 18px 14px;
      }
      .login-visual {
        min-height: 120px;
        padding: 12px 18px;
      }
      .login-visual-text {
        font-size: 20px;
      }
      .login-logo {
        margin-bottom: 10px;
      }
      .login-logo-img {
        max-width: 88%;
        max-height: 76px;
        margin-bottom: 6px;
      }
      .form-group {
        margin-bottom: 9px;
      }
      .form-label {
        margin-bottom: 3px;
        font-size: 11px;
      }
      .form-control {
        min-height: 40px;
        padding-top: 7px;
        padding-bottom: 7px;
      }
      .login-error {
        padding: 8px 10px;
        margin-bottom: 10px;
        font-size: 12px;
      }
      .btn-login {
        margin-top: 2px;
        padding: 9px;
      }
      .login-footer {
        position: static !important;
        min-height: 0 !important;
        padding: 8px 14px calc(8px + env(safe-area-inset-bottom)) !important;
        font-size: 12px;
      }
      .login-footer-links {
        gap: 7px;
      }
    }

    @media (max-width: 560px) and (max-height: 740px) {
      .login-visual {
        min-height: 92px;
      }
      .login-logo-img {
        max-height: 62px;
      }
      .login-panel {
        padding-top: 10px;
      }
    }

    @media (max-width: 560px) {
      .login-page.login-company-selected .login-visual {
        display: none !important;
      }
      .login-page.login-company-selected .login-panel {
        justify-content: flex-start;
        min-height: auto;
        padding-top: 18px;
      }
      .login-page.login-company-selected .login-logo {
        margin-bottom: 12px;
      }
      .login-page.login-company-selected .login-logo-img {
        max-height: 72px !important;
        max-width: 70% !important;
      }
      .login-page.login-company-selected .login-footer {
        margin-top: 8px;
      }
    }

    @media (max-width: 560px) and (max-height: 740px) {
      .login-page.login-company-selected .login-logo-img {
        max-height: 58px !important;
      }
      .login-page.login-company-selected .login-panel {
        padding-top: 12px;
      }
    }

    @media (max-width: 960px) and (orientation: landscape) {
      .login-shell {
        grid-template-columns: minmax(320px, 48vw) 1fr;
        min-height: calc(100dvh - 38px);
      }
      .login-visual {
        order: initial;
        min-height: calc(100dvh - 38px);
      }
      .login-panel {
        justify-content: flex-start;
        min-height: calc(100dvh - 38px);
        padding: 18px 24px;
        overflow-y: auto;
      }
      .login-logo {
        margin-bottom: 14px;
      }
      .login-logo-img {
        max-height: 82px;
        margin-bottom: 8px;
      }
      .form-group {
        margin-bottom: 12px;
      }
    }

    @media (max-width: 960px) and (orientation: landscape) {
      .login-page.login-company-selected .login-visual {
        display: none !important;
      }
      .login-page.login-company-selected .login-shell {
        display: block;
        min-height: auto;
      }
      .login-page.login-company-selected .login-panel {
        min-height: auto;
      }
    }
  </style>
</head>
<body class="login-page">

  <main class="login-shell">
    <section class="login-panel">
      <div class="login-card">
        <div class="login-logo" id="login-logo-wrap">
          <img id="login-logo-img" class="login-logo-img" alt="">
          <div class="login-logo-icon">IA</div>
          <h1>IAHub</h1>
          <p>Plataforma de Automações Inteligentes</p>
        </div>

        <div id="login-error" class="login-error"></div>

        <form onsubmit="doLogin(event)" id="form-login" autocomplete="off">
          <div class="form-group">
            <label class="form-label">Usuário</label>
            <input id="user" type="text" class="form-control" placeholder="Digite seu usuário"
              autocomplete="username" required>
          </div>

          <div class="form-group">
            <label class="form-label">Senha</label>
            <div class="password-wrap">
              <input id="pass" type="password" class="form-control" placeholder="Digite sua senha"
                autocomplete="current-password" required>
              <button type="button" class="password-toggle" id="pass-toggle"
                onclick="toggleLoginPassword()" aria-label="Mostrar senha" title="Mostrar senha">
                <svg id="pass-eye" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <div class="empresa-label-row">
              <label class="form-label">Empresa</label>
              <span id="empresa-spinner" class="spinner-sm" style="display:none"></span>
            </div>
            <select id="empresa-select" class="form-control" disabled>
              <option value="">— Digite usuário e senha para carregar —</option>
            </select>
          </div>

          <button type="submit" class="btn-login" id="btn-login">Entrar</button>
        </form>

        <div class="login-version">IAHub v2.0 · Todos os direitos reservados</div>
      </div>
    </section>

    <section class="login-visual" id="login-visual">
      <div class="login-visual-text" id="login-visual-text">
        Transformando a excelência na gestão em vantagem competitiva para sua empresa.
      </div>
    </section>
  </main>

  <footer class="login-footer">
    <div class="login-footer-name" id="footer-system-name">IAHUB - Onde a gestão encontra a inteligência</div>
    <div class="login-footer-links">
      <span>Política de Privacidade</span>
      <span class="login-footer-sep">|</span>
      <span id="footer-system-version">v2.0</span>
    </div>
  </footer>

  <script>
    let _logado     = false;
    let _role       = null;
    let _checkTimer = null;
    let _bypassAdmin = false;
    let _empresasLogin = [];
    let _loginLogoDefaultUrl = '';
    let _loginBackgroundDefaultUrl = '';
    const BROWSER_SESSION_KEY = 'iahub_browser_session_active';
    const SLOGAN_PADRAO = 'Transformando a excelência na gestão em vantagem competitiva para sua empresa.';

    carregarConfigPublica();

    // ── Se já autenticado, redireciona diretamente (não reutiliza sessão ativa) ──
    (async () => {
      if (sessionStorage.getItem(BROWSER_SESSION_KEY) !== '1') {
        await fetch('/api/logout', { method: 'POST' }).catch(() => null);
        return;
      }
      const me = await fetch('/api/me').catch(() => null);
      if (!me?.ok) return;
      // Sessão ativa encontrada — redireciona sem exibir o formulário.
      // Para trocar de usuário é necessário fazer logout explicitamente.
      const dest = new URLSearchParams(location.search).get('next') || '/iahub.html';
      location.href = dest;
    })();

    // ── Listeners: valida no blur da senha ou no submit ──────────────────────────
    document.getElementById('user').addEventListener('input', ao_trocar_usuario);
    document.getElementById('pass').addEventListener('input', ao_trocar_senha);
    document.getElementById('pass').addEventListener('blur',  verificarAgora);
    document.getElementById('empresa-select').addEventListener('change', () => {
      const id = Number(document.getElementById('empresa-select').value || 0);
      const empresa = _empresasLogin.find(e => e.id === id);
      aplicarIdentidadeLogin(empresa);
    });

    function preloadImagem(url) {
      if (!url || document.querySelector(`link[rel="preload"][href="${url}"]`)) return;
      const link = document.createElement('link');
      link.rel  = 'preload';
      link.as   = 'image';
      link.href = url;
      document.head.appendChild(link);
    }

    async function carregarConfigPublica() {
      try {
        const cfg = await fetch('/api/config/publico').then(r => r.json());
        const nome = cfg.sistema_nome || 'IAHUB';
        const frase = cfg.sistema_frase || 'Onde a gestão encontra a inteligência';
        document.getElementById('footer-system-name').textContent = frase ? `${nome} - ${frase}` : nome;
        document.getElementById('footer-system-version').textContent = cfg.sistema_versao || 'v2.0';
        _loginLogoDefaultUrl = cfg.login_logo_default_url || '';
        _loginBackgroundDefaultUrl = cfg.login_background_default_url || '';
        // Inicia download das imagens padrão imediatamente, em paralelo com o restante do JS.
        preloadImagem(_loginLogoDefaultUrl);
        preloadImagem(_loginBackgroundDefaultUrl);
        aplicarIdentidadeLogin(_empresasLogin.find(e => String(e.id) === document.getElementById('empresa-select').value));
      } catch (_) {}
    }

    function toggleLoginPassword() {
      const input = document.getElementById('pass');
      const btn = document.getElementById('pass-toggle');
      const eye = document.getElementById('pass-eye');
      const mostrar = input.type === 'password';

      input.type = mostrar ? 'text' : 'password';
      btn.setAttribute('aria-label', mostrar ? 'Ocultar senha' : 'Mostrar senha');
      btn.title = mostrar ? 'Ocultar senha' : 'Mostrar senha';
      eye.innerHTML = mostrar
        ? '<path d="M17.9 17.9A10.7 10.7 0 0 1 12 19C5.5 19 2 12 2 12a18.2 18.2 0 0 1 4.2-5.2"></path><path d="M9.9 4.2A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a18.3 18.3 0 0 1-2.1 3.2"></path><path d="M14.1 14.1A3 3 0 0 1 9.9 9.9"></path><path d="M2 2l20 20"></path>'
        : '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle>';
      input.focus();
    }

    // Ao alterar o campo usuário, descarta qualquer sessão em andamento
    function ao_trocar_usuario() {
      if (_logado) {
        _logado      = false;
        _role        = null;
        _bypassAdmin = false;
        resetSelect('Digite usuario e senha para carregar');
        fetch('/api/logout', { method: 'POST' }).catch(() => {});
      }
      clearTimeout(_checkTimer);
      resetSelect('Digite usuario e senha para carregar');
    }

    function ao_trocar_senha() {
      clearTimeout(_checkTimer);
      if (!_logado) resetSelect('Digite usuario e senha para carregar');
    }

    async function verificarAgora() {
      if (_logado) return;
      clearTimeout(_checkTimer);

      const u = document.getElementById('user').value.trim();
      const p = document.getElementById('pass').value;
      if (!u || p.length < 4) return;

      mostrarSpinner(true);
      esconderErro();

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user: u, pass: p }),
        });

        if (!res.ok) {
          resetSelect('— Usuário ou senha inválidos —');
          return;
        }

        const data = await res.json();
        sessionStorage.setItem(BROWSER_SESSION_KEY, '1');
        localStorage.setItem(BROWSER_SESSION_KEY, '1');
        _role   = data.role;
        _logado = true;
        await carregarEmpresas();

      } catch (_) {
        resetSelect('— Erro de conexão —');
      } finally {
        mostrarSpinner(false);
      }
    }

    async function carregarEmpresas(autoRedirecionar = false) {
      mostrarSpinner(true);
      const empresas = await fetch('/api/empresas/minhas').then(r => r.json()).catch(() => []);
      mostrarSpinner(false);
      _empresasLogin = Array.isArray(empresas) ? empresas : [];

      const sel = document.getElementById('empresa-select');

      // Admin sem empresas — entra direto para cadastrar
      if (!empresas.length && _role === 'admin') {
        _bypassAdmin = true;
        aplicarIdentidadeLogin(null);
        sel.innerHTML = '<option value="__admin__">🔧 Administrador — Nenhuma empresa cadastrada</option>';
        sel.disabled  = false;
        document.getElementById('btn-login').textContent = 'Entrar como Administrador';
        return;
      }

      if (!empresas.length) {
        aplicarIdentidadeLogin(null);
        resetSelect('— Nenhuma empresa disponível. Contate o administrador. —');
        return;
      }

      // Pré-carrega imagens de todas as empresas enquanto o usuário escolhe.
      empresas.forEach(e => { preloadImagem(e.login_logo_url); preloadImagem(e.login_background_url); });

      // Popula as opções (ordem alfabética)
      empresas.sort((a, b) => (a.razao_social || a.nome || '').localeCompare(b.razao_social || b.nome || '', 'pt-BR'));
      sel.innerHTML = empresas.length > 1
        ? '<option value="">— Selecione uma empresa —</option>' +
          empresas.map(e => `<option value="${e.id}">${e.razao_social || e.nome || 'Empresa'}</option>`).join('')
        : empresas.map(e => `<option value="${e.id}">${e.razao_social || e.nome || 'Empresa'}</option>`).join('');
      sel.disabled = false;

      // Auto-seleciona se só há uma empresa
      if (empresas.length === 1) {
        sel.value = String(empresas[0].id);
        aplicarIdentidadeLogin(empresas[0]);
        if (autoRedirecionar) {
          await selecionarEAvancar(empresas[0].id);
        }
      } else {
        aplicarIdentidadeLogin(null);
      }
    }

    function resetSelect(placeholder) {
      const sel = document.getElementById('empresa-select');
      sel.innerHTML = `<option value="">${placeholder}</option>`;
      sel.disabled  = true;
      _bypassAdmin  = false;
      _empresasLogin = [];
      aplicarIdentidadeLogin(null);
    }

    function cssUrl(url) {
      return String(url || '').replace(/\\/g, '\\\\').replace(/"/g, '\\"');
    }

    function aplicarIdentidadeLogin(empresa) {
      const logoWrap = document.getElementById('login-logo-wrap');
      const logoImg = document.getElementById('login-logo-img');
      const visual = document.getElementById('login-visual');
      const visualText = document.getElementById('login-visual-text');
      document.body.classList.toggle('login-company-selected', !!empresa);

      const logoUrl = empresa?.login_logo_url || _loginLogoDefaultUrl;
      if (logoUrl) {
        logoImg.src = logoUrl;
        logoImg.alt = empresa?.razao_social || empresa?.nome || 'Logomarca da empresa';
        logoWrap.classList.add('has-image');
      } else {
        logoImg.removeAttribute('src');
        logoImg.alt = '';
        logoWrap.classList.remove('has-image');
      }

      const backgroundUrl = empresa?.login_background_url || _loginBackgroundDefaultUrl;
      if (backgroundUrl) {
        visual.classList.add('has-image');
        visual.style.backgroundImage = `url("${cssUrl(backgroundUrl)}")`;
      } else {
        visual.classList.remove('has-image');
        visual.style.backgroundImage = 'linear-gradient(135deg, #0f172a, #2563eb)';
      }

      visualText.textContent = empresa?.login_slogan?.trim() || (backgroundUrl ? '' : SLOGAN_PADRAO);
    }

    function mostrarSpinner(show) {
      document.getElementById('empresa-spinner').style.display = show ? 'inline-block' : 'none';
    }

    function mostrarErro(msg) {
      const el = document.getElementById('login-error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function esconderErro() {
      document.getElementById('login-error').style.display = 'none';
    }

    // ── Submit ────────────────────────────────────────────────────────────────────
    async function doLogin(e) {
      e.preventDefault();
      esconderErro();

      // Bypass admin sem empresa
      if (_bypassAdmin) {
        const dest = new URLSearchParams(location.search).get('next') || '/empresas.html';
        location.href = dest;
        return;
      }

      // Precisa estar autenticado
      if (!_logado) {
        await verificarAgora();
        if (!_logado) return;
      }

      const sel = document.getElementById('empresa-select');
      const empresaId = sel.value ? Number(sel.value) : null;

      if (!empresaId) {
        mostrarErro('Selecione uma empresa para continuar.');
        sel.focus();
        return;
      }

      await selecionarEAvancar(empresaId);
    }

    async function selecionarEAvancar(empresa_id) {
      const btn = document.getElementById('btn-login');
      btn.innerHTML = '<span class="spinner"></span>Acessando…';
      btn.disabled  = true;

      try {
        const res = await fetch('/api/empresas/selecionar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ empresa_id }),
        });
        if (!res.ok) {
          const { error } = await res.json().catch(() => ({}));
          throw new Error(error || `Erro ${res.status}`);
        }
        const dest = new URLSearchParams(location.search).get('next') || '/iahub.html';
        location.href = dest;
      } catch (err) {
        mostrarErro(err.message || 'Erro ao selecionar empresa. Tente novamente.');
        btn.disabled    = false;
        btn.textContent = 'Entrar';
      }
    }
  </script>
</body>
</html>
