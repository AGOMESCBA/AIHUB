<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auditoria — IA Command</title>
  <link rel="stylesheet" href="/css/iahub.css">
  <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css">
  <style>
    :root { --accent:#7c3aed; --accent-light:#a78bfa; --accent-glow:rgba(124,58,237,.1); }
    .sidebar-logo .logo-icon { background:#7c3aed !important; }
    .topbar-menu-btn {
      flex-shrink:0; background:none; border:none; cursor:pointer;
      width:32px; height:32px; display:flex; align-items:center; justify-content:center;
      border-radius:7px; color:var(--text-md); transition:background var(--transition),color var(--transition);
    }
    .topbar-menu-btn:hover { background:var(--bg-hover); color:var(--text-hi); }
    .topbar-title { flex:1; min-width:0; font-weight:700; }

    .page-kicker   { font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-lo);font-weight:600;margin-bottom:3px; }
    .page-title    { font-size:20px;font-weight:700;color:var(--text-hi);line-height:1.25; }
    .page-subtitle { font-size:13px;color:var(--text-md);margin-top:4px; }
    .page-head     { display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px; }

    .quick-panel  { background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;box-shadow:var(--shadow-sm); }
    .quick-row    { display:flex;align-items:center;gap:10px;flex-wrap:wrap; }
    .filter-area  { padding-top:12px;border-top:1px solid var(--border);margin-top:12px; }
    .filter-status{ font-size:12px;color:var(--text-lo);flex:1; }
    .quick-row .form-control { height:36px;font-size:13px; }
    .quick-row input.form-control { flex:1;min-width:180px; }

    .gp-wrap      { margin-top:10px; }
    .gp-chips-row { display:flex;align-items:center;gap:6px;flex-wrap:wrap;position:relative; }
    .gp-label     { font-size:11px;color:var(--text-lo);white-space:nowrap; }

    .grid-toolbar { display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--bg-card); }
    .grid-title   { font-size:13px;font-weight:600;color:var(--text-hi); }
    .grid-meta    { font-size:12px;color:var(--text-lo);margin-top:1px; }

    .badge-acao { display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:rgba(124,58,237,.1);color:#7c3aed; }

    .detail-overlay { position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:center;justify-content:center; }
    .detail-overlay.show { display:flex; }
    .detail-modal { background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);width:min(640px,95vw);max-height:82vh;overflow-y:auto;padding:24px; }
    .detail-header { display:flex;justify-content:space-between;align-items:center;margin-bottom:14px; }
    .detail-title  { font-size:15px;font-weight:700;color:var(--text-hi); }
    .detail-close  { background:none;border:none;color:var(--text-lo);font-size:22px;cursor:pointer;line-height:1; }
    .detail-close:hover { color:var(--text-hi); }
    .detail-meta  { display:flex;gap:20px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border); }
    .detail-meta-item span { color:var(--text-lo);font-size:11px;display:block;margin-bottom:2px; }
    .detail-meta-item strong { color:var(--text-hi);font-size:13px; }
    .detail-lbl { font-size:11px;font-weight:700;color:var(--text-lo);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px; }
    .detail-pre { background:var(--bg-base);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:320px;overflow-y:auto;color:var(--text-md); }
    .detail-sec { margin-bottom:14px; }

    .tabulator { border:none !important; background:transparent !important; }
    .tabulator .tabulator-header { background:var(--bg-card) !important; border-bottom:1px solid var(--border) !important; }
    .tabulator .tabulator-header .tabulator-col { background:var(--bg-card) !important; border-right:none !important; color:var(--text-lo) !important; font-size:11px !important; font-weight:700 !important; text-transform:uppercase; letter-spacing:.05em; }
    .tabulator .tabulator-header .tabulator-col .tabulator-header-filter input,
    .tabulator .tabulator-header .tabulator-col .tabulator-header-filter select { background:var(--bg-base) !important; color:var(--text-hi) !important; border:1px solid var(--border) !important; border-radius:4px !important; font-size:11px !important; padding:3px 6px !important; width:100% !important; }
    .tabulator .tabulator-row { background:var(--bg-card) !important; border-bottom:1px solid var(--border) !important; cursor:pointer; }
    .tabulator .tabulator-row:hover { background:var(--bg-hover) !important; }
    .tabulator .tabulator-row .tabulator-cell { border-right:none !important; color:var(--text-md); font-size:13px; padding:10px 12px !important; }
    .tabulator .tabulator-row.tabulator-group { background:var(--bg-base) !important; border-bottom:1px solid var(--border) !important; font-size:12px !important; font-weight:700 !important; color:var(--text-lo) !important; }
    .tabulator .tabulator-placeholder { background:var(--bg-card) !important; }
  </style>
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo" onclick="toggleSidebar()">
      <div class="logo-icon">⚡</div>
      <span class="logo-text">IA Command</span>
    </div>
    <div class="sidebar-nav"></div>
    <div class="sidebar-footer"></div>
  </nav>

  <div class="main">
    <div class="topbar">
      <button class="topbar-menu-btn" onclick="toggleSidebar()" title="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <span class="topbar-title"><span style="color:var(--text-lo);font-weight:400">IA Command ›</span> Auditoria</span>
    </div>

    <div class="page-content">
      <div class="page-head">
        <div>
          <div class="page-kicker">Administração</div>
          <div class="page-title">Auditoria</div>
          <div class="page-subtitle">Registro de ações administrativas realizadas no sistema. Somente leitura.</div>
        </div>
        <button class="btn btn-ghost" onclick="carregar()">↻ Atualizar</button>
      </div>

      <div class="quick-panel">
        <div class="quick-row">
          <button class="btn btn-ghost" id="btn-filtros" onclick="toggleFiltros()">+ Mostrar filtros</button>
          <span class="filter-status" id="filter-status">Sem filtros ou agrupamentos ativos</span>
        </div>
        <div class="filter-area" id="filter-area" style="display:none">
          <div class="quick-row" style="margin-bottom:10px">
            <input id="f-usuario" type="text" class="form-control" placeholder="Filtrar por usuário…" oninput="filtrar()">
            <input id="f-acao"    type="text" class="form-control" placeholder="Filtrar por ação…"    oninput="filtrar()">
            <button class="btn btn-ghost" onclick="limparFiltros()">Limpar</button>
          </div>
          <div class="gp-wrap">
            <div class="gp-chips-row" id="gp-chips-row">
              <span class="gp-label">Agrupar por:</span>
            </div>
            <div id="dz"></div>
          </div>
        </div>
      </div>

      <div class="card" style="padding:0;overflow:hidden">
        <div class="grid-toolbar">
          <div>
            <div class="grid-title">Eventos de auditoria</div>
            <div id="count" class="grid-meta">Últimas 200 entradas</div>
          </div>
        </div>
        <div id="tabela"></div>
      </div>
    </div>
  </div>
</div>

<!-- Modal detalhe -->
<div class="detail-overlay" id="detail-overlay" onclick="if(event.target===this)fecharDetalhe()">
  <div class="detail-modal">
    <div class="detail-header">
      <span class="detail-title" id="detail-title">Detalhe do Evento</span>
      <button class="detail-close" onclick="fecharDetalhe()">✕</button>
    </div>
    <div class="detail-meta">
      <div class="detail-meta-item"><span>Data/Hora</span><strong id="d-data">—</strong></div>
      <div class="detail-meta-item"><span>Usuário</span><strong id="d-usuario">—</strong></div>
      <div class="detail-meta-item"><span>IP</span><strong id="d-ip">—</strong></div>
    </div>
    <div class="detail-sec">
      <div class="detail-lbl">Ação</div>
      <div id="d-acao" style="font-size:14px;font-weight:700;color:#7c3aed;margin-bottom:12px"></div>
    </div>
    <div class="detail-sec">
      <div class="detail-lbl">Detalhes</div>
      <pre class="detail-pre" id="d-detalhes"></pre>
    </div>
  </div>
</div>

<script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/grid-group-panel.js"></script>
<script src="/app/ia-command/js/sidebar.js"></script>
<script>
  let table, gp;
  let _dados = [];
  let _filtrosVisiveis = false;
  let _quickFilterFn = null;

  function toggleFiltros() {
    _filtrosVisiveis = !_filtrosVisiveis;
    document.getElementById('filter-area').style.display = _filtrosVisiveis ? '' : 'none';
    document.getElementById('btn-filtros').textContent = _filtrosVisiveis ? '− Ocultar filtros' : '+ Mostrar filtros';
    if (_filtrosVisiveis && gp) setTimeout(() => gp.refresh(), 50);
  }

  function filtrar() {
    if (!table) return;
    if (_quickFilterFn) { table.removeFilter(_quickFilterFn); _quickFilterFn = null; }
    const u = document.getElementById('f-usuario').value.trim().toLowerCase();
    const a = document.getElementById('f-acao').value.trim().toLowerCase();
    if (u || a) {
      _quickFilterFn = row => {
        if (u && !(row.usuario || '').toLowerCase().includes(u)) return false;
        if (a && !(row.acao || '').toLowerCase().includes(a)) return false;
        return true;
      };
      table.addFilter(_quickFilterFn);
    }
    const ativos = [u, a].filter(Boolean).length;
    document.getElementById('filter-status').textContent =
      ativos ? `${ativos} filtro(s) ativo(s)` : 'Sem filtros ou agrupamentos ativos';
  }

  function limparFiltros() {
    document.getElementById('f-usuario').value = '';
    document.getElementById('f-acao').value    = '';
    filtrar();
  }

  function verDetalhe(row) {
    document.getElementById('detail-title').textContent  = `Evento #${row.id?.slice(0,8) || '—'}`;
    document.getElementById('d-data').textContent    = row.criado_em?.slice(0,19).replace('T',' ') || '—';
    document.getElementById('d-usuario').textContent = row.usuario || '—';
    document.getElementById('d-ip').textContent      = row.ip      || '—';
    document.getElementById('d-acao').textContent    = row.acao    || '—';
    let det = row.detalhes || '';
    try { det = JSON.stringify(JSON.parse(det), null, 2); } catch {}
    document.getElementById('d-detalhes').textContent = det || '(sem detalhes)';
    document.getElementById('detail-overlay').classList.add('show');
  }

  function fecharDetalhe() { document.getElementById('detail-overlay').classList.remove('show'); }

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function carregar() {
    _dados = await fetch('/api/ia-command/admin/auditoria?limit=200').then(r => r.json()).catch(() => []);
    if (table) { table.replaceData(_dados); return; }
    _criarTabela(_dados);
  }

  function _criarTabela(data) {
    gp = createGroupPanel({
      chipsRowId: 'gp-chips-row', dropZoneId: 'dz',
      storageKey: 'iac_admin_auditoria_group',
      getTable: () => table,
    });

    table = new Tabulator('#tabela', {
      data, index: 'id', layout: 'fitColumns', movableColumns: true,
      height: 'calc(100vh - 330px)',
      groupBy: gp.getActiveFields(), groupStartOpen: true,
      placeholder: '<div style="padding:40px;text-align:center;color:var(--text-lo)">Nenhum evento de auditoria registrado.</div>',
      columns: [
        { title: 'Data/Hora', field: 'criado_em', width: 155,
          formatter: c => c.getValue()?.slice(0,19).replace('T',' ') || '' },
        { title: 'Usuário', field: 'usuario', width: 140, headerFilter: true,
          formatter: c => `<strong style="color:var(--text-hi)">${esc(c.getValue() || '—')}</strong>` },
        { title: 'Ação', field: 'acao', minWidth: 160, headerFilter: true,
          formatter: c => c.getValue() ? `<span class="badge-acao">${esc(c.getValue())}</span>` : '—' },
        { title: 'Detalhes', field: 'detalhes', minWidth: 180, headerFilter: false, groupable: false,
          formatter: c => {
            const v = c.getValue();
            if (!v) return '<span style="color:var(--text-lo)">—</span>';
            let parsed = v;
            try { parsed = JSON.stringify(JSON.parse(v)); } catch {}
            return `<span style="font-family:monospace;font-size:11px;color:var(--text-lo)">${esc(parsed.slice(0,80))}${parsed.length > 80 ? '…' : ''}</span>`;
          },
        },
        { title: 'IP', field: 'ip', width: 130, headerFilter: false,
          formatter: c => `<span style="font-family:monospace;font-size:12px">${esc(c.getValue() || '—')}</span>` },
      ],
      rowClick: (e, row) => verDetalhe(row.getData()),
    });

    gp.refresh();
    gp.applyToTable();
  }

  window._iahubAuthReady?.then(carregar) ?? carregar();
</script>
</body>
</html>
