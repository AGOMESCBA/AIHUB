<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conexões ERP — IA Command</title>
  <link rel="stylesheet" href="/css/iahub.css">
  <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css">
  <style>
    :root { --accent:#7c3aed; --accent-light:#a78bfa; --accent-glow:rgba(124,58,237,.1); }
    .sidebar-logo .logo-icon { background:#7c3aed !important; }
    .topbar-menu-btn {
      flex-shrink:0; background:none; border:none; cursor:pointer;
      width:32px; height:32px; display:flex; align-items:center; justify-content:center;
      border-radius:7px; color:var(--text-md); transition:background var(--transition),color var(--transition);
    }
    .topbar-menu-btn:hover { background:var(--bg-hover); color:var(--text-hi); }
    .topbar-title { flex:1; min-width:0; font-weight:700; }

    .page-kicker   { font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-lo);font-weight:600;margin-bottom:3px; }
    .page-title    { font-size:20px;font-weight:700;color:var(--text-hi);line-height:1.25; }
    .page-subtitle { font-size:13px;color:var(--text-md);margin-top:4px; }
    .page-head     { display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px; }

    .quick-panel  { background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;box-shadow:var(--shadow-sm); }
    .quick-row    { display:flex;align-items:center;gap:10px;flex-wrap:wrap; }
    .filter-area  { padding-top:12px;border-top:1px solid var(--border);margin-top:12px; }
    .filter-status{ font-size:12px;color:var(--text-lo);flex:1; }
    .quick-row .form-control { height:36px;font-size:13px; }
    .quick-row input.form-control  { flex:1;min-width:200px; }
    .quick-row select.form-control { width:auto;min-width:145px; }

    .gp-wrap      { margin-top:10px; }
    .gp-chips-row { display:flex;align-items:center;gap:6px;flex-wrap:wrap;position:relative; }
    .gp-label     { font-size:11px;color:var(--text-lo);white-space:nowrap; }

    .grid-toolbar { display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--bg-card); }
    .grid-title   { font-size:13px;font-weight:600;color:var(--text-hi); }
    .grid-meta    { font-size:12px;color:var(--text-lo);margin-top:1px; }

    .badge-ativa    { display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:#dcfce7;color:#15803d; }
    .badge-inativa  { display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:var(--bg-hover);color:var(--text-lo); }
    .badge-sqlserver{ display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:rgba(0,120,212,.12);color:#0078d4; }
    .badge-postgresql { display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:rgba(51,103,145,.12);color:#336791; }
    .badge-sqlite   { display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:rgba(124,58,237,.12);color:#7c3aed; }
    .badge-ok   { display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:#dcfce7;color:#15803d; }
    .badge-fail { display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:#fee2e2;color:#b91c1c; }

    .btn-icon { background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:5px;font-size:15px;transition:background .15s; }
    .btn-icon:hover { background:var(--bg-hover); }

    .tabulator { border:none !important; background:transparent !important; }
    .tabulator .tabulator-header { background:var(--bg-card) !important; border-bottom:1px solid var(--border) !important; }
    .tabulator .tabulator-header .tabulator-col { background:var(--bg-card) !important; border-right:none !important; color:var(--text-lo) !important; font-size:11px !important; font-weight:700 !important; text-transform:uppercase; letter-spacing:.05em; }
    .tabulator .tabulator-header .tabulator-col .tabulator-header-filter input,
    .tabulator .tabulator-header .tabulator-col .tabulator-header-filter select { background:var(--bg-base) !important; color:var(--text-hi) !important; border:1px solid var(--border) !important; border-radius:4px !important; font-size:11px !important; padding:3px 6px !important; width:100% !important; }
    .tabulator .tabulator-row { background:var(--bg-card) !important; border-bottom:1px solid var(--border) !important; cursor:pointer; }
    .tabulator .tabulator-row:hover { background:var(--bg-hover) !important; }
    .tabulator .tabulator-row .tabulator-cell { border-right:none !important; color:var(--text-md); font-size:13px; padding:10px 12px !important; }
    .tabulator .tabulator-row.tabulator-group { background:var(--bg-base) !important; border-bottom:1px solid var(--border) !important; font-size:12px !important; font-weight:700 !important; color:var(--text-lo) !important; }
    .tabulator .tabulator-placeholder { background:var(--bg-card) !important; }
  </style>
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo" onclick="toggleSidebar()">
      <div class="logo-icon">⚡</div>
      <span class="logo-text">IA Command</span>
    </div>
    <div class="sidebar-nav"></div>
    <div class="sidebar-footer"></div>
  </nav>

  <div class="main">
    <div class="topbar">
      <button class="topbar-menu-btn" onclick="toggleSidebar()" title="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <span class="topbar-title"><span style="color:var(--text-lo);font-weight:400">IA Command ›</span> Conexões ERP</span>
    </div>

    <div class="page-content">
      <div class="page-head">
        <div>
          <div class="page-kicker">Configuração</div>
          <div class="page-title">Conexões ERP</div>
          <div class="page-subtitle">Configure e teste as conexões com seu banco de dados ERP.</div>
        </div>
        <button class="btn btn-primary" onclick="abrirFormulario()">＋ Nova Conexão</button>
      </div>

      <div class="quick-panel">
        <div class="quick-row">
          <button class="btn btn-ghost" id="btn-filtros" onclick="toggleFiltros()">+ Mostrar filtros</button>
          <span class="filter-status" id="filter-status">Sem filtros ou agrupamentos ativos</span>
        </div>
        <div class="filter-area" id="filter-area" style="display:none">
          <div class="quick-row" style="margin-bottom:10px">
            <input id="f-busca" type="text" class="form-control" placeholder="Buscar por nome…" oninput="filtrar()">
            <select id="f-tipo" class="form-control" onchange="filtrar()">
              <option value="">Todos os tipos</option>
              <option value="sqlserver">SQL Server</option>
              <option value="postgresql">PostgreSQL</option>
              <option value="sqlite">SQLite</option>
            </select>
            <select id="f-ativo" class="form-control" onchange="filtrar()">
              <option value="">Todos os status</option>
              <option value="1">Ativa</option>
              <option value="0">Inativa</option>
            </select>
            <button class="btn btn-ghost" onclick="limparFiltros()">Limpar</button>
          </div>
          <div class="gp-wrap">
            <div class="gp-chips-row" id="gp-chips-row">
              <span class="gp-label">Agrupar por:</span>
            </div>
            <div id="dz"></div>
          </div>
        </div>
      </div>

      <div class="card" style="padding:0;overflow:hidden">
        <div class="grid-toolbar">
          <div>
            <div class="grid-title">Conexões cadastradas</div>
            <div id="count" class="grid-meta"></div>
          </div>
        </div>
        <div id="tabela"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/grid-group-panel.js"></script>
<script src="/app/ia-command/js/sidebar.js"></script>
<script>
  let table, gp;
  let _dados = [];
  let _filtrosVisiveis = false;
  let _quickFilterFn = null;

  function _openTab(url, label, icon) {
    if (window.parent !== window)
      window.parent.postMessage({ type: 'mdi:open-tab', url, label, icon }, location.origin);
    else location.href = url;
  }

  function abrirFormulario(id) {
    const url = id
      ? `/app/ia-command/config-conexao-form.html?id=${encodeURIComponent(id)}`
      : '/app/ia-command/config-conexao-form.html';
    _openTab(url, id ? 'Editar Conexão' : 'Nova Conexão', '🔌');
  }

  function toggleFiltros() {
    _filtrosVisiveis = !_filtrosVisiveis;
    document.getElementById('filter-area').style.display = _filtrosVisiveis ? '' : 'none';
    document.getElementById('btn-filtros').textContent = _filtrosVisiveis ? '− Ocultar filtros' : '+ Mostrar filtros';
    if (_filtrosVisiveis && gp) setTimeout(() => gp.refresh(), 50);
  }

  function filtrar() {
    if (!table) return;
    if (_quickFilterFn) { table.removeFilter(_quickFilterFn); _quickFilterFn = null; }
    const b = document.getElementById('f-busca').value.trim().toLowerCase();
    const t = document.getElementById('f-tipo').value;
    const a = document.getElementById('f-ativo').value;
    if (b || t || a !== '') {
      _quickFilterFn = row => {
        if (t && row.tipo !== t) return false;
        if (a !== '' && String(row.ativo) !== a) return false;
        if (b && !(row.nome || '').toLowerCase().includes(b)) return false;
        return true;
      };
      table.addFilter(_quickFilterFn);
    }
    const ativos = [b, t, a].filter(Boolean).length;
    document.getElementById('filter-status').textContent =
      ativos ? `${ativos} filtro(s) ativo(s)` : 'Sem filtros ou agrupamentos ativos';
  }

  function limparFiltros() {
    document.getElementById('f-busca').value = '';
    document.getElementById('f-tipo').value  = '';
    document.getElementById('f-ativo').value = '';
    filtrar();
  }

  async function ativar(id) {
    await fetch(`/api/ia-command/connections/${id}/activate`, { method: 'POST' });
    carregar();
  }

  async function testar(id) {
    const r    = await fetch(`/api/ia-command/connections/${id}/test`, { method: 'POST' });
    const data = await r.json();
    alert(data.ok ? `✅ ${data.mensagem}` : `❌ ${data.mensagem}`);
    carregar();
  }

  async function excluir(id, nome) {
    if (!confirm(`Excluir a conexão "${nome}"?`)) return;
    await fetch(`/api/ia-command/connections/${id}`, { method: 'DELETE' });
    carregar();
  }

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function carregar() {
    _dados = await fetch('/api/ia-command/connections').then(r => r.json()).catch(() => []);
    if (table) { table.replaceData(_dados); return; }
    _criarTabela(_dados);
  }

  function _criarTabela(data) {
    gp = createGroupPanel({
      chipsRowId: 'gp-chips-row', dropZoneId: 'dz',
      storageKey: 'iac_config_conexoes_group',
      getTable: () => table,
    });

    table = new Tabulator('#tabela', {
      data, index: 'id', layout: 'fitColumns', movableColumns: true,
      height: 'calc(100vh - 330px)',
      groupBy: gp.getActiveFields(), groupStartOpen: true,
      placeholder: '<div style="padding:40px;text-align:center;color:var(--text-lo)">Nenhuma conexão cadastrada.</div>',
      columns: [
        { title: 'Nome', field: 'nome', minWidth: 160, headerFilter: true,
          formatter: c => `<strong style="color:var(--text-hi)">${esc(c.getValue())}</strong>` },
        { title: 'Tipo', field: 'tipo', width: 120,
          headerFilter: 'select',
          headerFilterParams: { values: { '':'Todos', sqlserver:'sqlserver', postgresql:'postgresql', sqlite:'sqlite' } },
          formatter: c => {
            const v = c.getValue();
            return v ? `<span class="badge-${v}">${v}</span>` : '';
          },
        },
        { title: 'Servidor', field: 'host', minWidth: 140, headerFilter: true,
          formatter: c => {
            const row  = c.getRow().getData();
            const detalhe = row.tipo === 'sqlite'
              ? row.host
              : `${row.host || '—'}${row.port ? ':' + row.port : ''} / ${row.database || '—'}`;
            return `<span style="font-family:monospace;font-size:12px">${esc(detalhe)}</span>`;
          },
        },
        { title: 'Filial', field: 'filial', width: 80,
          formatter: c => c.getValue() || '<span style="color:var(--text-lo)">—</span>' },
        { title: 'Status', field: 'ativo', width: 95,
          headerFilter: 'select',
          headerFilterParams: { values: { '':'Todos', '1':'Ativa', '0':'Inativa' } },
          formatter: c => c.getValue()
            ? '<span class="badge-ativa">● Ativa</span>'
            : '<span class="badge-inativa">○ Inativa</span>' },
        { title: 'Teste', field: 'teste_ok', width: 90, groupable: false,
          formatter: c => {
            const v = c.getValue();
            if (v === 1) return '<span class="badge-ok">✓ OK</span>';
            if (v === 0) return '<span class="badge-fail">✗ Falhou</span>';
            return '<span style="color:var(--text-lo)">—</span>';
          },
        },
        { title: 'Ações', field: 'id', width: 140, headerFilter: false, groupable: false, hozAlign: 'right',
          formatter: cell => {
            const row  = cell.getRow().getData();
            const id   = row.id;
            const nome = esc(row.nome);
            const ativarBtn = !row.ativo
              ? `<button class="btn-icon" onclick="event.stopPropagation();ativar('${id}')" title="Ativar" style="font-size:12px">✔ Ativar</button>`
              : '';
            return `${ativarBtn}
                    <button class="btn-icon" onclick="event.stopPropagation();testar('${id}')" title="Testar">🔌</button>
                    <button class="btn-icon" onclick="event.stopPropagation();abrirFormulario('${id}')" title="Editar">✏️</button>
                    <button class="btn-icon" onclick="event.stopPropagation();excluir('${id}','${nome}')" title="Excluir" style="color:#dc2626">🗑</button>`;
          },
        },
      ],
      rowClick: (e, row) => { if (!e.target.closest('button')) abrirFormulario(row.getData().id); },
      dataFiltered: (_f, rows) => {
        const total = _dados.length;
        const qtd   = rows?.length ?? total;
        document.getElementById('count').textContent =
          qtd === total ? _label(qtd) : `${qtd} de ${total} conexões`;
      },
    });

    gp.refresh();
    gp.applyToTable();
    document.getElementById('count').textContent = _label(data.length);
  }

  function _label(n) { return n === 1 ? '1 conexão' : `${n} conexões`; }

  window._iahubAuthReady?.then(carregar) ?? carregar();
</script>
</body>
</html>
