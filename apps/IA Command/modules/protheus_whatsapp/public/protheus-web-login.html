<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IA Command - Acesso Web</title>
  <style>
    :root {
      --bg: #0b141a;
      --panel: #111b21;
      --panel-2: #202c33;
      --text: #e9edef;
      --muted: #8696a0;
      --border: #2a3942;
      --accent: #00a884;
      --accent-hover: #06cf9c;
      --danger: #ff7b7b;
      --shadow: 0 20px 70px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .shell {
      width: min(440px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .head {
      padding: 24px 26px 18px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .logo {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: #06251d;
      font-weight: 900;
      letter-spacing: 0;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      letter-spacing: 0;
    }
    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .body { padding: 24px 26px 26px; }
    .step { display: none; }
    .step.active { display: block; }
    label {
      display: block;
      margin-bottom: 7px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    input {
      width: 100%;
      height: 46px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #0b141a;
      color: var(--text);
      font-size: 16px;
      padding: 0 14px;
      outline: none;
      letter-spacing: 0;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,168,132,.16); }
    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 18px;
    }
    button {
      min-height: 42px;
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 0 15px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      color: #06251d;
      background: var(--accent);
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    button.ghost {
      background: transparent;
      border-color: var(--border);
      color: var(--text);
    }
    button.ghost:hover { background: var(--panel-2); }
    .status {
      min-height: 20px;
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.45;
      color: var(--muted);
      word-break: break-word;
    }
    .status.error { color: var(--danger); }
    .status.ok { color: var(--accent-hover); }
    .code-row {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 7px;
    }
    .code-row input {
      text-align: center;
      padding: 0;
      font-size: 22px;
      font-weight: 800;
    }
    .hidden-code { position: absolute; left: -9999px; opacity: 0; }
    .meta {
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    @media (max-width: 480px) {
      body { padding: 0; place-items: stretch; }
      .shell { width: 100%; min-height: 100vh; border: none; border-radius: 0; }
      .head, .body { padding-left: 20px; padding-right: 20px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="head">
      <div class="brand">
        <div class="logo">IA</div>
        <div>
          <h1>IA Command</h1>
          <p class="subtitle">Chat Protheus via WhatsApp</p>
        </div>
      </div>
      <p class="subtitle">Entre com o numero sincronizado no cadastro de usuarios do Protheus.</p>
    </section>

    <section class="body">
      <div class="step active" id="step-phone">
        <label for="phone">WhatsApp</label>
        <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+55 92 99999-9999">
        <div class="actions">
          <span></span>
          <button id="send" type="button">Enviar codigo</button>
        </div>
      </div>

      <div class="step" id="step-code">
        <p class="meta" id="code-meta">Codigo enviado pelo WhatsApp.</p>
        <label for="code-hidden">Codigo</label>
        <input class="hidden-code" id="code-hidden" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
        <div class="code-row" id="code-row" aria-hidden="true">
          <input maxlength="1" inputmode="numeric">
          <input maxlength="1" inputmode="numeric">
          <input maxlength="1" inputmode="numeric">
          <input maxlength="1" inputmode="numeric">
          <input maxlength="1" inputmode="numeric">
          <input maxlength="1" inputmode="numeric">
        </div>
        <div class="actions">
          <button class="ghost" id="back" type="button">Trocar numero</button>
          <button id="verify" type="button">Entrar</button>
        </div>
      </div>

      <div class="status" id="status"></div>
    </section>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const state = { celular: '', challengeId: '' };
    const codeInputs = [...document.querySelectorAll('#code-row input')];

    function digits(v) { return String(v || '').replace(/\D/g, ''); }
    function status(msg, type) {
      const el = $('status');
      el.textContent = msg || '';
      el.className = 'status' + (type ? ' ' + type : '');
    }
    function show(step) {
      $('step-phone').classList.toggle('active', step === 'phone');
      $('step-code').classList.toggle('active', step === 'code');
      status('');
      if (step === 'code') codeInputs[0].focus();
    }
    async function post(path, body) {
      const r = await fetch('/api/ia-command/protheus/web-login/' + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || 'Erro ' + r.status);
      return data;
    }
    function codeValue() { return codeInputs.map(i => i.value).join(''); }
    function setCode(value) {
      const chars = digits(value).slice(0, 6).split('');
      codeInputs.forEach((input, idx) => { input.value = chars[idx] || ''; });
    }

    $('send').addEventListener('click', async () => {
      const celular = digits($('phone').value);
      if (celular.length < 10 || celular.length > 15) {
        status('Informe o numero com DDI e DDD.', 'error');
        return;
      }
      $('send').disabled = true;
      status('Enviando codigo pelo WhatsApp...');
      try {
        const data = await post('start', { celular });
        state.celular = celular;
        state.challengeId = data.challengeId;
        $('code-meta').textContent = 'Codigo enviado para ' + (data.destino || 'seu WhatsApp') + '.';
        show('code');
        status('Codigo enviado.', 'ok');
      } catch (err) {
        status(err.message, 'error');
      } finally {
        $('send').disabled = false;
      }
    });

    $('verify').addEventListener('click', async () => {
      const codigo = codeValue();
      if (codigo.length !== 6) {
        status('Digite os 6 digitos do codigo.', 'error');
        return;
      }
      $('verify').disabled = true;
      status('Validando codigo...');
      try {
        const data = await post('verify', { celular: state.celular, challengeId: state.challengeId, codigo });
        status('Acesso liberado. Abrindo chat...', 'ok');
        window.location.href = data.chatUrl;
      } catch (err) {
        status(err.message, 'error');
      } finally {
        $('verify').disabled = false;
      }
    });

    $('back').addEventListener('click', () => {
      state.challengeId = '';
      codeInputs.forEach(i => { i.value = ''; });
      show('phone');
    });

    codeInputs.forEach((input, idx) => {
      input.addEventListener('input', () => {
        input.value = digits(input.value).slice(0, 1);
        if (input.value && idx < codeInputs.length - 1) codeInputs[idx + 1].focus();
      });
      input.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !input.value && idx > 0) codeInputs[idx - 1].focus();
        if (e.key === 'Enter') $('verify').click();
      });
      input.addEventListener('paste', e => {
        e.preventDefault();
        setCode(e.clipboardData.getData('text'));
      });
    });

    $('phone').addEventListener('keydown', e => {
      if (e.key === 'Enter') $('send').click();
    });
  </script>
</body>
</html>
