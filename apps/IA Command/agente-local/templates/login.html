<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IA Command — Agente Local</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-sm {
      display: inline-block; width: 12px; height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .6s linear infinite;
      margin-left: 6px; vertical-align: middle;
    }

    /* ── Layout base ── */
    body { margin: 0; background: #fff; }

    .login-page {
      min-height: calc(100vh - 38px);
      padding-bottom: 38px;
    }

    .login-shell {
      width: 100%;
      min-height: calc(100vh - 38px);
      display: grid;
      grid-template-columns: minmax(360px, 32vw) 1fr;
      background: #fff;
    }

    /* ── Painel esquerdo (formulário) ── */
    .login-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: calc(100vh - 38px);
      padding: 48px 52px;
      background: #fff;
      position: relative;
      z-index: 2;
    }

    .login-card {
      width: 100%;
      max-width: 500px;
      padding: 0;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      background: transparent;
    }

    /* ── Logo / Brand ── */
    .login-logo {
      margin-bottom: 34px;
      text-align: center;
      overflow: hidden;
    }
    .login-logo-img {
      display: none;
      max-width: 84%;
      max-height: 190px;
      width: auto;
      height: auto;
      object-fit: contain;
      margin: 0 auto 18px;
    }
    .login-logo.has-image .login-logo-img { display: block; }
    .login-logo.has-image .login-logo-icon,
    .login-logo.has-image h1,
    .login-logo.has-image p { display: none; }

    .login-logo-icon {
      width: 52px; height: 52px;
      background: var(--accent);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; margin: 0 auto 12px;
      box-shadow: 0 4px 16px rgba(124,58,237,.3);
    }
    .login-logo h1 {
      margin: 0 0 4px;
      font-size: 20px; font-weight: 800; color: var(--text-hi); line-height: 1.2;
    }
    .login-logo p {
      margin: 0;
      font-size: 12px; color: var(--text-lo);
    }

    /* ── Painel direito (visual) ── */
    .login-visual {
      position: relative;
      min-height: calc(100vh - 38px);
      overflow: hidden;
      background: linear-gradient(135deg, #0f172a, #2563eb);
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px;
    }
    .login-visual::before {
      content: '';
      position: absolute; inset: 0;
      background: rgba(8, 77, 132, .62);
      z-index: 1;
    }
    .login-visual.has-image::before { background: transparent; }

    .login-visual-text {
      position: relative; z-index: 2;
      max-width: 760px; color: #fff;
      font-size: clamp(32px, 3.2vw, 52px);
      line-height: 1.18; font-style: italic; font-weight: 600;
      text-align: center; text-shadow: 0 2px 12px rgba(0,0,0,.22);
    }

    /* ── Empresa seletor ── */
    .empresa-label-row {
      display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
    }
    .empresa-label-row .form-label { margin-bottom: 0; }

    /* ── Botão de submit ── */
    .btn-login {
      display: flex; align-items: center; justify-content: center;
      width: 100%; padding: 11px 24px;
      background: var(--accent); color: #fff;
      font-size: 14px; font-weight: 600; border: 0;
      border-radius: var(--radius-sm); cursor: pointer;
      transition: background var(--transition), box-shadow var(--transition);
      margin-top: 8px;
    }
    .btn-login:hover:not(:disabled) {
      background: #6d28d9;
      box-shadow: 0 4px 14px rgba(124,58,237,.35);
    }
    .btn-login:disabled { opacity: .65; cursor: not-allowed; }

    /* ── Erro ── */
    .login-error {
      display: none; margin-bottom: 16px;
      padding: 10px 14px; background: var(--danger-lt);
      color: var(--danger); border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 500;
    }

    /* ── Pass toggle ── */
    .password-wrap { position: relative; }
    .password-wrap .form-control { padding-right: 44px; }
    .password-toggle {
      position: absolute; top: 50%; right: 8px;
      width: 32px; height: 32px; border: 0;
      border-radius: 8px; background: transparent;
      color: var(--text-md); display: inline-flex;
      align-items: center; justify-content: center;
      cursor: pointer; transform: translateY(-50%);
      transition: background var(--transition), color var(--transition);
    }
    .password-toggle:hover { background: var(--bg-hover); color: var(--accent); }
    .password-toggle svg { width: 18px; height: 18px; }

    /* ── Footer fixo ── */
    .login-footer {
      position: fixed; left: 0; right: 0; bottom: 0;
      min-height: 38px; padding: 7px 26px;
      background: #f4f4f5; border-top: 1px solid #e5e7eb;
      color: #9ca3af; display: flex;
      align-items: center; justify-content: space-between;
      gap: 16px; font-size: 13px; z-index: 20;
    }
    .login-footer-name {
      color: var(--accent); font-weight: 600;
      min-width: 0; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }

    /* ── Responsive ── */
    @media (max-width: 960px) {
      .login-shell { grid-template-columns: 1fr; }
      .login-panel { min-height: auto; padding: 34px 24px; align-items: center; }
      .login-card  { max-width: 520px; }
      .login-visual { min-height: 280px; padding: 36px 24px; order: -1; }
      .login-visual-text { font-size: 28px; }
    }
    @media (max-width: 560px) {
      .login-panel { padding: 28px 18px; }
      .login-visual { min-height: 220px; }
      .login-visual-text { font-size: 23px; }
      .login-logo-img { max-width: 88%; max-height: 145px; }
      .login-footer { padding: 7px 14px; font-size: 12px; }
    }
  </style>
</head>
<body class="login-page">

<main class="login-shell">

  <!-- Painel esquerdo — formulário -->
  <section class="login-panel">
    <div class="login-card">

      <!-- Brand -->
      <div class="login-logo" id="login-logo-wrap">
        <img id="login-logo-img" class="login-logo-img" alt="">
        <div class="login-logo-icon">⚡</div>
        <h1>IA Command</h1>
        <p>Agente Local — Painel Administrativo</p>
      </div>

      {% if erro %}
      <div class="login-error" style="display:block">{{ erro }}</div>
      {% endif %}

      <form method="post" action="/login" id="form-login">
        <!-- Empresa (mostrado apenas se houver empresas sincronizadas) -->
        <div id="empresa-group" style="display:none">
          <div class="form-group">
            <div class="empresa-label-row">
              <label class="form-label">Empresa</label>
            </div>
            <select id="empresa-sel" class="form-control" onchange="selecionarEmpresa(this.value)">
              <option value="">Todas as empresas</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Senha de acesso</label>
          <div class="password-wrap">
            <input type="password" name="senha" id="senha-input" class="form-control"
              placeholder="••••••••" autocomplete="current-password" autofocus required>
            <button type="button" class="password-toggle" onclick="toggleSenha()" title="Mostrar/ocultar senha">
              <svg id="pass-eye" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <div class="form-hint" style="margin-top:6px;font-size:12px;color:var(--text-lo)">
            Senha padrão no primeiro acesso: <code style="font-family:monospace;background:var(--bg-hover);padding:1px 5px;border-radius:4px">admin</code>
          </div>
        </div>

        <button type="submit" class="btn-login">Entrar no painel</button>
      </form>

    </div>
  </section>

  <!-- Painel direito — visual -->
  <section class="login-visual" id="login-visual">
    <div class="login-visual-text" id="login-visual-text">
      Seu ERP conversando com você.
    </div>
  </section>

</main>

<footer class="login-footer">
  <div class="login-footer-name">IA Command — Agente Local</div>
  <div style="color:#9ca3af;font-size:12px">Processamento seguro na sua infraestrutura</div>
</footer>

<script>
  let _empresas = [];

  async function carregarEmpresas() {
    try {
      const lista = await fetch('/api/empresas/public').then(r => r.json());
      if (!Array.isArray(lista) || lista.length === 0) return;
      _empresas = lista;

      const sel = document.getElementById('empresa-sel');
      lista.forEach(e => {
        const opt = document.createElement('option');
        opt.value = e.empresa_id;
        opt.textContent = e.nome;
        sel.appendChild(opt);
      });

      document.getElementById('empresa-group').style.display = '';

      // Pré-carrega imagens
      lista.forEach(e => {
        if (e.logo_url) { new Image().src = e.logo_url; }
        if (e.bg_url)   { new Image().src = e.bg_url; }
      });

      // Auto-seleciona se só há uma empresa
      if (lista.length === 1) {
        sel.value = lista[0].empresa_id;
        selecionarEmpresa(lista[0].empresa_id);
      }
    } catch (_) {}
  }

  function selecionarEmpresa(eid) {
    const emp = _empresas.find(e => String(e.empresa_id) === String(eid));
    const logoWrap   = document.getElementById('login-logo-wrap');
    const logoImg    = document.getElementById('login-logo-img');
    const visual     = document.getElementById('login-visual');
    const visualText = document.getElementById('login-visual-text');

    if (!emp) {
      logoImg.removeAttribute('src');
      logoWrap.classList.remove('has-image');
      visual.classList.remove('has-image');
      visual.style.backgroundImage = '';
      visualText.textContent = 'Seu ERP conversando com você.';
      return;
    }

    if (emp.logo_url) {
      logoImg.src = emp.logo_url;
      logoImg.alt = emp.nome;
      logoWrap.classList.add('has-image');
    } else {
      logoImg.removeAttribute('src');
      logoWrap.classList.remove('has-image');
    }

    if (emp.bg_url) {
      visual.classList.add('has-image');
      visual.style.backgroundImage = `url("${cssEsc(emp.bg_url)}")`;
    } else {
      visual.classList.remove('has-image');
      visual.style.backgroundImage = '';
    }

    visualText.textContent = emp.slogan?.trim() || emp.nome || 'Seu ERP conversando com você.';
  }

  function cssEsc(url) { return url.replace(/["\\]/g, '\\$&'); }

  function toggleSenha() {
    const inp = document.getElementById('senha-input');
    const eye = document.getElementById('pass-eye');
    const mostrar = inp.type === 'password';
    inp.type = mostrar ? 'text' : 'password';
    eye.innerHTML = mostrar
      ? '<path d="M17.9 17.9A10.7 10.7 0 0 1 12 19C5.5 19 2 12 2 12a18.2 18.2 0 0 1 4.2-5.2"></path><path d="M9.9 4.2A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a18.3 18.3 0 0 1-2.1 3.2"></path><path d="M14.1 14.1A3 3 0 0 1 9.9 9.9"></path><path d="M2 2l20 20"></path>'
      : '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle>';
  }

  carregarEmpresas();
</script>
</body>
</html>
