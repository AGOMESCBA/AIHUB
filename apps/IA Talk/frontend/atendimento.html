<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Central de Atendimento · IA Talk</title>
  <!-- Etapa G13 (Antigravity) — Central de Atendimento (tela real da Fase 2).
       Baseada no layout híbrido aprovado no A0 (26/11/2026) e no contrato congelado
       docs/contratos.md §8 (rotas /conversas, /setores, /respostas-rapidas, /contatos
       e eventos Socket.IO atendimento:* e conversa:*). -->
  <script src="/app/ia-talk/js/talk-ui.js"></script>
  <link rel="stylesheet" href="/app/ia-talk/ui/css/iahub.css">
  <link rel="stylesheet" href="/app/ia-talk/css/talk.css">
  <link rel="stylesheet" href="/app/ia-talk/css/telas/g13.css">
  <!-- Acabamento visual da Central (camada sobre a g13; não muda estrutura, ids nem classes). -->
  <link rel="stylesheet" href="/app/ia-talk/css/telas/g13-visual.css">
</head>
<body class="atd-body">
<div class="atd-app">

  <div class="atd-estado-global" id="estado-global" hidden></div>

  <main class="atd-workspace" id="workspace" data-passo="lista">
    <!-- 1. Visões e setores com contadores -->
    <aside class="atd-col atd-col--setores" aria-label="Visões e setores">
      <div class="atd-status-topo">
        <span class="atd-rt-badge" id="rt-badge" aria-live="polite" title="Estado da atualização em tempo real">
          <span class="atd-rt-dot" aria-hidden="true"></span>
          <span id="rt-texto">Conectando…</span>
        </span>
        <button class="btn btn-ghost btn-sm" type="button" id="btn-atualizar" title="Atualizar: recarrega contadores, conversas e a conversa aberta" aria-label="Atualizar: recarrega contadores, conversas e a conversa aberta"><span data-ico="atualizar" data-giro="1"></span></button>
      </div>

      <div class="atd-usuario-ativo" id="usuario-ativo"></div>

      <div>
        <div class="atd-nav-grupo-tit">Visões</div>
        <ul class="atd-nav-lista" id="lista-visoes">
          <li><button class="atd-nav-btn" type="button" data-visao="minhas" title="Minhas: conversas abertas atribuídas a você" aria-label="Minhas: conversas abertas atribuídas a você"><span class="atd-nav-nome">Minhas</span><span class="atd-contador" id="cnt-minhas">0</span></button></li>
          <li><button class="atd-nav-btn" type="button" data-visao="fila" title="Fila: conversas abertas aguardando alguém assumir" aria-label="Fila: conversas abertas aguardando alguém assumir"><span class="atd-nav-nome">Fila</span><span class="atd-contador" id="cnt-fila">0</span></button></li>
          <li><button class="atd-nav-btn ativo" type="button" data-visao="abertas" title="Abertas: todas as conversas em andamento que você pode ver" aria-label="Abertas: todas as conversas em andamento que você pode ver"><span class="atd-nav-nome">Abertas</span><span class="atd-contador" id="cnt-abertas">0</span></button></li>
          <li><button class="atd-nav-btn" type="button" data-visao="encerradas" title="Encerradas: histórico de conversas finalizadas" aria-label="Encerradas: histórico de conversas finalizadas"><span class="atd-nav-nome">Encerradas</span></button></li>
        </ul>
      </div>

      <div>
        <div class="atd-nav-grupo-tit">Setores</div>
        <ul class="atd-nav-lista" id="lista-setores"></ul>
      </div>
    </aside>

    <!-- 2. Lista de conversas -->
    <section class="atd-col atd-col--lista" aria-label="Lista de conversas">
      <div class="atd-lista-topo">
        <div class="atd-lista-head">
          <button class="btn btn-ghost btn-sm atd-so-mobile" type="button" id="btn-mobile-setores" title="Voltar para visões e setores" aria-label="Voltar para visões e setores"><span data-ico="voltar"></span> Setores</button>
          <h1 class="atd-lista-titulo" id="titulo-lista-conv">Abertas</h1>
        </div>
        <label class="sr-only" for="campo-busca">Buscar conversa</label>
        <input class="form-control" id="campo-busca" type="search" placeholder="Nome, protocolo ou final do telefone…" autocomplete="off">
      </div>
      <div class="atd-conversas-scroll">
        <div id="estado-lista" hidden></div>
        <ul class="atd-conversas" id="lista-conversas"></ul>
        <div class="atd-mais-wrap" id="wrap-mais-conversas" hidden>
          <button class="btn btn-ghost btn-sm" type="button" id="btn-mais-conversas" title="Carregar mais conversas desta lista" aria-label="Carregar mais conversas desta lista"><span data-ico="seta_baixo"></span> Carregar mais</button>
        </div>
      </div>
    </section>

    <!-- 3. Conversa ativa -->
    <section class="atd-col atd-col--chat" aria-label="Conversa ativa">
      <div class="atd-chat-vazio" id="estado-chat-vazio"></div>

      <div class="atd-chat-ativo" id="chat-ativo" hidden>
        <header class="atd-chat-head">
          <div class="atd-chat-ident">
            <button class="btn btn-ghost btn-sm atd-so-mobile" type="button" id="btn-mobile-lista" title="Voltar para a lista de conversas" aria-label="Voltar para a lista de conversas"><span data-ico="voltar"></span> Conversas</button>
            <div class="atd-avatar" id="chat-avatar" aria-hidden="true">--</div>
            <div style="min-width:0;">
              <div class="atd-chat-nome" id="chat-nome"></div>
              <div class="atd-chat-sub" id="chat-sub"></div>
            </div>
          </div>

          <div class="atd-chat-acoes">
            <button class="btn btn-primary btn-sm" type="button" id="btn-assumir" hidden title="Assumir: atribui esta conversa da fila para você" aria-label="Assumir: atribui esta conversa da fila para você"><span data-ico="salvar"></span> Assumir</button>
            <button class="btn btn-ghost btn-sm" type="button" id="btn-devolver" hidden title="Devolver: devolve esta conversa para a fila do setor" aria-label="Devolver: devolve esta conversa para a fila do setor"><span data-ico="restaurar"></span> Devolver</button>
            <button class="btn btn-ghost btn-sm" type="button" id="btn-transferir" hidden aria-expanded="false" aria-controls="popover-transferir" title="Transferir: move a conversa para outro setor ou atendente" aria-label="Transferir: move a conversa para outro setor ou atendente"><span data-ico="avancar"></span> Transferir</button>
            <button class="btn btn-primary btn-sm" type="button" id="btn-encerrar" hidden aria-expanded="false" aria-controls="popover-encerrar" title="Encerrar: finaliza esta conversa com motivo opcional" aria-label="Encerrar: finaliza esta conversa com motivo opcional"><span data-ico="cancelar"></span> Encerrar</button>
            <button class="btn btn-primary btn-sm" type="button" id="btn-reabrir" hidden title="Reabrir: reabre esta conversa encerrada sob sua responsabilidade" aria-label="Reabrir: reabre esta conversa encerrada sob sua responsabilidade"><span data-ico="restaurar"></span> Reabrir</button>
            <button class="btn btn-ghost btn-sm atd-so-medio" type="button" id="btn-gaveta" aria-expanded="false" aria-controls="painel-lateral" title="Contato: abre ou recolhe o painel lateral de contato e etiquetas" aria-label="Contato: abre ou recolhe o painel lateral de contato e etiquetas"><span data-ico="painel_lateral"></span> Contato</button>
            <button class="btn btn-ghost btn-sm atd-so-mobile" type="button" id="btn-abrir-sheet" title="Contato: abre os dados do contato e etiquetas" aria-label="Contato: abre os dados do contato e etiquetas"><span data-ico="painel_lateral"></span> Contato</button>

            <!-- Popover Transferir -->
            <div class="atd-popover" id="popover-transferir" role="dialog" aria-label="Transferir conversa" hidden>
              <p class="atd-popover-tit">Transferir conversa</p>
              <div class="tlk-alerta tlk-alerta--erro" id="alerta-transferir" role="alert" hidden></div>
              <form id="form-transferir" novalidate style="display:flex;flex-direction:column;gap:8px;">
                <div class="tlk-campo">
                  <label for="tr-setor">Setor de destino</label>
                  <select class="form-control" id="tr-setor" name="setor_id"></select>
                </div>
                <div class="tlk-campo">
                  <label for="tr-responsavel">Atendente (opcional)</label>
                  <select class="form-control" id="tr-responsavel" name="responsavel_id"></select>
                </div>
                <div class="tlk-campo">
                  <label for="tr-nota">Nota interna (opcional)</label>
                  <textarea class="form-control" id="tr-nota" name="nota" rows="2" placeholder="Contexto para quem vai assumir…"></textarea>
                </div>
                <div class="atd-popover-acoes">
                  <button class="btn btn-ghost btn-sm" type="button" id="btn-cancelar-transferir" title="Cancelar transferência" aria-label="Cancelar transferência"><span data-ico="cancelar"></span> Cancelar</button>
                  <button class="btn btn-primary btn-sm" type="submit" id="btn-confirmar-transferir" title="Confirmar transferência da conversa" aria-label="Confirmar transferência da conversa"><span data-ico="avancar"></span> Transferir</button>
                </div>
              </form>
            </div>

            <!-- Popover Encerrar -->
            <div class="atd-popover" id="popover-encerrar" role="dialog" aria-label="Encerrar conversa" hidden>
              <p class="atd-popover-tit">Encerrar conversa</p>
              <div class="tlk-alerta tlk-alerta--erro" id="alerta-encerrar" role="alert" hidden></div>
              <form id="form-encerrar" novalidate style="display:flex;flex-direction:column;gap:8px;">
                <div class="tlk-campo">
                  <label for="enc-motivo">Motivo (opcional, até 200 caracteres)</label>
                  <input class="form-control" id="enc-motivo" name="motivo" type="text" maxlength="200" placeholder="Ex.: Dúvida resolvida">
                </div>
                <div class="atd-popover-acoes">
                  <button class="btn btn-ghost btn-sm" type="button" id="btn-cancelar-encerrar" title="Cancelar encerramento" aria-label="Cancelar encerramento"><span data-ico="cancelar"></span> Cancelar</button>
                  <button class="btn btn-primary btn-sm" type="submit" id="btn-confirmar-encerrar" title="Confirmar encerramento desta conversa" aria-label="Confirmar encerramento desta conversa"><span data-ico="salvar"></span> Confirmar</button>
                </div>
              </form>
            </div>
          </div>
        </header>

        <!-- Alerta de conflito (ex.: 409 ao assumir ou reabrir) -->
        <div class="atd-banner atd-banner--erro" id="alerta-conversa" role="alert" hidden>
          <span id="alerta-conversa-texto"></span>
          <div style="display:flex;gap:6px;align-items:center;">
            <button class="btn btn-ghost btn-sm" type="button" id="btn-abrir-conflito" hidden title="Abrir a conversa já aberta deste contato" aria-label="Abrir a conversa já aberta deste contato"><span data-ico="avancar"></span> Abrir conversa ativa</button>
            <button class="btn btn-ghost btn-sm" type="button" id="btn-fechar-alerta-conversa" title="Fechar aviso" aria-label="Fechar aviso"><span data-ico="cancelar"></span></button>
          </div>
        </div>

        <!-- Banner de motivo do bloqueio de envio (envio.pode_responder === false) -->
        <div class="atd-banner atd-banner--aviso" id="banner-envio" role="status" hidden>
          <span id="banner-envio-texto"></span>
        </div>

        <div class="atd-mensagens" id="lista-mensagens" aria-live="polite"></div>

        <footer class="atd-compositor" id="compositor">
          <div class="atd-slash-menu" id="slash-menu" role="listbox" aria-label="Respostas rápidas" hidden></div>

          <div class="tlk-alerta tlk-alerta--erro" id="alerta-compositor" role="alert" style="margin-bottom:8px;" hidden></div>

          <div class="atd-modo-barra">
            <div class="atd-modo-tabs" role="group" aria-label="Tipo de envio">
              <button class="atd-modo-btn ativo" type="button" id="btn-modo-cliente" aria-pressed="true" title="Mensagem ao cliente: envia pelo WhatsApp do canal" aria-label="Mensagem ao cliente: envia pelo WhatsApp do canal">Mensagem ao cliente</button>
              <button class="atd-modo-btn atd-modo-btn--nota" type="button" id="btn-modo-nota" aria-pressed="false" title="Nota interna: fica visível só para a equipe e nunca vai ao contato" aria-label="Nota interna: fica visível só para a equipe e nunca vai ao contato">Nota interna</button>
            </div>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <button class="btn btn-ghost btn-sm" type="button" id="btn-atalho-slash" title="Respostas rápidas: insere um atalho com / e troca nome do contato e do atendente" aria-label="Respostas rápidas: insere um atalho com / e troca nome do contato e do atendente"><span data-ico="mais"></span> Respostas rápidas (/)</button>
              <span class="atd-contador-chars" id="contador-compositor">0 / 4096</span>
            </div>
          </div>

          <form class="atd-input-linha" id="form-compositor" novalidate>
            <label class="sr-only" for="campo-msg">Mensagem ou nota interna</label>
            <textarea class="form-control atd-textarea" id="campo-msg" name="texto" rows="2" placeholder="Digite uma mensagem ou '/' para respostas rápidas…"></textarea>
            <button class="btn btn-primary" type="submit" id="btn-enviar" title="Enviar mensagem ao cliente pelo canal" aria-label="Enviar mensagem ao cliente pelo canal"><span data-ico="enviar"></span> Enviar</button>
          </form>

          <div class="atd-compositor-dica">
            <span id="dica-compositor">Enter envia · Shift+Enter quebra linha · Digite <code>/</code> para respostas rápidas</span>
            <span id="dica-variaveis">Troca automática: <code>{nome_contato}</code> e <code>{nome_atendente}</code></span>
          </div>
        </footer>
      </div>
    </section>

    <!-- 4. Contato, etiquetas e histórico -->
    <div class="atd-sheet-backdrop" id="sheet-backdrop"></div>
    <aside class="atd-col atd-col--lateral" id="painel-lateral" aria-label="Contato, etiquetas e histórico">
      <div class="atd-lateral-head">
        <strong>Contato e detalhes</strong>
        <button class="btn btn-ghost btn-sm atd-so-mobile-ou-medio" type="button" id="btn-fechar-lateral" title="Fechar painel do contato" aria-label="Fechar painel do contato"><span data-ico="cancelar"></span></button>
      </div>
      <div class="atd-lateral-corpo" id="painel-contato"></div>
    </aside>
  </main>

</div>

<script src="/app/ia-talk/socket.io/socket.io.js"></script>
<script src="/app/ia-talk/js/talk-api.js"></script>
<script src="/app/ia-talk/js/talk-icones.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const { esc, pill, dataHora, relativo } = TalkUI;

  const POLL_FALLBACK_MS = 5000;
  const LIMITE_NOTA = 2000;
  const ROTULO_VISAO = { minhas: 'Minhas', fila: 'Fila', abertas: 'Abertas', encerradas: 'Encerradas' };

  const qs = new URLSearchParams(location.search);
  const simularUrl = qs.get('simular') || '';
  const conversaInicialUrl = qs.get('conversa') || '';

  // Encaminha ?simular=... (ex.: ?simular=atendente) sem poluir sessionStorage de outras abas.
  const comSimular = (params = {}) => (simularUrl ? { ...params, simular: simularUrl } : params);
  const api = {
    get: (caminho, params) => TalkApi.get(caminho, comSimular(params)),
    post: (caminho, corpo) => TalkApi.post(caminho, corpo, simularUrl ? { params: { simular: simularUrl } } : {}),
    put: (caminho, corpo) => TalkApi.put(caminho, corpo, simularUrl ? { params: { simular: simularUrl } } : {}),
  };

  function modoAtendenteSimulado() {
    if (simularUrl.split(',').includes('atendente')) return true;
    try { return (sessionStorage.getItem('talk_simular') || '').split(',').includes('atendente'); } catch (_) { return false; }
  }

  let sessao = null;
  let usuarioEfetivo = { id: null, nome: '' };
  let setoresAtivos = [];
  let contadores = { minhas: 0, fila: 0, abertas: 0, por_setor: [] };

  let visaoAtual = 'abertas';
  let setorAtualId = '';
  let buscaAtual = '';
  let conversas = [];
  let proximoCursorConversas = null;

  let conversaAtual = null;
  let itensConversa = [];
  let proximoCursorItens = null;
  let historicoContato = [];
  let respostasRapidas = [];

  let modoCompositor = 'cliente'; // 'cliente' | 'nota'
  let slashIndice = 0;
  let slashLista = [];
  let conflitoConversaId = null;

  let socket = null;
  let conversaAssinadaId = null;
  let timerFallback = null;
  let timerBusca = null;

  // Cor do avatar pelo nome (a mesma pessoa tem sempre a mesma cor): matiz de 0 a 359.
  function matiz(nome) {
    let h = 0;
    for (const ch of String(nome || '?')) h = (h * 31 + ch.charCodeAt(0)) % 360;
    return h;
  }

  function iniciais(nome) {
    return String(nome || '?').trim().split(/\s+/).filter(Boolean).slice(0, 2).map((p) => p[0]).join('').toUpperCase() || '?';
  }

  function resolverUsuarioEfetivo() {
    if (modoAtendenteSimulado()) {
      const carla = setoresAtivos.flatMap((s) => s.membros || []).find((m) => m.id === 'usr_carla');
      usuarioEfetivo = carla ? { id: carla.id, nome: carla.nome } : { id: 'usr_carla', nome: 'Carla Souza' };
    } else if (sessao?.usuario) {
      usuarioEfetivo = { id: sessao.usuario.id, nome: sessao.usuario.nome };
    }
    const el = $('usuario-ativo');
    if (usuarioEfetivo.nome) {
      el.innerHTML = `Atendente: <strong>${esc(usuarioEfetivo.nome)}</strong>`;
    } else {
      el.textContent = '';
    }
  }

  function expandirVariaveis(texto) {
    const nomeContato = conversaAtual?.contato?.nome || '';
    const nomeAtendente = usuarioEfetivo.nome || sessao?.usuario?.nome || '';
    return String(texto || '')
      .replace(/\{nome_contato\}/g, nomeContato)
      .replace(/\{nome_atendente\}/g, nomeAtendente);
  }

  function definirPassoMobile(passo) {
    $('workspace').dataset.passo = passo;
  }

  function fecharPopovers() {
    $('popover-transferir').hidden = true;
    $('btn-transferir').setAttribute('aria-expanded', 'false');
    $('popover-encerrar').hidden = true;
    $('btn-encerrar').setAttribute('aria-expanded', 'false');
  }

  function mostrarAlertaConversa(mensagem, { conversaId = null } = {}) {
    conflitoConversaId = conversaId;
    $('alerta-conversa-texto').textContent = mensagem;
    $('btn-abrir-conflito').hidden = !conversaId;
    $('alerta-conversa').hidden = false;
  }

  function limparAlertaConversa() {
    conflitoConversaId = null;
    $('alerta-conversa').hidden = true;
    $('alerta-conversa-texto').textContent = '';
    $('btn-abrir-conflito').hidden = true;
  }

  // ── Contadores e navegação esquerda ─────────────────────────────────
  function renderizarContadores() {
    $('cnt-minhas').textContent = String(contadores.minhas ?? 0);
    $('cnt-fila').textContent = String(contadores.fila ?? 0);
    $('cnt-abertas').textContent = String(contadores.abertas ?? 0);

    document.querySelectorAll('#lista-visoes [data-visao]').forEach((btn) => {
      btn.classList.toggle('ativo', btn.dataset.visao === visaoAtual);
    });

    const ul = $('lista-setores');
    const porSetor = Array.isArray(contadores.por_setor) ? contadores.por_setor : [];
    const totalTodos = visaoAtual === 'fila' ? (contadores.fila ?? 0) : (contadores.abertas ?? 0);

    const itensHtml = [
      `<li><button class="atd-nav-btn ${setorAtualId === '' ? 'ativo' : ''}" type="button" data-setor="" title="Todos os setores visíveis" aria-label="Todos os setores visíveis">
        <span class="atd-nav-nome">Todos os setores</span>
        <span class="atd-contador">${esc(totalTodos)}</span>
      </button></li>`,
      ...porSetor.map((s) => {
        const valor = visaoAtual === 'fila' ? (s.na_fila ?? 0) : (s.abertas ?? 0);
        const dica = `${s.nome}: ${s.abertas ?? 0} aberta(s), ${s.na_fila ?? 0} na fila`;
        return `<li><button class="atd-nav-btn ${setorAtualId === s.id ? 'ativo' : ''}" type="button" data-setor="${esc(s.id)}" title="${esc(dica)}" aria-label="${esc(dica)}">
          <span class="atd-nav-nome">${esc(s.nome)}</span>
          <span class="atd-contador">${esc(valor)}</span>
        </button></li>`;
      }),
    ];
    ul.innerHTML = itensHtml.join('');

    const setorObj = porSetor.find((s) => s.id === setorAtualId);
    const rotuloVisao = ROTULO_VISAO[visaoAtual] || 'Conversas';
    $('titulo-lista-conv').textContent = setorObj ? `${rotuloVisao} · ${setorObj.nome}` : rotuloVisao;
  }

  async function carregarContadores() {
    contadores = await api.get('/conversas/contadores');
    renderizarContadores();
  }

  async function carregarSetores() {
    try {
      const pag = await api.get('/setores', { situacao: 'ativo', limite: 100 });
      setoresAtivos = Array.isArray(pag?.itens) ? pag.itens : [];
    } catch (_) {
      setoresAtivos = [];
    }
    resolverUsuarioEfetivo();
  }

  // ── Lista de conversas ──────────────────────────────────────────────
  function conversaPertenceAFiltroAtual(cv) {
    if (setorAtualId && cv.setor?.id !== setorAtualId) return false;
    if (visaoAtual === 'minhas') return cv.situacao === 'aberta' && cv.responsavel?.id === usuarioEfetivo.id;
    if (visaoAtual === 'fila') return cv.situacao === 'aberta' && !!cv.na_fila;
    if (visaoAtual === 'abertas') return cv.situacao === 'aberta';
    if (visaoAtual === 'encerradas') return cv.situacao === 'encerrada';
    return true;
  }

  function ordenarConversas() {
    if (visaoAtual === 'fila') {
      conversas.sort((a, b) => {
        if (a.prioridade !== b.prioridade) return a.prioridade === 'alta' ? -1 : 1;
        return String(a.aguardando_desde || a.aberta_em || '').localeCompare(String(b.aguardando_desde || b.aberta_em || ''));
      });
    } else {
      conversas.sort((a, b) => String(b.atualizada_em || '').localeCompare(String(a.atualizada_em || '')));
    }
  }

  function renderizarListaConversas() {
    const ul = $('lista-conversas');
    const boxEstado = $('estado-lista');
    $('wrap-mais-conversas').hidden = !proximoCursorConversas;

    if (!conversas.length) {
      ul.innerHTML = '';
      TalkUI.estado(boxEstado, 'vazio', {
        titulo: 'Nenhuma conversa aqui',
        texto: buscaAtual
          ? 'Nenhuma conversa corresponde à busca atual.'
          : 'Não há conversas nesta visão ou setor no momento.',
      });
      return;
    }

    boxEstado.hidden = true;
    ul.innerHTML = conversas.map((c) => {
      const ativa = conversaAtual?.id === c.id;
      const previa = c.ultima_mensagem?.previa || 'Sem mensagens registradas';

      const espera = visaoAtual === 'fila' && c.aguardando_desde ? `Esperando ${relativo(c.aguardando_desde)}` : '';

      const dica = `${c.contato?.nome || 'Contato'} · Protocolo ${c.protocolo} · ${c.setor?.nome || ''} · ${dono}`;

          <span class="atd-conv-avatar" style="--av-h:${matiz(c.contato?.nome)}" aria-hidden="true">${esc(iniciais(c.contato?.nome))}</span>

          <div class="atd-conv-linha1">
            <span class="atd-conv-nome">${esc(c.contato?.nome || 'Contato')}</span>
            <span class="atd-conv-hora">${esc(hora)}</span>
          </div>
          <div class="atd-conv-previa">${esc(previa)}</div>
          <div class="atd-conv-rodape">
            <div class="atd-conv-tags">

              <span class="atd-tag-mini ${c.na_fila ? 'atd-tag-mini--fila' : ''}">${esc(dono)}</span>
              ${c.prioridade === 'alta' ? '<span class="atd-tag-mini atd-tag-mini--alta">Alta</span>' : ''}
              ${espera ? `<span class="atd-tag-mini">${esc(espera)}</span>` : ''}
              ${etiquetas}
            </div>
            ${c.nao_lidas > 0 ? `<span class="atd-nao-lidas" aria-label="${esc(c.nao_lidas)} não lida(s)">${esc(c.nao_lidas)}</span>` : ''}
          </div>
          </span>

  async function carregarConversas({ continuar = false, silencioso = false } = {}) {
    const boxEstado = $('estado-lista');
    if (!continuar && !silencioso) {
      $('lista-conversas').innerHTML = '';
      $('wrap-mais-conversas').hidden = true;
      TalkUI.estado(boxEstado, 'carregando', { titulo: 'Carregando conversas…' });
    }
    try {
      const pag = await api.get('/conversas', {
        visao: visaoAtual,
        setor_id: setorAtualId || undefined,
        busca: buscaAtual || undefined,
        limite: 50,
        cursor: continuar ? proximoCursorConversas : undefined,
      });
      const itens = Array.isArray(pag?.itens) ? pag.itens : [];
      proximoCursorConversas = pag?.proximo_cursor || null;
      conversas = continuar ? [...conversas, ...itens] : itens;
      renderizarListaConversas();
    } catch (err) {
      if (silencioso) return;
      if (err?.status === 403) {
        mostrarErroGlobal(err);
      } else {
        TalkUI.estadoDoErro(boxEstado, err, () => carregarConversas({ continuar }));
      }
    }
  }

  // ── Conversa ativa, itens e compositor ──────────────────────────────
  function renderizarCabecalhoConversa() {
    const cv = conversaAtual;
    if (!cv) {
      $('chat-ativo').hidden = true;
      $('estado-chat-vazio').hidden = false;
      TalkUI.estado($('estado-chat-vazio'), 'vazio', {
        titulo: 'Selecione uma conversa',
        texto: 'Escolha uma conversa na lista ao lado para ler mensagens, registrar notas internas e responder.',
      });
      return;
    }

    $('estado-chat-vazio').hidden = true;
    $('chat-ativo').hidden = false;
    $('chat-avatar').textContent = iniciais(cv.contato?.nome);
    $('chat-avatar').style.setProperty('--av-h', matiz(cv.contato?.nome));
    $('chat-nome').innerHTML = `
      <span>${esc(cv.contato?.nome || 'Contato')}</span>
      ${cv.situacao === 'encerrada' ? '<span class="tlk-pill tlk-pill--neutro">Encerrada</span>' : ''}
      ${cv.prioridade === 'alta' ? '<span class="tlk-pill tlk-pill--erro">Prioridade alta</span>' : ''}`;

    const respTxt = cv.responsavel ? `Com ${cv.responsavel.nome}` : 'Na fila';
    $('chat-sub').textContent = `${cv.protocolo} · ${cv.setor?.nome || '—'} · ${respTxt} · ${cv.canal?.nome || '—'}`;

    const aberta = cv.situacao === 'aberta';
    $('btn-assumir').hidden = !(aberta && cv.na_fila);
    $('btn-devolver').hidden = !(aberta && !!cv.responsavel);
    $('btn-transferir').hidden = !aberta;
    $('btn-encerrar').hidden = !aberta;
    $('btn-reabrir').hidden = aberta;

    atualizarEstadoCompositor();
  }

  function atualizarContadorCompositor() {
    const limite = modoCompositor === 'nota' ? LIMITE_NOTA : (conversaAtual?.envio?.limite_caracteres || 4096);
    const len = $('campo-msg').value.length;
    const el = $('contador-compositor');
    el.textContent = `${len} / ${limite}`;
    el.classList.toggle('atd-contador-chars--excedido', len > limite);
  }

  function atualizarEstadoCompositor() {
    const cv = conversaAtual;
    if (!cv) return;

    const podeResponder = !!cv.envio?.pode_responder;
    const motivo = cv.envio?.motivo || '';

    const banner = $('banner-envio');
    if (!podeResponder && motivo) {
      $('banner-envio-texto').textContent = motivo;
      banner.hidden = false;
    } else {
      banner.hidden = true;
    }

    const ehNota = modoCompositor === 'nota';
    $('compositor').classList.toggle('modo-nota', ehNota);
    $('btn-modo-cliente').classList.toggle('ativo', !ehNota);
    $('btn-modo-cliente').setAttribute('aria-pressed', String(!ehNota));
    $('btn-modo-nota').classList.toggle('ativo', ehNota);
    $('btn-modo-nota').setAttribute('aria-pressed', String(ehNota));

    const bloqueado = !ehNota && !podeResponder;
    $('campo-msg').disabled = bloqueado;
    $('btn-enviar').disabled = bloqueado;
    $('btn-atalho-slash').disabled = bloqueado;

    if (ehNota) {
      $('campo-msg').placeholder = 'Escreva uma nota interna (visível só para a equipe)…';
      TalkIcones.definirBotao($('btn-enviar'), {
        icone: 'salvar',
        texto: 'Salvar nota',
        title: 'Salvar nota interna: fica registrada só para a equipe',
        ariaLabel: 'Salvar nota interna: fica registrada só para a equipe',
      });
    } else if (bloqueado) {
      $('campo-msg').placeholder = motivo || 'Envio indisponível nesta conversa.';
      TalkIcones.definirBotao($('btn-enviar'), {
        icone: 'enviar',
        texto: 'Enviar',
        title: motivo || 'Envio indisponível nesta conversa',
        ariaLabel: motivo || 'Envio indisponível nesta conversa',
      });
    } else {
      $('campo-msg').placeholder = "Digite uma mensagem ou '/' para respostas rápidas…";
      TalkIcones.definirBotao($('btn-enviar'), {
        icone: 'enviar',
        texto: 'Enviar',
        title: 'Enviar mensagem ao cliente pelo WhatsApp do canal',
        ariaLabel: 'Enviar mensagem ao cliente pelo WhatsApp do canal',
      });
    }
    atualizarContadorCompositor();
  }

    if (it.categoria === 'evento') {
      return `<div class="atd-evento" data-item-id="${esc(it.id)}">${esc(it.texto)} · ${esc(dataHora(it.em))}</div>`;

    if (it.categoria === 'nota') {
      return `<article class="atd-msg atd-msg--nota" data-item-id="${esc(it.id)}">
        <div class="atd-msg-head">
          <span class="atd-nota-selo">Nota interna · só equipe</span>
          <span>${esc(it.autor?.nome || 'Equipe')}</span>
        </div>
        <div class="atd-msg-texto">${esc(it.texto)}</div>
        <div class="atd-msg-meta"><span>${esc(dataHora(it.em))}</span></div>
      </article>`;
    }

      </div>

  }

  function renderizarItensConversa({ rolarFim = true } = {}) {
    const box = $('lista-mensagens');
    const prevTop = box.scrollTop;
    const estavaNoFim = box.scrollHeight - box.scrollTop - box.clientHeight <= 40;
    const btnMais = proximoCursorItens
      ? `<div style="text-align:center;"><button class="btn btn-ghost btn-sm" type="button" id="btn-mais-itens" title="Carregar mensagens mais antigas desta conversa" aria-label="Carregar mensagens mais antigas desta conversa">${TalkIcones.svg('atualizar')} Carregar anteriores</button></div>`
      : '';
    box.innerHTML = btnMais + itensConversa.map(renderizarItemHtml).join('');
    if (rolarFim || estavaNoFim) box.scrollTop = box.scrollHeight;
    else box.scrollTop = prevTop;
  }

  async function carregarMaisItens() {
    if (!conversaAtual || !proximoCursorItens) return;
    const seq = conversaSeq;
    const idSolicitado = conversaAtual.id;
    try {
      const pag = await api.get(`/conversas/${encodeURIComponent(idSolicitado)}/itens`, { limite: 100, cursor: proximoCursorItens });
      if (seq !== conversaSeq || conversaAtual?.id !== idSolicitado) return;
      proximoCursorItens = pag?.proximo_cursor || null;
      const antigos = [...(pag?.itens || [])].reverse();
      const existentes = new Set(itensConversa.map((i) => i.id));
      itensConversa = [...antigos.filter((i) => !existentes.has(i.id)), ...itensConversa];
      renderizarItensConversa({ rolarFim: false });
    } catch (err) {
      TalkUI.toast(err.message, 'erro');
    }
  }

  // ── Respostas rápidas com "/" ───────────────────────────────────────
  async function carregarRespostasRapidas(setorId) {
    try {
      const pag = await api.get('/respostas-rapidas', { situacao: 'ativa', setor_id: setorId || undefined, limite: 100 });
      respostasRapidas = Array.isArray(pag?.itens) ? pag.itens : [];
    } catch (_) {
      respostasRapidas = [];
    }
  }

  function fecharSlashMenu() {
    $('slash-menu').hidden = true;
    slashLista = [];
    slashIndice = 0;
  }

  function renderizarSlashMenu(filtro = '') {
    const termo = filtro.toLowerCase();
    slashLista = respostasRapidas.filter((r) => {
      if (!termo) return true;
      return `${r.atalho} ${r.titulo} ${r.texto}`.toLowerCase().includes(termo);
    });
    const menu = $('slash-menu');
    if (!slashLista.length) {
      menu.innerHTML = '<div style="padding:8px 10px;font-size:12px;color:var(--text-lo);">Nenhuma resposta rápida encontrada.</div>';
      menu.hidden = false;
      return;
    }
    if (slashIndice >= slashLista.length) slashIndice = 0;
    menu.innerHTML = slashLista.map((r, i) => `
      <button type="button" role="option" aria-selected="${i === slashIndice ? 'true' : 'false'}" class="atd-slash-item ${i === slashIndice ? 'selecionado' : ''}" data-slash-idx="${i}">
        <div class="atd-slash-head">
          <strong>${esc(r.atalho)}</strong>
          <span style="font-size:11px;color:var(--text-lo);">${esc(r.titulo)}${r.setor ? ` · ${esc(r.setor.nome)}` : ''}</span>
        </div>
        <span>${esc(expandirVariaveis(r.texto))}</span>
      </button>`).join('');
    menu.hidden = false;
  }

  function aplicarSlash(idx) {
    const r = slashLista[idx];
    if (!r) return;
    $('campo-msg').value = expandirVariaveis(r.texto);
    fecharSlashMenu();
    atualizarContadorCompositor();
    $('campo-msg').focus();
  }

  // ── Abrir conversa ──────────────────────────────────────────────────
  // conversaSeq invalida respostas atrasadas quando o usuário troca ou encerra a conversa;
  // encerrandoConversaId impede que avisos do socket emitidos durante POST /encerrar reabram o chat.
  let conversaSeq = 0;
  let encerrandoConversaId = null;

  function assinarConversaSocket(id) {
    if (socket?.connected && conversaAssinadaId && conversaAssinadaId !== id) {
      try { socket.emit('conversa:sair', { conversa_id: conversaAssinadaId }); } catch (_) {}
    }
    conversaAssinadaId = id;
    if (socket?.connected && id) {
      socket.emit('conversa:assinar', { conversa_id: id });
    }
  }

  async function abrirConversa(id, { irParaChatMobile = true } = {}) {
    const seq = ++conversaSeq;
    fecharPopovers();
    fecharSlashMenu();
    limparAlertaConversa();
    $('alerta-compositor').hidden = true;

    try {
      const [detalhe, pagItens] = await Promise.all([
        api.get(`/conversas/${encodeURIComponent(id)}`),
        api.get(`/conversas/${encodeURIComponent(id)}/itens`, { limite: 100 }),
      ]);
      if (seq !== conversaSeq) return;
      conversaAtual = detalhe;
      itensConversa = [...(pagItens?.itens || [])].reverse();
      proximoCursorItens = pagItens?.proximo_cursor || null;
      historicoContato = null; // exibe "Carregando histórico…" até a lista complementar chegar
      modoCompositor = 'cliente';

      assinarConversaSocket(detalhe.id);
      renderizarListaConversas();
      renderizarCabecalhoConversa();
      renderizarItensConversa({ rolarFim: true });
      renderizarPainelContato();
      if (irParaChatMobile) definirPassoMobile('chat');

      // Carrega respostas rápidas do setor + histórico do contato + marca como lida em paralelo
      const tarefas = [
        carregarRespostasRapidas(detalhe.setor?.id),
        api.get('/conversas', { contato_id: detalhe.contato?.id, visao: 'todas', limite: 20 })
          .then((p) => { if (seq === conversaSeq && conversaAtual?.id === detalhe.id) historicoContato = p?.itens || []; })
          .catch(() => { if (seq === conversaSeq && conversaAtual?.id === detalhe.id) historicoContato = []; }),
      ];
      if (detalhe.nao_lidas > 0) {
        tarefas.push(
          api.post(`/conversas/${encodeURIComponent(detalhe.id)}/marcar-lida`, {})
            .then((atualizada) => {
              sincronizarConversaNaLista(atualizada);
              if (seq === conversaSeq && conversaAtual?.id === detalhe.id && encerrandoConversaId !== detalhe.id) {
                conversaAtual = atualizada;
              }
            })
            .catch(() => {})
        );
      }
      await Promise.all(tarefas);
      if (seq !== conversaSeq || conversaAtual?.id !== detalhe.id) return;
      renderizarPainelContato();
    } catch (err) {
      if (seq === conversaSeq) TalkUI.toast(err.message, 'erro');

  function sincronizarConversaNaLista(resumo) {
    if (!resumo?.id) return;
    const idx = conversas.findIndex((c) => c.id === resumo.id);
    const entra = conversaPertenceAFiltroAtual(resumo);
    if (entra) {
      if (idx >= 0) conversas[idx] = { ...conversas[idx], ...resumo };
      else conversas.unshift(resumo);
      ordenarConversas();
    } else if (idx >= 0) {
      conversas.splice(idx, 1);
    }
    renderizarListaConversas();
  }

  async function recarregarConversaAtual({ rolarFim = false } = {}) {
    if (!conversaAtual || conversaAtual.id === encerrandoConversaId) return;
    const seq = conversaSeq;
    const idSolicitado = conversaAtual.id;
    try {
      const [detalhe, pagItens] = await Promise.all([
        api.get(`/conversas/${encodeURIComponent(idSolicitado)}`),
        api.get(`/conversas/${encodeURIComponent(idSolicitado)}/itens`, { limite: 100 }),
      ]);
      if (seq !== conversaSeq || conversaAtual?.id !== idSolicitado || idSolicitado === encerrandoConversaId) return;
      conversaAtual = detalhe;
      itensConversa = [...(pagItens?.itens || [])].reverse();
      proximoCursorItens = pagItens?.proximo_cursor || null;
      renderizarCabecalhoConversa();
      renderizarItensConversa({ rolarFim });
      renderizarPainelContato();
    } catch (err) {
      if (err?.status === 404 && seq === conversaSeq && conversaAtual?.id === idSolicitado) {
        conversaSeq += 1;
        conversaAtual = null;
        itensConversa = [];
        assinarConversaSocket(null);
        renderizarCabecalhoConversa();

  // ── Tempo real (Socket.IO + fallback 5 s) ───────────────────────────
  function atualizarBadgeTempoReal(modo) {
    const badge = $('rt-badge');
    badge.classList.remove('atd-rt-badge--ok', 'atd-rt-badge--fallback');
    if (modo === 'socket') {
      badge.classList.add('atd-rt-badge--ok');
      $('rt-texto').textContent = 'Tempo real ativo';
    } else {
      badge.classList.add('atd-rt-badge--fallback');
      $('rt-texto').textContent = 'Sem socket · 5 s';
    }
  }

  function pararFallback() {
    if (timerFallback) clearInterval(timerFallback);
    timerFallback = null;
  }

  function iniciarFallback() {
    atualizarBadgeTempoReal('fallback');
    if (timerFallback) return;
    timerFallback = setInterval(async () => {
      try {
        await Promise.all([carregarContadores(), carregarConversas({ silencioso: true }), recarregarConversaAtual()]);
      } catch (_) {}
    }, POLL_FALLBACK_MS);
  }

  function iniciarTempoReal() {
    if (socket || typeof window.io !== 'function') { iniciarFallback(); return; }
    try {
      socket = TalkApi.socket();
    } catch (_) {
      iniciarFallback();
      return;
    }

    socket.on('connect', () => {
      pararFallback();
      atualizarBadgeTempoReal('socket');
      socket.emit('atendimento:assinar', {});
      if (conversaAssinadaId) socket.emit('conversa:assinar', { conversa_id: conversaAssinadaId });
    });

    socket.on('disconnect', () => iniciarFallback());
    socket.on('connect_error', () => iniciarFallback());

    socket.on('atendimento:contadores', (c) => {
      // Em ?simular=atendente o simulado emite contadores globais no socket; recarrega com ?simular=atendente.
      if (modoAtendenteSimulado()) {
        carregarContadores().catch(() => {});
        return;
      }
      if (c && typeof c === 'object') {
        contadores = c;
        renderizarContadores();
      }
    });

    socket.on('conversa:atualizada', (resumo) => {
      if (!resumo?.id) return;
      if (modoAtendenteSimulado()) {
        carregarConversas({ silencioso: true }).catch(() => {});
      } else {
        sincronizarConversaNaLista(resumo);
      }
      // Só recarrega o chat se for a conversa aberta agora e ela não estiver em encerramento.
      if (!conversaAtual || conversaAtual.id !== resumo.id || resumo.id === encerrandoConversaId) return;
      recarregarConversaAtual({ rolarFim: false });
    });

    socket.on('conversa:saiu', ({ id } = {}) => {
      if (!id) return;
      conversas = conversas.filter((c) => c.id !== id);
      renderizarListaConversas();
      if (conversaAtual?.id === id) {
        conversaSeq += 1;
        conversaAtual = null;
        itensConversa = [];
        assinarConversaSocket(null);
        renderizarCabecalhoConversa();
        renderizarPainelContato();
        TalkUI.toast('Esta conversa não está mais visível para você.', 'info');
      }
    });

    socket.on('conversa:item', ({ conversa_id, item } = {}) => {
      if (!conversaAtual || conversa_id !== conversaAtual.id || conversa_id === encerrandoConversaId || !item?.id) return;
      if (!itensConversa.some((i) => i.id === item.id)) {
        itensConversa.push(item);
        renderizarItensConversa({ rolarFim: true });
      }
    });

    socket.on('conversa:item_estado', ({ conversa_id, item_id, estado } = {}) => {
      if (!conversaAtual || conversa_id !== conversaAtual.id || conversa_id === encerrandoConversaId || !item_id) return;
      const alvo = itensConversa.find((i) => i.id === item_id);
      if (alvo) alvo.estado = estado;
      const badge = document.querySelector(`[data-item-estado="${CSS.escape(item_id)}"]`);
      if (badge) badge.innerHTML = pill(estado);
    });
  }

  function mostrarErroGlobal(err) {
    $('workspace').hidden = true;
    TalkUI.estadoDoErro($('estado-global'), err, () => iniciar());
  }

  window.addEventListener('beforeunload', () => {
    pararFallback();
    if (socket) {
      if (conversaAssinadaId) {
        try { socket.emit('conversa:sair', { conversa_id: conversaAssinadaId }); } catch (_) {}
      }
      try { socket.disconnect(); } catch (_) {}
      socket = null;
    }
  });

  // ── Inicialização ───────────────────────────────────────────────────
  async function iniciar() {
    $('estado-global').hidden = true;
    $('workspace').hidden = false;
    renderizarCabecalhoConversa();
    renderizarPainelContato();

    try {
      sessao = await api.get('/sessao');
      await Promise.all([carregarSetores(), carregarContadores()]);
      resolverUsuarioEfetivo();
      await carregarConversas();
      iniciarTempoReal();

      if (conversaInicialUrl) {
        await abrirConversa(conversaInicialUrl);
      } else if (conversas.length && window.matchMedia('(min-width: 761px)').matches) {
        await abrirConversa(conversas[0].id, { irParaChatMobile: false });
      }
    } catch (err) {
      mostrarErroGlobal(err);
    }
  }

  iniciar();
})();
</script>
</body>
</html>
