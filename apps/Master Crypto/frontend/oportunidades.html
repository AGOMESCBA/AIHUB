<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Oportunidades Ativas - Crypto Radar AI</title>
  <link rel="stylesheet" href="/css/iahub.css">
  <link rel="stylesheet" href="./css/master-crypto.css">
  <style>
    body { background: #f8fafc; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .empty-state { height: 260px; display:flex; align-items:center; justify-content:center; color:var(--text-lo); font-weight:800; }
    .status-line { font-size:12px; color:var(--text-lo); margin-bottom:12px; }
  </style>
</head>
<body>
<div class="page-kicker">OPERACAO / OPORTUNIDADES ATIVAS</div>
<div class="head-row">
  <div>
    <div class="head-title">Oportunidades Validadas pelo Algoritmo</div>
    <div class="status-line" id="statusLine">Carregando scanner...</div>
  </div>
  <div class="head-actions">
    <button class="btn btn-secondary" type="button" onclick="loadOpportunities()">Atualizar</button>
  </div>
</div>

<div class="table-card">
  <div class="table-wrap" style="min-height:340px">
    <table class="history-table">
      <thead>
        <tr>
          <th>Ativo</th>
          <th>Score</th>
          <th>Estrategia</th>
          <th>Entrada</th>
          <th>Stop Loss</th>
          <th>Alvo T2</th>
          <th>R/R</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="opportunitiesBody"></tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none">Nenhuma oportunidade ativa retornada pelo scanner</div>
  </div>
</div>

<script src="/js/auth.js"></script>
<script>
  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
  }

  function normalizeOpportunity(raw) {
    const score = raw.opportunity || {};
    const plan = raw.trade_plan || score.trade_plan || {};
    const totalScore = Number(raw.opportunity_score ?? score.total_score ?? raw.score ?? 0);
    const entryMin = Number(plan.entry_zone_min ?? raw.entry_min ?? 0);
    const entryMax = Number(plan.entry_zone_max ?? raw.entry_max ?? 0);
    const stop = Number(plan.stop_loss ?? raw.stop_loss ?? 0);
    const target2 = Number(plan.target_t2 ?? raw.target_2 ?? 0);
    return {
      symbol: raw.symbol || score.symbol || plan.symbol || '-',
      score: totalScore,
      strategy: raw.strategy || plan.strategy || '-',
      entryLabel: entryMin && entryMax ? `${entryMin.toFixed(2)} - ${entryMax.toFixed(2)}` : '-',
      stopLabel: stop ? stop.toFixed(2) : '-',
      targetLabel: target2 ? target2.toFixed(2) : '-',
      rr: Number(plan.risk_reward_ratio ?? raw.risk_reward_ratio ?? 0),
    };
  }

  async function loadSettings() {
    try {
      return await fetch('/api/master-crypto/company/settings').then(r => r.json());
    } catch (_) {
      return { scanner_top_limit: 20, scanner_timeframe: '4h' };
    }
  }

  async function loadOpportunities() {
    await (window._iahubAuthReady || Promise.resolve());
    const status = document.getElementById('statusLine');
    status.textContent = 'Atualizando oportunidades globais com parametros desta empresa...';
    try {
      const settings = await loadSettings();
      const topLimit = Number(settings.scanner_top_limit || 20);
      const timeframe = encodeURIComponent(settings.scanner_timeframe || '4h');
      const data = await fetch(`/api/master-crypto/opportunities/active?top_limit=${topLimit}&timeframe=${timeframe}`).then(r => r.json());
      renderOpportunities(Array.isArray(data.opportunities) ? data.opportunities.map(normalizeOpportunity) : []);
      status.textContent = `Scanner carregado para Top ${topLimit} - ${String(settings.scanner_timeframe || '4h').toUpperCase()}.`;
    } catch (err) {
      renderOpportunities([]);
      status.textContent = 'Nao foi possivel carregar o scanner.';
    }
  }

  function renderOpportunities(rows) {
    const tbody = document.getElementById('opportunitiesBody');
    const empty = document.getElementById('emptyState');
    tbody.innerHTML = '';
    empty.style.display = rows.length ? 'none' : 'flex';
    rows.forEach(op => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${esc(op.symbol)}</strong></td>
        <td><span class="badge ${op.score >= 80 ? 'badge-ok' : 'badge-warn'}">${op.score.toFixed(0)} / 100</span></td>
        <td><span class="badge badge-blue">${esc(op.strategy)}</span></td>
        <td>${esc(op.entryLabel)}</td>
        <td><span class="text-negative">${esc(op.stopLabel)}</span></td>
        <td><span class="text-positive">${esc(op.targetLabel)}</span></td>
        <td>${op.rr ? `1:${op.rr}` : '-'}</td>
        <td><span class="badge badge-ok">VALIDADA</span></td>
      `;
      tbody.appendChild(tr);
    });
  }

  window.addEventListener('DOMContentLoaded', loadOpportunities);
</script>
</body>
</html>
