<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Paper Trading - Master Crypto AI</title>
  <link rel="stylesheet" href="/css/iahub.css">
  <link rel="stylesheet" href="./css/master-crypto.css">
  <style>
    body { background: #f8fafc; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .head-title { margin-bottom: 12px; }
    .empty-state { height: 220px; display: flex; align-items: center; justify-content: center; color: var(--text-lo); font-weight: 800; }
    .status-line { font-size: 12px; color: var(--text-lo); margin-bottom: 12px; }
  </style>
</head>
<body>
<div class="page-kicker">SIMULACAO / PAPER TRADING</div>
<div class="head-row">
  <div>
    <div class="head-title">Gestao de Banca Virtual & Ordens Simuladas</div>
    <div class="status-line" id="statusLine">Carregando dados da empresa...</div>
  </div>
  <div class="head-actions">
    <button class="btn btn-secondary" type="button" onclick="loadPaperTrading()">Atualizar</button>
  </div>
</div>

<div class="meta-grid">
  <div class="meta-item"><span>Banca Virtual Atual</span><strong class="text-positive" id="balanceValue">-</strong></div>
  <div class="meta-item"><span>Win Rate Simulado</span><strong class="text-positive" id="winRateValue">-</strong></div>
  <div class="meta-item"><span>Profit Factor</span><strong id="profitFactorValue">-</strong></div>
  <div class="meta-item"><span>Lucro Total Acumulado</span><strong id="netPnlValue">-</strong></div>
</div>

<div class="table-card">
  <div class="table-wrap" style="min-height:320px">
    <table class="history-table">
      <thead>
        <tr>
          <th>Ativo</th>
          <th>Estrategia</th>
          <th>Entrada</th>
          <th>Stop Loss</th>
          <th>Alvo T2</th>
          <th>Quantidade</th>
          <th>R/R</th>
          <th>Acao</th>
        </tr>
      </thead>
      <tbody id="activeTradesBody"></tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none">Nenhuma ordem simulada aberta nesta empresa</div>
  </div>
</div>

<script src="/js/auth.js"></script>
<script>
  const fmtUsd = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'USD' });
  const fmtPct = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 2 });

  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
  }

  function setMetric(id, value, positive = null) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = value;
    if (positive !== null) {
      el.classList.toggle('text-positive', positive);
      el.classList.toggle('text-negative', !positive);
    }
  }

  async function loadPaperTrading() {
    await (window._iahubAuthReady || Promise.resolve());
    const status = document.getElementById('statusLine');
    status.textContent = 'Atualizando dados da empresa...';
    try {
      const [metrics, active] = await Promise.all([
        fetch('/api/master-crypto/paper/metrics').then(r => r.json()),
        fetch('/api/master-crypto/paper/active').then(r => r.json()),
      ]);

      const net = Number(metrics.net_pnl_usd || 0);
      setMetric('balanceValue', fmtUsd.format(Number(metrics.current_balance_usd || 0)), true);
      setMetric('winRateValue', `${fmtPct.format(Number(metrics.win_rate_pct || 0))}%`, true);
      setMetric('profitFactorValue', String(metrics.profit_factor ?? '0'));
      setMetric('netPnlValue', `${net >= 0 ? '+' : ''}${fmtUsd.format(net)}`, net >= 0);

      renderTrades(Array.isArray(active.trades) ? active.trades : []);
      status.textContent = `Dados carregados para ${window._iahubEmpresa?.nome || 'empresa selecionada'}.`;
    } catch (err) {
      status.textContent = 'Nao foi possivel carregar o Paper Trading desta empresa.';
      renderTrades([]);
    }
  }

  function renderTrades(trades) {
    const tbody = document.getElementById('activeTradesBody');
    const empty = document.getElementById('emptyState');
    tbody.innerHTML = '';
    empty.style.display = trades.length ? 'none' : 'flex';
    trades.forEach(trade => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${esc(trade.symbol)}</strong></td>
        <td>${esc(trade.strategy)}</td>
        <td>${fmtUsd.format(Number(trade.simulated_fill_price || trade.entry_price || 0))}</td>
        <td><span class="text-negative">${fmtUsd.format(Number(trade.stop_loss || 0))}</span></td>
        <td><span class="text-positive">${fmtUsd.format(Number(trade.target_t2 || 0))}</span></td>
        <td>${Number(trade.quantity || 0).toFixed(6)}</td>
        <td>1:${esc(trade.risk_reward_ratio || '-')}</td>
        <td><button class="btn btn-sm btn-danger" type="button" onclick="closeTrade('${esc(trade.id)}')">Encerrar</button></td>
      `;
      tbody.appendChild(tr);
    });
  }

  async function closeTrade(tradeId) {
    const current = Number(prompt('Preco atual para encerramento manual:', '0'));
    if (!current || current <= 0) return;
    const res = await fetch('/api/master-crypto/paper/close', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ trade_id: tradeId, current_market_price: current }),
    });
    if (!res.ok) {
      document.getElementById('statusLine').textContent = 'Nao foi possivel encerrar a ordem simulada.';
      return;
    }
    await loadPaperTrading();
  }

  window.addEventListener('DOMContentLoaded', loadPaperTrading);
</script>
</body>
</html>
