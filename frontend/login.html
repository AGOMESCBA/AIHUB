<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IAHub — Login</title>
  <link rel="stylesheet" href="/css/iahub.css">
  <style>
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    .spinner-sm {
      display: inline-block; width: 12px; height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .6s linear infinite;
      margin-left: 6px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empresa-label-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    .empresa-label-row .form-label { margin-bottom: 0; }

    /* Estado desabilitado do select com visual diferenciado */
    select.form-control:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .password-wrap {
      position: relative;
    }
    .password-wrap .form-control {
      padding-right: 44px;
    }
    .password-toggle {
      position: absolute;
      top: 50%;
      right: 8px;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transform: translateY(-50%);
      transition: background var(--transition), color var(--transition);
    }
    .password-toggle:hover {
      background: var(--bg-hover);
      color: var(--accent);
    }
    .password-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .password-toggle svg {
      width: 18px;
      height: 18px;
    }
  </style>
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">IA</div>
      <h1>IAHub</h1>
      <p>Plataforma de Automações Inteligentes</p>
    </div>

    <div id="login-error" class="login-error"></div>

    <form onsubmit="doLogin(event)" id="form-login" autocomplete="off">
      <div class="form-group">
        <label class="form-label">Usuário</label>
        <input id="user" type="text" class="form-control" placeholder="Digite seu usuário"
          autocomplete="username" required>
      </div>

      <div class="form-group">
        <label class="form-label">Senha</label>
        <div class="password-wrap">
          <input id="pass" type="password" class="form-control" placeholder="Digite sua senha"
            autocomplete="current-password" required>
          <button type="button" class="password-toggle" id="pass-toggle"
            onclick="toggleLoginPassword()" aria-label="Mostrar senha" title="Mostrar senha">
            <svg id="pass-eye" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <div class="empresa-label-row">
          <label class="form-label">Empresa</label>
          <span id="empresa-spinner" class="spinner-sm" style="display:none"></span>
        </div>
        <select id="empresa-select" class="form-control" disabled>
          <option value="">— Digite usuário e senha para carregar —</option>
        </select>
      </div>

      <button type="submit" class="btn-login" id="btn-login">Entrar</button>
    </form>

    <div class="login-version">IAHub v2.0 · Todos os direitos reservados</div>
  </div>

  <script>
    let _logado     = false;
    let _role       = null;
    let _checkTimer = null;
    let _bypassAdmin = false;

    // ── Se já autenticado, redireciona diretamente (não reutiliza sessão ativa) ──
    (async () => {
      const me = await fetch('/api/me').catch(() => null);
      if (!me?.ok) return;
      // Sessão ativa encontrada — redireciona sem exibir o formulário.
      // Para trocar de usuário é necessário fazer logout explicitamente.
      const dest = new URLSearchParams(location.search).get('next') || '/dashboard.html';
      location.href = dest;
    })();

    // ── Listeners: dispara verificação ao digitar ────────────────────────────────
    document.getElementById('user').addEventListener('input', ao_trocar_usuario);
    document.getElementById('pass').addEventListener('input', agendarVerificacao);
    document.getElementById('pass').addEventListener('blur',  verificarAgora);

    function toggleLoginPassword() {
      const input = document.getElementById('pass');
      const btn = document.getElementById('pass-toggle');
      const eye = document.getElementById('pass-eye');
      const mostrar = input.type === 'password';

      input.type = mostrar ? 'text' : 'password';
      btn.setAttribute('aria-label', mostrar ? 'Ocultar senha' : 'Mostrar senha');
      btn.title = mostrar ? 'Ocultar senha' : 'Mostrar senha';
      eye.innerHTML = mostrar
        ? '<path d="M17.9 17.9A10.7 10.7 0 0 1 12 19C5.5 19 2 12 2 12a18.2 18.2 0 0 1 4.2-5.2"></path><path d="M9.9 4.2A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a18.3 18.3 0 0 1-2.1 3.2"></path><path d="M14.1 14.1A3 3 0 0 1 9.9 9.9"></path><path d="M2 2l20 20"></path>'
        : '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle>';
      input.focus();
    }

    // Ao alterar o campo usuário, descarta qualquer sessão em andamento
    function ao_trocar_usuario() {
      if (_logado) {
        _logado      = false;
        _role        = null;
        _bypassAdmin = false;
        resetSelect('— Digite usuário e senha para carregar —');
        fetch('/api/logout', { method: 'POST' }).catch(() => {});
      }
      agendarVerificacao();
    }

    function agendarVerificacao() {
      clearTimeout(_checkTimer);
      const u = document.getElementById('user').value.trim();
      const p = document.getElementById('pass').value;
      if (u && p.length >= 4) {
        _checkTimer = setTimeout(verificarAgora, 600);
      } else if (!_logado) {
        resetSelect('— Digite usuário e senha para carregar —');
      }
    }

    async function verificarAgora() {
      if (_logado) return;
      clearTimeout(_checkTimer);

      const u = document.getElementById('user').value.trim();
      const p = document.getElementById('pass').value;
      if (!u || p.length < 4) return;

      mostrarSpinner(true);
      esconderErro();

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user: u, pass: p }),
        });

        if (!res.ok) {
          resetSelect('— Usuário ou senha inválidos —');
          return;
        }

        const data = await res.json();
        _role   = data.role;
        _logado = true;
        await carregarEmpresas();

      } catch (_) {
        resetSelect('— Erro de conexão —');
      } finally {
        mostrarSpinner(false);
      }
    }

    async function carregarEmpresas(autoRedirecionar = false) {
      mostrarSpinner(true);
      const empresas = await fetch('/api/empresas/minhas').then(r => r.json()).catch(() => []);
      mostrarSpinner(false);

      const sel = document.getElementById('empresa-select');

      // Admin sem empresas — entra direto para cadastrar
      if (!empresas.length && _role === 'admin') {
        _bypassAdmin = true;
        sel.innerHTML = '<option value="__admin__">🔧 Administrador — Nenhuma empresa cadastrada</option>';
        sel.disabled  = false;
        document.getElementById('btn-login').textContent = 'Entrar como Administrador';
        return;
      }

      if (!empresas.length) {
        resetSelect('— Nenhuma empresa disponível. Contate o administrador. —');
        return;
      }

      // Popula as opções (ordem alfabética)
      empresas.sort((a, b) => (a.razao_social || a.nome || '').localeCompare(b.razao_social || b.nome || '', 'pt-BR'));
      sel.innerHTML = empresas.length > 1
        ? '<option value="">— Selecione uma empresa —</option>' +
          empresas.map(e => `<option value="${e.id}">${e.razao_social || e.nome || 'Empresa'}</option>`).join('')
        : empresas.map(e => `<option value="${e.id}">${e.razao_social || e.nome || 'Empresa'}</option>`).join('');
      sel.disabled = false;

      // Auto-seleciona se só há uma empresa
      if (empresas.length === 1) {
        sel.value = String(empresas[0].id);
        if (autoRedirecionar) {
          await selecionarEAvancar(empresas[0].id);
        }
      }
    }

    function resetSelect(placeholder) {
      const sel = document.getElementById('empresa-select');
      sel.innerHTML = `<option value="">${placeholder}</option>`;
      sel.disabled  = true;
      _bypassAdmin  = false;
    }

    function mostrarSpinner(show) {
      document.getElementById('empresa-spinner').style.display = show ? 'inline-block' : 'none';
    }

    function mostrarErro(msg) {
      const el = document.getElementById('login-error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function esconderErro() {
      document.getElementById('login-error').style.display = 'none';
    }

    // ── Submit ────────────────────────────────────────────────────────────────────
    async function doLogin(e) {
      e.preventDefault();
      esconderErro();

      // Bypass admin sem empresa
      if (_bypassAdmin) {
        const dest = new URLSearchParams(location.search).get('next') || '/empresas.html';
        location.href = dest;
        return;
      }

      // Precisa estar autenticado
      if (!_logado) {
        await verificarAgora();
        if (!_logado) return;
      }

      const sel = document.getElementById('empresa-select');
      const empresaId = sel.value ? Number(sel.value) : null;

      if (!empresaId) {
        mostrarErro('Selecione uma empresa para continuar.');
        sel.focus();
        return;
      }

      await selecionarEAvancar(empresaId);
    }

    async function selecionarEAvancar(empresa_id) {
      const btn = document.getElementById('btn-login');
      btn.innerHTML = '<span class="spinner"></span>Acessando…';
      btn.disabled  = true;

      try {
        const res = await fetch('/api/empresas/selecionar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ empresa_id }),
        });
        if (!res.ok) {
          const { error } = await res.json().catch(() => ({}));
          throw new Error(error || `Erro ${res.status}`);
        }
        const dest = new URLSearchParams(location.search).get('next') || '/dashboard.html';
        location.href = dest;
      } catch (err) {
        mostrarErro(err.message || 'Erro ao selecionar empresa. Tente novamente.');
        btn.disabled    = false;
        btn.textContent = 'Entrar';
      }
    }
  </script>
</body>
</html>
