<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IAHub</title>
  <link rel="stylesheet" href="/css/iahub.css">
  <style>
    .hub-shell { min-height:100vh;background:var(--bg-base); }
    .hub-main { min-height:100vh;display:flex;flex-direction:column; }
    .hub-content { flex:1;padding:28px;max-width:1180px;width:100%;margin:0 auto; }
    .systems-head { display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:22px; }
    .systems-kicker { font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-lo);font-weight:700;margin-bottom:4px; }
    .systems-title { font-size:24px;font-weight:800;color:var(--text-hi);line-height:1.2; }
    .systems-subtitle { font-size:13px;color:var(--text-md);margin-top:6px; }
    .systems-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px; }
    .system-card {
      border:1px solid var(--border);border-radius:8px;background:var(--bg-card);
      padding:18px;display:flex;flex-direction:column;gap:12px;min-height:170px;
      box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s,transform .15s;
    }
    .system-card:hover { border-color:var(--accent);box-shadow:var(--shadow-md);transform:translateY(-1px); }
    .system-card-top { display:flex;align-items:center;gap:12px; }
    .system-icon { width:42px;height:42px;border-radius:8px;background:var(--accent-glow);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px; }
    .system-name { color:var(--text-hi);font-size:16px;font-weight:800;line-height:1.25; }
    .system-code { color:var(--text-lo);font-size:11px;margin-top:2px; }
    .system-desc { color:var(--text-md);font-size:13px;line-height:1.5;flex:1; }
    .empty-state { border:1px dashed var(--border-hi);border-radius:8px;padding:38px;text-align:center;color:var(--text-md);background:var(--bg-card); }
    .empty-title { color:var(--text-hi);font-weight:800;margin-bottom:8px; }
    @media (max-width: 640px) {
      .hub-content { padding:18px; }
      .systems-head { flex-direction:column;align-items:flex-start; }
      .systems-title { font-size:20px; }
    }
  </style>
</head>
<body>
  <div class="hub-shell">
    <main class="hub-main">
      <div class="topbar">
        <span class="topbar-title">IAHub</span>
      </div>

      <section class="hub-content">
        <div class="systems-head">
          <div>
            <div class="systems-kicker">Plataforma</div>
            <div class="systems-title">Selecione um sistema</div>
            <div class="systems-subtitle" id="systems-subtitle">Carregando sistemas disponiveis...</div>
          </div>
          <button class="btn btn-secondary" onclick="logout()">Sair</button>
        </div>

        <div class="systems-grid" id="systems-grid"></div>
      </section>
    </main>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[ch]));
    }

    function sigla(system) {
      return String(system.name || system.code || 'S').trim().slice(0, 2).toUpperCase();
    }

    async function selecionarSistema(systemCode) {
      const res = await fetch('/api/sistemas/selecionar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ system_code: systemCode }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        sessionStorage.setItem('_iahub_aviso', data.error || 'Sem acesso ao sistema selecionado.');
        location.reload();
        return;
      }
      location.href = data.redirectUrl || '/iahub.html';
    }

    async function carregarSistemas() {
      await window._iahubAuthReady;
      const grid = document.getElementById('systems-grid');
      const subtitle = document.getElementById('systems-subtitle');
      const sistemas = await fetch('/api/sistemas/disponiveis').then(r => r.json()).catch(() => []);

      subtitle.textContent = window._iahubEmpresa?.nome
        ? `Empresa ativa: ${window._iahubEmpresa.nome}`
        : 'Escolha uma empresa para continuar.';

      if (!Array.isArray(sistemas) || !sistemas.length) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1">
            <div class="empty-title">Nenhum sistema disponivel</div>
            <div>Solicite ao administrador acesso a um sistema para esta empresa.</div>
          </div>`;
        return;
      }

      grid.innerHTML = sistemas.map(system => `
        <article class="system-card">
          <div class="system-card-top">
            <div class="system-icon">${esc(sigla(system))}</div>
            <div>
              <div class="system-name">${esc(system.name)}</div>
              <div class="system-code">${esc(system.code)}</div>
            </div>
          </div>
          <div class="system-desc">${esc(system.description || '')}</div>
          <button class="btn btn-primary" onclick="selecionarSistema('${esc(system.code)}')">Acessar</button>
        </article>`).join('');
    }

    carregarSistemas();
  </script>
</body>
</html>
