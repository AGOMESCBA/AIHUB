<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selecionar Empresa — IAHub</title>
  <link rel="stylesheet" href="/css/iahub.css">
  <style>
    body.empresa-select-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-body);
    }
    .empresa-select-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 40px;
      width: min(520px, 95vw);
    }
    .empresa-select-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .empresa-select-logo .logo-icon {
      width: 40px; height: 40px;
      background: var(--accent);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 14px; color: #fff;
    }
    .empresa-select-logo h1 {
      font-size: 20px; font-weight: 700; color: var(--text-hi); margin: 0;
    }
    .empresa-select-logo p {
      font-size: 12px; color: var(--text-lo); margin: 2px 0 0;
    }
    .empresa-select-title {
      font-size: 15px; font-weight: 600; color: var(--text-hi); margin-bottom: 6px;
    }
    .empresa-select-subtitle {
      font-size: 13px; color: var(--text-lo); margin-bottom: 20px;
    }
    .empresa-list { display: flex; flex-direction: column; gap: 10px; }
    .empresa-btn {
      display: flex; align-items: center; gap: 14px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      cursor: pointer;
      text-align: left;
      width: 100%;
      transition: border-color .15s, background .15s;
    }
    .empresa-btn:hover {
      border-color: var(--accent);
      background: var(--bg-card);
    }
    .empresa-btn-icon {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .empresa-btn-nome {
      font-size: 14px; font-weight: 600; color: var(--text-hi);
    }
    .empresa-btn-doc {
      font-size: 11px; color: var(--text-lo); font-family: monospace; margin-top: 2px;
    }
    .empresa-btn-arrow {
      margin-left: auto; color: var(--text-lo); font-size: 18px;
    }
    .loading-state, .empty-state {
      text-align: center; padding: 40px 0; color: var(--text-lo);
    }
    .empresa-select-footer {
      margin-top: 28px; padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex; justify-content: flex-end;
    }
    .btn-link {
      background: none; border: none; color: var(--text-lo);
      font-size: 12px; cursor: pointer; text-decoration: underline;
    }
    .btn-link:hover { color: var(--text-hi); }
  </style>
</head>
<body class="empresa-select-page">

  <div class="empresa-select-card">
    <div class="empresa-select-logo">
      <div class="logo-icon">IA</div>
      <div>
        <h1>IAHub</h1>
        <p>Plataforma de Automações Inteligentes</p>
      </div>
    </div>

    <div class="empresa-select-title">Selecione a empresa</div>
    <div class="empresa-select-subtitle">Escolha com qual empresa deseja trabalhar nesta sessão.</div>

    <div id="empresa-list" class="empresa-list">
      <div class="loading-state">Carregando empresas…</div>
    </div>

    <div class="empresa-select-footer">
      <button class="btn-link" onclick="logout()">Sair</button>
    </div>
  </div>

  <script>
    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      location.href = '/login.html';
    }

    async function selecionar(empresa_id) {
      const res = await fetch('/api/empresas/selecionar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ empresa_id }),
      });
      if (res.ok) {
        const dest = new URLSearchParams(location.search).get('next') || '/iahub.html';
        location.href = dest;
      }
    }

    function formatDoc(doc) {
      if (!doc) return '';
      const d = doc.replace(/\D/g, '');
      if (d.length === 14) return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5');
      if (d.length === 11) return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
      return doc;
    }

    async function carregar() {
      // Verificar autenticação
      const meRes = await fetch('/api/me');
      if (!meRes.ok) { location.href = '/login.html'; return; }

      const res = await fetch('/api/empresas/minhas');
      if (!res.ok) { location.href = '/login.html'; return; }

      const empresas = await res.json();
      const list = document.getElementById('empresa-list');

      if (!empresas.length) {
        list.innerHTML = '<div class="empty-state">Nenhuma empresa disponível para o seu usuário.<br>Contate o administrador.</div>';
        return;
      }

      // Auto-seleciona se só tiver uma empresa
      if (empresas.length === 1) {
        await selecionar(empresas[0].id);
        return;
      }

      empresas.sort((a, b) => (a.razao_social || a.nome || '').localeCompare(b.razao_social || b.nome || '', 'pt-BR'));
      list.innerHTML = empresas.map(e => `
        <button class="empresa-btn" onclick="selecionar(${e.id})">
          <div class="empresa-btn-icon">🏢</div>
          <div>
            <div class="empresa-btn-nome">${e.razao_social || e.nome || 'Empresa'}</div>
            ${e.cnpj ? `<div class="empresa-btn-doc">${formatDoc(e.cnpj)}</div>` : ''}
          </div>
          <div class="empresa-btn-arrow">›</div>
        </button>
      `).join('');
    }

    carregar();
  </script>
</body>
</html>
